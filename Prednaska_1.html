<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Úvod do toxikologie — Přednáška 1</title>
<style>
  :root{
    --paper:#F4F5EF;
    --paper-deep:#ECEEE4;
    --ink:#1E2019;
    --ink-soft:#5A5D51;
    --amber:#B9791E;
    --amber-deep:#8F5D14;
    --tox-green:#3E5C42;
    --tox-green-deep:#2A3F2D;
    --danger:#9C3B2E;
    --line:#D6D6C6;
    --card:#FFFFFE;
    --serif: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', serif;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    --mono: 'SF Mono', SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    overflow:hidden;
    font-size:18px;
  }
  ::selection{ background: var(--amber); color:#fff; }

  /* top chrome */
  #topbar{
    position:fixed; top:0; left:0; right:0; height:52px;
    display:flex; align-items:center; gap:16px;
    padding:0 20px;
    z-index:50;
    background:linear-gradient(to bottom, rgba(244,245,239,0.97), rgba(244,245,239,0.85));
    border-bottom:1px solid var(--line);
  }
  #topbar .brand{
    font-family:var(--serif); font-size:15px; font-style:italic; color:var(--ink-soft);
    white-space:nowrap;
  }
  #progress-track{
    flex:1; height:3px; background:var(--line); border-radius:2px; overflow:hidden;
  }
  #progress-fill{
    height:100%; width:0%; background:var(--amber); transition:width .35s ease;
  }
  #counter{ font-family:var(--mono); font-size:12px; color:var(--ink-soft); white-space:nowrap; }
  #menu-btn{
    font-family:var(--sans); font-size:13px; color:var(--ink);
    background:var(--card); border:1px solid var(--line); border-radius:6px;
    padding:6px 12px; cursor:pointer;
  }
  #menu-btn:hover{ border-color:var(--amber); }

  /* deck */
  #deck{ position:relative; width:100%; height:100%; padding-top:52px; }
  .slide{
    position:absolute; inset:0; top:52px;
    display:flex; align-items:center; justify-content:center;
    padding:40px 8vw 90px 8vw;
    opacity:0; visibility:hidden;
    transform:translateY(14px);
    transition:opacity .4s ease, transform .4s ease;
    overflow-y:auto;
  }
  .slide.active{ opacity:1; visibility:visible; transform:translateY(0); }
  .slide-inner{ width:100%; max-width:920px; }
  .eyebrow{
    font-family:var(--mono); font-size:16px; letter-spacing:.02em; color:var(--amber-deep);
    margin:0 0 14px 0;
  }
  h1.headline{
    font-family:var(--serif); font-weight:400; font-size:clamp(32px,5vw,54px);
    line-height:1.08; margin:0 0 18px 0; color:var(--ink);
  }
  h2.headline{
    font-family:var(--serif); font-weight:400; font-size:clamp(28px,3.6vw,38px);
    line-height:1.15; margin:0 0 16px 0;
  }
  p.lede{ font-size:19px; line-height:1.55; color:var(--ink-soft); max-width:640px; }
  .body-text{ font-size:19px; line-height:1.6; color:var(--ink); max-width:720px; }
  .body-text + .body-text{ margin-top:10px; }

  /* generic components */
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:10px;
    padding:20px 22px;
  }
  .grid-2{ display:grid; grid-template-columns:1fr 1fr; gap:18px; }
  .grid-3{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
  @media (max-width:760px){ .grid-2,.grid-3{ grid-template-columns:1fr; } }

  .tag{
    display:inline-block; font-family:var(--mono); font-size:11px;
    padding:3px 8px; border-radius:20px; border:1px solid var(--line); color:var(--ink-soft);
    margin-bottom:10px;
  }
  .tag.new{ border-color:var(--danger); color:var(--danger); }

  ul.plain{ margin:0; padding-left:22px; font-size:20px; }
  ul.plain li{ margin-bottom:9px; line-height:1.5; }

  blockquote.quote{
    font-family:var(--serif); font-style:italic; font-size:26px; line-height:1.4;
    color:var(--tox-green-deep); border-left:3px solid var(--amber);
    padding-left:22px; margin:22px 0;
  }
  blockquote.quote cite{ display:block; font-size:16px; font-style:normal; color:var(--ink-soft); margin-top:8px; }

  /* nav buttons */
  #navbtns{
    position:fixed; bottom:22px; right:28px; display:flex; gap:10px; z-index:50;
  }
  .navbtn{
    width:44px; height:44px; border-radius:50%; border:1px solid var(--line);
    background:var(--card); color:var(--ink); font-size:18px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .navbtn:hover{ border-color:var(--amber); color:var(--amber-deep); }
  .navbtn:disabled{ opacity:.3; cursor:default; }

  /* overlay menu */
  #overlay{
    position:fixed; inset:0; background:rgba(30,32,25,.92); z-index:100;
    display:none; padding:60px 10vw; overflow-y:auto;
  }
  #overlay.show{ display:block; }
  #overlay h3{ font-family:var(--serif); color:#fff; font-weight:400; font-size:22px; margin-bottom:20px; }
  #overlay-list{ list-style:none; margin:0; padding:0; columns:2; column-gap:40px; }
  @media (max-width:760px){ #overlay-list{ columns:1; } }
  #overlay-list li{
    color:#EDEEE6; font-size:15px; padding:9px 0; border-bottom:1px solid rgba(255,255,255,.12);
    cursor:pointer; break-inside:avoid;
  }
  #overlay-list li span{ font-family:var(--mono); color:var(--amber); margin-right:10px; font-size:12px; }
  #overlay-list li:hover{ color:var(--amber); }
  #overlay-close{
    position:absolute; top:24px; right:32px; color:#fff; font-size:26px; background:none; border:none; cursor:pointer;
  }

  /* quiz component */
  .quiz-card{ background:var(--card); border:1px solid var(--line); border-radius:12px; padding:26px 28px; margin-top:6px; }
  .quiz-q{ font-size:19px; font-weight:600; margin-bottom:16px; line-height:1.4; }
  .quiz-opt{
    display:block; width:100%; text-align:left; padding:13px 16px; margin-bottom:10px;
    border:1px solid var(--line); border-radius:8px; background:#fff; cursor:pointer; font-size:18px;
    font-family:var(--sans); color:var(--ink);
  }
  .quiz-opt:hover{ border-color:var(--amber); }
  .quiz-opt.correct{ border-color:var(--tox-green); background:#EAF1EA; color:var(--tox-green-deep); font-weight:600; }
  .quiz-opt.wrong{ border-color:var(--danger); background:#F7EAE7; color:var(--danger); }
  .quiz-opt[disabled]{ cursor:default; }
  .quiz-feedback{ margin-top:14px; font-size:18px; line-height:1.5; color:var(--ink-soft); display:none; }
  .quiz-feedback.show{ display:block; }

  /* toxicity table */
  table.tox-table{ width:100%; border-collapse:collapse; font-size:18px; margin-top:10px; }
  table.tox-table th{ text-align:left; font-family:var(--mono); font-size:18px; color:var(--ink-soft); padding:9px 10px; border-bottom:1px solid var(--ink); }
  table.tox-table td{ padding:10px 10px; border-bottom:1px solid var(--line); line-height:1.45; }
  table.tox-table tr.highlight td{ background:#FBF0DD; font-weight:600; }
  table.tox-table tr.highlight-danger td{ background:#F7E5E0; font-weight:600; }

  /* dose graph */
  #dosegraph-wrap{ margin-top:8px; }
  #dosegraph-svg{ width:100%; height:220px; }
  .dg-point{ cursor:default; }
  .dg-point circle{ transition: r .2s ease; }
  .dg-choices{ display:flex; gap:10px; flex-wrap:wrap; margin-top:18px; }
  .dg-choice{
    padding:10px 15px; border:1px solid var(--line); border-radius:20px; background:#fff;
    cursor:pointer; font-size:18px; font-family:var(--sans);
  }
  .dg-choice:hover{ border-color:var(--amber); }
  .dg-choice.chosen-correct{ background:var(--tox-green); border-color:var(--tox-green); color:#fff; }
  .dg-choice.chosen-wrong{ background:var(--danger); border-color:var(--danger); color:#fff; }
  .dg-result{ margin-top:14px; font-size:18px; color:var(--ink-soft); min-height:24px; }

  /* IARC cards */
  .iarc-cards{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-top:14px; }
  @media (max-width:760px){ .iarc-cards{ grid-template-columns:1fr; } }
  .iarc-card{
    perspective:1000px; height:320px; cursor:pointer;
  }
  .iarc-card-inner{
    position:relative; width:100%; height:100%; transition:transform .55s; transform-style:preserve-3d;
  }
  .iarc-card.flipped .iarc-card-inner{ transform:rotateY(180deg); }
  .iarc-face{
    position:absolute; inset:0; backface-visibility:hidden; border-radius:10px;
    border:1px solid var(--line); padding:16px; display:flex; flex-direction:column; justify-content:space-between;
  }
  .iarc-front{ background:var(--card); }
  .iarc-back{ background:var(--tox-green-deep); color:#EFEFE6; transform:rotateY(180deg); font-size:18px; line-height:1.5; overflow-y:auto; }
  .iarc-group{ font-family:var(--mono); font-size:18px; color:var(--amber-deep); }
  .iarc-name{ font-family:var(--serif); font-size:21px; }
  .iarc-hint{ font-size:14px; color:var(--ink-soft); }

  .gasoline-banner{
    margin-top:18px; border:1px solid var(--danger); background:#FBF0EC; border-radius:10px; padding:16px 18px;
  }
  .gasoline-banner .tag.new{ margin-bottom:6px; }

  /* timeline */
  #timeline-track{ display:flex; gap:14px; overflow-x:auto; padding:18px 4px 10px 4px; margin-top:10px; }
  .tl-item{
    min-width:190px; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 16px;
    cursor:pointer; flex-shrink:0;
  }
  .tl-item .tl-year{ font-family:var(--mono); font-size:18px; color:var(--amber-deep); }
  .tl-item .tl-title{ font-family:var(--serif); font-size:20px; margin:4px 0 8px 0; }
  .tl-item .tl-detail{ font-size:19px; color:var(--ink-soft); line-height:1.5; display:none; }
  .tl-item.open .tl-detail{ display:block; }
  .tl-item.open{ border-color:var(--amber); }

  /* ranking task */
  .rank-list{ list-style:none; margin:14px 0 0 0; padding:0; max-width:600px; }
  .rank-item{
    display:flex; align-items:center; gap:12px; background:var(--card); border:1px solid var(--line);
    border-radius:8px; padding:11px 14px; margin-bottom:8px; font-size:18px;
  }
  .rank-item .rank-arrows{ display:flex; flex-direction:column; gap:2px; margin-left:auto; }
  .rank-item button{
    border:1px solid var(--line); background:#fff; border-radius:5px; width:26px; height:22px; cursor:pointer; font-size:12px;
  }
  .rank-item.correct{ border-color:var(--tox-green); background:#EAF1EA; }
  .rank-item.wrong{ border-color:var(--danger); background:#F7EAE7; }
  .rank-check{
    margin-top:16px; background:var(--ink); color:#fff; border:none; padding:12px 22px; border-radius:8px;
    font-size:17px; cursor:pointer;
  }
  .rank-check:hover{ background:var(--amber-deep); }

  /* why-study checklist */
  .why-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:14px; }
  @media (max-width:760px){ .why-grid{ grid-template-columns:1fr; } }
  .why-item{
    background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px 14px;
    font-size:18px; cursor:pointer; transition:background .15s;
  }
  .why-item.picked{ background:#FBF0DD; border-color:var(--amber); }
  #why-count{ margin-top:12px; font-size:16px; color:var(--ink-soft); font-family:var(--mono); }

  .footer-note{ margin-top:26px; font-size:18px; color:var(--ink-soft); font-family:var(--mono); line-height:1.5; }
  .two-col-story{ display:grid; grid-template-columns:1.1fr .9fr; gap:34px; align-items:start; }
  @media (max-width:800px){ .two-col-story{ grid-template-columns:1fr; } }
  .mushroom-box{
    background:var(--tox-green-deep); color:#EFEFE6; border-radius:12px; padding:22px 24px;
  }
  .mushroom-box h3{ font-family:var(--serif); font-weight:400; font-size:21px; margin:0 0 10px 0; color:#fff; }
  .mushroom-box p{ font-size:18px; line-height:1.6; margin:0 0 10px 0; }
  .mushroom-box .stat{ font-family:var(--mono); font-size:15px; color:#D9C58F; }

  .sources{ font-size:14.5px; color:var(--ink-soft); line-height:1.7; }
  .sources a{ color:var(--ink-soft); }

  @media (prefers-reduced-motion: reduce){
    .slide, .iarc-card-inner, .navbtn, #progress-fill{ transition:none !important; }
  }
</style>
</head>
<body>

<div id="topbar">
  <div class="brand">Úvod do toxikologie · Přednáška 1</div>
  <div id="progress-track"><div id="progress-fill"></div></div>
  <div id="counter">1 / 19</div>
  <button id="menu-btn" onclick="toggleOverlay(true)">Obsah</button>
</div>

<div id="deck"></div>

<div id="navbtns">
  <button class="navbtn" id="prevBtn" onclick="prevSlide()">←</button>
  <button class="navbtn" id="nextBtn" onclick="nextSlide()">→</button>
</div>

<div id="overlay">
  <button id="overlay-close" onclick="toggleOverlay(false)">×</button>
  <h3>Přeskočit na</h3>
  <ul id="overlay-list"></ul>
</div>

<script>
const slides = [];

function slide(id, title, html){ slides.push({id, title, html}); }

/* ---------- 0. TITLE ---------- */
slide('title','Titulní strana', `
  <div class="slide-inner">
    <p class="eyebrow">Ing. Pavla Fojtíková, Ph.D. · Přírodovědecká fakulta JU </p>
    <h1 class="headline">Úvod do toxikologie</h1>
    <p class="lede">Přednáška 1 — vymezení pojmů, závislost účinku na dávce, otrava a její druhy, práce s odborným textem, vznik toxikologie.</p>
    <p class="footer-note">Laboratoř analytické a environmentální chemie</p>
  </div>
`);

/* ---------- 1. COURSE OUTLINE ---------- */
slide('course-outline','Osnova kurzu', `
  <div class="slide-inner">
    <p class="eyebrow">Osnova kurzu</p>
    <h2 class="headline">10 témat, jedna interdisciplinární přednáška</h2>
    <div class="grid-2">
      <ul class="plain">
        <li>Vymezení základních pojmů, co je to toxikologie</li>
        <li>Jak jedy působí</li>
        <li>Osud cizorodých látek v živém organismu</li>
        <li>Chemické přeměny cizorodých látek v organismu: biotransformační enzymy a reakce</li>
        <li>Metody měření expozice, biologické monitorování</li>
        <li>Metody zjišťování a predikce toxicity látek</li>
      </ul>
      <ul class="plain">
        <li>Zdroje toxikologických dat, interpretace a využití dat k analýze rizika, výpočetní nástroje pro predikci toxicity</li>
        <li>Orgánová toxicita</li>
        <li>Neurotoxicita, mutagenita a karcinogenita</li>
        <li>Jedy v chemických laboratořích</li>
        <li>Toxikokinetika a toxikodynamika aktuálně užívaných návykových látek</li>
      </ul>
    </div>
  </div>
`);

/* ---------- 1b. SCHEDULE / REQUIREMENTS ---------- */
slide('schedule','Harmonogram a požadavky', `
  <div class="slide-inner">
    <p class="eyebrow">Harmonogram semestru a požadavky</p>
    <h2 class="headline">Důležité termíny</h2>
    <div class="schedule-track" style="display:flex;gap:14px;overflow-x:visible;flex-wrap:wrap;padding:18px 4px 10px 4px;margin-top:10px;">
      <div class="tl-item open" style="cursor:default;min-width:210px;">
        <div class="tl-year">20. října - Přednáška odpadá</div>
        <div class="tl-detail" style="display:block;">Čas na zpracování úkolu „toxikokinetika a toxikodynamika aktuálně užívaných drog" — každý dostane individuální konkrétní zadání.</div>
      </div>
      <div class="tl-item open" style="cursor:default;min-width:210px;">
        <div class="tl-year">3. listopadu - Test 1</div>
        <div class="tl-detail" style="display:block;">Látka probraná do konce října.</div>
      </div>
      <div class="tl-item open" style="cursor:default;min-width:210px;">
        <div class="tl-year">8. prosince - Diskusní a prezentační přednáška</div>
        <div class="tl-detail" style="display:block;">Prostor pro prezentaci a diskuzi — možnost splnit část ústní zkoušky.</div>
      </div>
      <div class="tl-item open" style="cursor:default;min-width:210px;">
        <div class="tl-year">15. prosince - Test 2</div>
        <div class="tl-detail" style="display:block;">Látka probraná v listopadu a prosinci.</div>
      </div>
    </div>
    <div class="card" style="margin-top:22px;">
      <p class="body-text" style="margin:0 0 10px 0;"><strong>Podmínka splnění:</strong> u každého testu min. <strong>60&nbsp;%, známka dle součtu %</strong>.</p>
      <p class="body-text" style="margin:0;">Při nesplnění → souhrnný test ve zkouškovém období.</p>
         <p class="body-text" style="margin:0;">
         Ústní zkouška - zkouškové období nebo lze splnit rovněž během semestru - aktivní účast při prezentaci úkolů, prezentační a diskuzní přednáška.</p>
    </div>
  </div>
`);

/* ---------- 2. LECTURE 1 OUTLINE ---------- */
slide('lecture1-outline','Osnova přednášky 1', `
  <div class="slide-inner">
    <p class="eyebrow">Dnes</p>
    <h2 class="headline">Osnova přednášky 1</h2>
    <ul class="plain" style="font-size:20px;">
      <li>Definice toxikologie, základní pojmy</li>
      <li>Závislost účinku na dávce — a proč to není samozřejmost (Paracelsus × muchomůrka zelená)</li>
      <li>Otrava a její druhy</li>
      <li>Toluen, xylen, styren — práce s odborným textem</li>
      <li>Vznik toxikologie, historický vývoj</li>
    </ul>
    
  </div>
`);

/* ---------- 3. WHY STUDY (interactive) ---------- */
slide('why-study','Proč studuji toxikologii?', `
  <div class="slide-inner">
    <p class="eyebrow">Než začneme</p>
    <h2 class="headline">Proč studuji toxikologii?</h2>
    <p class="body-text">Klikněte na důvody, které se vás týkají.</p>
    <div class="why-grid" id="why-grid"></div>
    <div id="why-count">vybráno: 0</div>
  </div>
`);

/* ---------- 4. DEFINITIONS ---------- */
slide('definitions','Vymezení základních pojmů', `
  <div class="slide-inner">
    <p class="eyebrow">Vymezení základních pojmů</p>
    <h2 class="headline">Toxikologie, ekotoxikologie, toxin</h2>
    <div class="grid-2">
      <div class="card">
        <div class="iarc-group">TOXIKOLOGIE</div>
        <ul class="plain" style="margin-top:8px;">
          <li>studuje nepříznivé účinky <em>xenobiotik</em> na živý organismus</li>
          <li>xenobiotikum = látka pro organismus „cizí"</li>
          <li>toxikodynamika — proč látka vyvolává otravu</li>
          <li>toxikokinetika — osud xenobiotika v organismu (časový průběh, koncentrace v kompartmentech)</li>
          <li>interdisciplinární obor, vyčlenil se z lékařství</li>
        </ul>
      </div>
      <div class="card">
        <div class="iarc-group">EKOTOXIKOLOGIE</div>
        <p class="body-text" style="margin-top:8px;">Studuje účinky chemických látek v životním prostředí komplexně — od buněk až po celý ekosystém (populace, společenstva, biosféra).</p>
        <div class="iarc-group" style="margin-top:16px;">TOXIN</div>
        <p class="body-text" style="margin-top:6px;">Jed pocházející z živé přírody.</p>
      </div>
    </div>
  </div>
`);

/* ---------- 5. NOT A POISON ---------- */
slide('not-poison','Co není jedem?', `
  <div class="slide-inner">
    <p class="eyebrow">Co není jedem?</p>
    <blockquote class="quote">Všechny látky jsou jedy, je to jen dávkou, když nějaká látka přestává být jedem.<cite>Paracelsus</cite></blockquote>
    <p class="body-text">Nelze striktně rozlišovat mezi látkami prospěšnými a toxickými (kuchyňská sůl, voda, léčiva) — toxikologie rozlišuje stupně toxicity podle dávky, která poškozuje organismus.</p>
    <div class="card" style="margin-top:18px;">
      <p class="body-text" style="margin:0;"><strong>Definice jedu:</strong> látka, která již v malé dávce nebo koncentraci, při jednorázové nebo opakované expozici, vyvolává těžké poškození organismu nebo jeho zánik.</p>
    </div>
  </div>
`);

/* ---------- 6. STORY: PARACELSUS + AMANITA ---------- */
slide('story','Příběh: dávka, nebo něco jiného?', `
  <div class="slide-inner">
    <p class="eyebrow">Toxikologický příběh</p>
    <h2 class="headline">Paracelsus a jeho kontrapunkt</h2>
    <div class="two-col-story">
      <div>

        <h3>Muchomůrka zelená<br><em>Amanita phalloides</em></h3>
        <p>Zodpovídá za většinu smrtelných otrav houbami na světě. <br>Hlavní toxin — <strong>α-amanitin</strong> — blokuje RNA polymerázu II, buňka přestává syntetizovat bílkoviny a postupně odumírá. Nejvíce zasažena játra a ledviny.</p>

      </div>
    </div>
    <p class="body-text" style="margin-top:22px;">Paracelsus měl pravdu v principu — účinek skutečně závisí na dávce. Muchomůrka jen ukazuje, že u některých látek je ta „bezpečná" dávka tak nízká, že se v praxi chová jako binární přepínač: nic, nebo život ohrožující stav. To je důvod, proč vedle dávky sledujeme i <strong>mechanismus účinku</strong> a <strong>cílový orgán</strong>.</p>

`);

slide('poisoning-types','Otrava a její druhy', `

    <div class="grid-2">
      <div class="card">
        <p class="body-text" style="margin-top:0;"><strong>Reverzibilní × ireverzibilní poškození</strong><br>jaterní buňky mají značnou regenerační schopnost, a proto se játra po mírném nebo omezeném akutním poškození mohou významně obnovit. Při rozsáhlém nebo dlouhodobém poškození však může být regenerace jater nedostatečná a může dojít k&nbsp;trvalému poškození, například k fibróze nebo cirhóze.<br>Naproti tomu zralé neurony centrálního nervového systému mají jen velmi omezenou schopnost regenerovat poškozené axony a obnovovat původní nervová spojení. To přispívá k tomu, že některá poškození CNS mohou mít trvalé následky.</p>
      </div>
      <div class="card">
        <p class="body-text" style="margin-top:0;"><strong>Lokální × systémový účinek</strong><br>lokální účinek vzniká přímo v místě prvního kontaktu organismu s toxickou látkou, například na kůži, sliznicích, v očích nebo v dýchacích cestách. Typickým příkladem jsou dráždivé a žíravé látky.

<br>Systémový účinek vzniká po vstřebání látky do organismu a její distribuci krví do vzdálených tkání a orgánů. Příkladem je poškození jater, ledvin nebo nervového systému po absorpci toxické látky.

<br>Jedna látka může vyvolat lokální i systémové účinky současně. Primárně lokální poškození může navíc za určitých okolností vést k sekundárním systémovým účinkům.</p>

/* ================= RENDER DECK ================= */
const deck = document.getElementById('deck');
slides.forEach((s,i)=>{
  const el = document.createElement('div');
  el.className = 'slide';
  el.id = 'slide-'+i;
  el.innerHTML = s.html;
  deck.appendChild(el);
});
const overlayList = document.getElementById('overlay-list');
slides.forEach((s,i)=>{
  const li = document.createElement('li');
  li.innerHTML = '<span>'+String(i+1).padStart(2,'0')+'</span>'+s.title;
  li.onclick = ()=>{ goTo(i); toggleOverlay(false); };
  overlayList.appendChild(li);
});

let current = 0;
function render(){
  document.querySelectorAll('.slide').forEach((el,i)=>{
    el.classList.toggle('active', i===current);
  });
  document.getElementById('progress-fill').style.width = ((current+1)/slides.length*100)+'%';
  document.getElementById('counter').textContent = (current+1)+' / '+slides.length;
  document.getElementById('prevBtn').disabled = current===0;
  document.getElementById('nextBtn').disabled = current===slides.length-1;
  initSlideWidgets(current);
}
function goTo(i){ current = Math.max(0, Math.min(slides.length-1, i)); render(); }
function nextSlide(){ goTo(current+1); }
function prevSlide(){ goTo(current-1); }
document.addEventListener('keydown', (e)=>{
  if(document.getElementById('overlay').classList.contains('show')){
    if(e.key==='Escape') toggleOverlay(false);
    return;
  }
  if(e.key==='ArrowRight' || e.key===' ') nextSlide();
  if(e.key==='ArrowLeft') prevSlide();
  if(e.key==='Escape') toggleOverlay(false);
});
function toggleOverlay(show){
  document.getElementById('overlay').classList.toggle('show', show);
}

function initSlideWidgets(i){
  const id = slides[i].id;

function initQuiz(cardId, feedbackId, correctMsg, wrongMsg){
  const card = document.getElementById(cardId);
  const opts = card.querySelectorAll('.quiz-opt');
  opts.forEach(btn=>{
    btn.addEventListener('click', ()=>{

/* ---- dose graph ---- */
function initDoseGraph(){
  // log scale from 0.05 to 20000 mg/kg, generous margins + staggered labels so text never crosses the frame
  const categories = [
    {name:'Prakticky netoxické', val:20000, ex:'silikagel'},
    {name:'Málo toxické', val:8000, ex:'ethanol'},
    {name:'Mírně toxické', val:1500, ex:'NaCl, aspirin'},
    {name:'Silně toxické', val:200, ex:'kofein, morfin'},
    {name:'Extrémně toxické', val:20, ex:'fenol, KCN'},
    {name:'Supertoxické', val:2, ex:'nikotin, sarin'}
  ];
  const xMin = Math.log10(0.05), xMax = Math.log10(20000);
  const padL = 90, padR = 90, axisY = 150;
  function xPos(v){ return padL + (Math.log10(v)-xMin)/(xMax-xMin)*(1000-padL-padR); }
  const svg = document.getElementById('dosegraph-svg');
  let markup = `<line x1="${padL}" y1="${axisY}" x2="${1000-padR}" y2="${axisY}" stroke="#5A5D51" stroke-width="1.5"/>`;
  categories.forEach((c,i)=>{
    const x = xPos(c.val);
    const upper = i % 2 === 0; // alternate rows so neighbouring labels never overlap
    const nameY = upper ? 95 : 130;
    const exY = upper ? 178 : 205;
    markup += `<g class="dg-point">
      <line x1="${x}" y1="${axisY}" x2="${x}" y2="${upper? nameY+8 : axisY-16}" stroke="#D6D6C6" stroke-width="1"/>
      <circle cx="${x}" cy="${axisY}" r="6" fill="#3E5C42"/>
      <text x="${x}" y="${nameY}" font-size="17" text-anchor="middle" fill="#1E2019" font-family="sans-serif">${c.name}</text>
      <text x="${x}" y="${exY}" font-size="17" text-anchor="middle" fill="#5A5D51" font-family="monospace">${c.ex}</text></g>`;
  });
  markup += `<g id="amanitin-marker" opacity="0"></g>`;
  svg.innerHTML = markup;

  const choices = document.getElementById('dg-choices');
  categories.slice().reverse().forEach(c=>{
    const b = document.createElement('button');
    b.className='dg-choice';
    b.textContent = c.name;
    b.onclick = ()=>{
      const correct = c.name === 'Supertoxické';
      document.querySelectorAll('.dg-choice').forEach(x=>x.disabled=true);
      b.classList.add(correct ? 'chosen-correct' : 'chosen-wrong');
      const x = Math.max(padL+40, xPos(0.1));
      document.getElementById('amanitin-marker').innerHTML =
        `<line x1="${x}" y1="${axisY}" x2="${x}" y2="60" stroke="#9C3B2E" stroke-width="1" stroke-dasharray="3 3"/>
         <circle cx="${x}" cy="${axisY}" r="7" fill="#9C3B2E"/>
         <text x="${x}" y="50" font-size="13" text-anchor="middle" fill="#9C3B2E" font-family="sans-serif" font-weight="bold">α-amanitin</text>
         <text x="${x}" y="68" font-size="12" text-anchor="middle" fill="#9C3B2E" font-family="monospace">LD50≈0,1 mg/kg</text>`;
      document.getElementById('amanitin-marker').setAttribute('opacity','1');
      document.getElementById('dg-result').textContent = correct
        ? 'Správně — α-amanitin (LD50 ≈ 0,1 mg/kg) spadá hluboko do kategorie supertoxických látek, na úroveň sarinu či botulotoxinu.'
        : 'Ne tak docela — α-amanitin s LD50 ≈ 0,1 mg/kg patří do kategorie supertoxických látek (< 5 mg/kg), viz nově umístěný bod v grafu.';
    };
    choices.appendChild(b);
  });
}

/* ---- repeated-dose PK accumulation graph ---- */
function computePKcurve(dose, halfLife, interval, totalHours, stepsPerHour){
  const k = Math.log(2)/halfLife;
  const dt = 1/stepsPerHour;
  const n = Math.round(totalHours*stepsPerHour);
  const points = [];
  let nextDoseTime = 0;
  let conc = 0;
  for(let i=0;i<=n;i++){
    const t = i*dt;
    if(t >= nextDoseTime - 1e-9){
      conc += dose;
      nextDoseTime += interval;
    }
    points.push([t, conc]);
    conc = conc*Math.exp(-k*dt);
  }
  return points;
}
function initPKGraph(){
  const totalHours = 24, stepsPerHour = 20;
  const caffeine = computePKcurve(100, 5, 4, totalHours, stepsPerHour);
  const nicotine = computePKcurve(2, 2, 4, totalHours, stepsPerHour);
  const maxC = Math.max(...caffeine.map(p=>p[1]));
  const maxN = Math.max(...nicotine.map(p=>p[1]));
  const padL=50, padB=34, padT=16, w=640, h=210;
  function toPath(points, maxVal){
    return points.map((p,i)=>{
      const x = padL + (p[0]/totalHours)*(w-padL-10);
      const y = padT + (h-padT-padB) - (p[1]/maxVal)*(h-padT-padB);
      return (i===0?'M':'L')+x.toFixed(1)+' '+y.toFixed(1);
    }).join(' ');
  }
  const svg = document.getElementById('pk-svg');
  let markup = '';
  markup += `<line x1="${padL}" y1="${padT+h-padT-padB}" x2="${w}" y2="${padT+h-padT-padB}" stroke="#5A5D51" stroke-width="1.5"/>`;
  markup += `<line x1="${padL}" y1="${padT}" x2="${padL}" y2="${padT+h-padT-padB}" stroke="#5A5D51" stroke-width="1.5"/>`;
  for(let t=0;t<=totalHours;t+=4){
    const x = padL + (t/totalHours)*(w-padL-10);
    markup += `<text x="${x}" y="${h-padB+16}" font-size="17" text-anchor="middle" fill="#5A5D51" font-family="monospace">${t}h</text>`;
  }
  markup += `<path d="${toPath(caffeine,maxC)}" fill="none" stroke="#8F5D14" stroke-width="2.5"/>`;
  markup += `<path d="${toPath(nicotine,maxN)}" fill="none" stroke="#3E5C42" stroke-width="2.5" stroke-dasharray="5 3"/>`;
  markup += `<text x="${w-150}" y="${padT+300}" font-size="17" text-anchor="end" fill="#8F5D14" font-family="monospace">kofein (t½≈5h)</text>`;
  markup += `<text x="${w-10}" y="${padT+300}" font-size="17" text-anchor="end" fill="#3E5C42" font-family="monospace">nikotin (t½≈2h)</text>`;
  const midY = padT + (h-padT-padB)/2;
  markup += `<text x="18" y="${midY}" font-size="17" text-anchor="middle" fill="#5A5D51" transform="rotate(-90 18 ${midY})">relativní koncentrace</text>`;
  markup += `<text x="${w/2}" y="${h+18}" font-size="17" text-anchor="middle" fill="#5A5D51">čas (hodiny), dávka à 4 h</text>`;
  svg.innerHTML = markup;
  document.getElementById('pk-legend').textContent =
    'Obě látky dosahují po několika dávkách ustáleného stavu (steady state), ale s výrazně odlišnou dynamikou: kofein s delším poločasem se mezi dávkami stihne odbourat méně, a proto se v těle drží na poměrně vysoké hladině po celý den; nikotin s kratším poločasem klesá mezi dávkami rychle téměř k nule.';
}

/* ---- orders-of-magnitude chart ---- */
function initMagnitudeChart(){
  const items = [
    {name:'NaCl (kuchyňská sůl)', val:3000, origin:'synthetic'},
    {name:'Ethanol', val:7000, origin:'synthetic'},
    {name:'Kofein', val:192, origin:'synthetic'},
    {name:'Nikotin', val:3, origin:'natural'},
    {name:'α-amanitin (muchomůrka)', val:0.1, origin:'natural'},
    {name:'Ricin (skočec)', val:0.005, origin:'natural'},
    {name:'Botulotoxin', val:0.000001, origin:'natural'}
  ];
  const xMin = Math.log10(0.0000005), xMax = Math.log10(10000);
  const padL=230, padR=40, w=900, rowH=34, top=20;
  function xPos(v){ return padL + (Math.log10(v)-xMin)/(xMax-xMin)*(w-padL-padR); }
  let markup = '';
  items.forEach((it,i)=>{
    const y = top + i*rowH + rowH/2;
    const x = xPos(it.val);
    const color = it.origin==='natural' ? '#3E5C42' : '#8F5D14';
    markup += `<line x1="${padL}" y1="${y}" x2="${w-padR}" y2="${y}" stroke="#D6D6C6" stroke-width="1"/>`;
    markup += `<text x="${padL-14}" y="${y+4}" font-size="17" text-anchor="end" fill="#1E2019" font-family="sans-serif">${it.name}</text>`;
    markup += `<line x1="${padL}" y1="${y}" x2="${x}" y2="${y}" stroke="${color}" stroke-width="2" opacity="0.55"/>`;
    markup += `<circle cx="${x}" cy="${y}" r="7" fill="${color}"/>`;
    markup += `<text x="${x}" y="${y-12}" font-size="17" text-anchor="middle" fill="${color}" font-family="monospace">${it.val<0.001? it.val.toExponential(0): it.val}</text>`;
  });
  // axis
  const axisY = top + items.length*rowH + 6;
  markup += `<line x1="${padL}" y1="${axisY}" x2="${w-padR}" y2="${axisY}" stroke="#5A5D51" stroke-width="1.5"/>`;
  [0.000001,0.0001,0.01,1,100,10000].forEach(v=>{
    const x = xPos(v);
    markup += `<line x1="${x}" y1="${axisY}" x2="${x}" y2="${axisY-4}" stroke="#5A5D51" stroke-width="1"/>`;
    markup += `<text x="${x}" y="${axisY+16}" font-size="17" text-anchor="middle" fill="#5A5D51" font-family="monospace">${v}</text>`;
  });
  markup += `<text x="${(padL+w-padR)/2}" y="${axisY+34}" font-size="17" text-anchor="middle" fill="#5A5D51">letální dávka (mg/kg, log škála)</text>`;
  document.getElementById('magnitude-svg').setAttribute('viewBox', `0 0 900 ${axisY+45}`);
  document.getElementById('magnitude-svg').innerHTML = markup;
  document.getElementById('magnitude-legend').innerHTML =
    '<span style="color:#8F5D14;">●</span> syntetická / běžná látka &nbsp;&nbsp; <span style="color:#3E5C42;">●</span> přírodní původ (rostlina, houba, bakterie)';
}

     a:'Nejprve se experimentálně nebo z epidemiologických dat stanoví NOAEL — nejvyšší dávka, při níž se ještě neprojeví škodlivý účinek. NOAEL se vydělí faktorem nejistoty (typicky 100), čímž se získá přijatelný denní příjem (ADI/TDI). Z ADI/TDI a předpokládané spotřeby dané potraviny se pak zpětně dopočítá MRL tak, aby ani při realistickém scénáři expozice nebyla ADI překročena. Celý postup je přímou aplikací dávkově-účinkové křivky, kterou Paracelsus formuloval kvalitativně již v 16. století.'}
  ];
  const wrap = document.getElementById('discussion-list');
  qa.forEach((item,i)=>{
    const div = document.createElement('div');
    div.className = 'tl-item';
    div.style.cssText = 'min-width:auto;width:100%;margin-bottom:10px;';
    div.innerHTML = `<div class="tl-year">Otázka ${i+1}</div><div class="tl-title" style="font-size:18px;">${item.q}</div><div class="tl-detail"><strong>Řešení:</strong> ${item.a}</div>`;
    div.onclick = ()=> div.classList.toggle('open');
    wrap.appendChild(div);
  });
}

/* ---- ranking task ---- */
let rankOrder = [];
const rankData = [
  {name:'Ethanol', ld:8000},
  {name:'Aspirin', ld:1500},
  {name:'Kofein', ld:200},
  {name:'Fenol', ld:20},
  {name:'Nikotin', ld:2},
  {name:'α-amanitin', ld:0.1}
];
function initRanking(){
  rankOrder = [1,4,2,0,5,3]; // shuffled starting indices into rankData
  renderRanking();
}
function renderRanking(){
  const list = document.getElementById('rank-list');
  list.innerHTML = '';
  rankOrder.forEach((idx,pos)=>{
    const item = rankData[idx];
    const li = document.createElement('li');
    li.className = 'rank-item';
    li.innerHTML = `<span>${pos+1}. ${item.name}</span>
      <div class="rank-arrows">
        <button onclick="moveRank(${pos},-1)">↑</button>
        <button onclick="moveRank(${pos},1)">↓</button>
      </div>`;
    list.appendChild(li);
  });
}
function moveRank(pos, dir){
  const newPos = pos+dir;
  if(newPos<0 || newPos>=rankOrder.length) return;
  [rankOrder[pos], rankOrder[newPos]] = [rankOrder[newPos], rankOrder[pos]];
  renderRanking();
  document.getElementById('rank-result').textContent = '';
}
function checkRanking(){
  const correctOrder = rankData.map((_,i)=>i).sort((a,b)=>rankData[b].ld-rankData[a].ld);
  const items = document.querySelectorAll('#rank-list .rank-item');
  let allCorrect = true;
  rankOrder.forEach((idx,pos)=>{
    const ok = idx === correctOrder[pos];
    items[pos].classList.remove('correct','wrong');
    items[pos].classList.add(ok?'correct':'wrong');
    if(!ok) allCorrect=false;
  });
  document.getElementById('rank-result').textContent = allCorrect
    ? 'Přesně tak — od ethanolu (LD50 ≈ 8 000 mg/kg) po α-amanitin (≈ 0,1 mg/kg) je to rozpětí přes 4 řády.'
    : 'Zelené položky sedí, oranžové/červené ještě přerovnejte.';
}

render();
