<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Osud cizorodých látek v organismu — Přednáška 3</title>
<style>
  :root{
    --paper:#F4F5EF;
    --paper-deep:#ECEEE4;
    --ink:#1E2019;
    --ink-soft:#5A5D51;
    --amber:#B9791E;
    --amber-deep:#8F5D14;
    --tox-green:#3E5C42;
    --tox-green-deep:#2A3F2D;
    --danger:#9C3B2E;
    --blue:#3A5A72;
    --blue-deep:#233C4E;
    --line:#D6D6C6;
    --card:#FFFFFE;
    --serif: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', serif;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    --mono: 'SF Mono', SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans);
    overflow:hidden; font-size:18px;
  }
  ::selection{ background: var(--amber); color:#fff; }

  #topbar{
    position:fixed; top:0; left:0; right:0; height:54px;
    display:flex; align-items:center; gap:16px; padding:0 20px; z-index:50;
    background:linear-gradient(to bottom, rgba(244,245,239,0.97), rgba(244,245,239,0.85));
    border-bottom:1px solid var(--line);
  }
  #topbar .brand{ font-family:var(--serif); font-size:16px; font-style:italic; color:var(--ink-soft); white-space:nowrap; }
  #progress-track{ flex:1; height:3px; background:var(--line); border-radius:2px; overflow:hidden; }
  #progress-fill{ height:100%; width:0%; background:var(--amber); transition:width .35s ease; }
  #counter{ font-family:var(--mono); font-size:13px; color:var(--ink-soft); white-space:nowrap; }
  #menu-btn{
    font-family:var(--sans); font-size:14px; color:var(--ink); background:var(--card);
    border:1px solid var(--line); border-radius:6px; padding:6px 12px; cursor:pointer;
  }
  #menu-btn:hover{ border-color:var(--amber); }

  #deck{ position:relative; width:100%; height:100%; padding-top:54px; }
  .slide{
    position:absolute; inset:0; top:54px; display:flex; align-items:center; justify-content:center;
    padding:36px 7vw 90px 7vw; opacity:0; visibility:hidden; transform:translateY(14px);
    transition:opacity .4s ease, transform .4s ease; overflow-y:auto;
  }
  .slide.active{ opacity:1; visibility:visible; transform:translateY(0); }
  .slide-inner{ width:100%; max-width:1000px; }
  .eyebrow{ font-family:var(--mono); font-size:16px; letter-spacing:.02em; color:var(--amber-deep); margin:0 0 12px 0; }
  h1.headline{ font-family:var(--serif); font-weight:400; font-size:clamp(30px,4.6vw,50px); line-height:1.1; margin:0 0 16px 0; }
  h2.headline{ font-family:var(--serif); font-weight:400; font-size:clamp(24px,3.2vw,34px); line-height:1.18; margin:0 0 16px 0; }
  p.lede{ font-size:19px; line-height:1.55; color:var(--ink-soft); max-width:700px; }
  .body-text{ font-size:19px; line-height:1.6; color:var(--ink); max-width:760px; }
  .body-text + .body-text{ margin-top:10px; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:10px; padding:20px 22px; }
  .grid-2{ display:grid; grid-template-columns:1fr 1fr; gap:18px; }
  .grid-3{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
  .grid-4{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
  @media (max-width:800px){ .grid-2,.grid-3,.grid-4{ grid-template-columns:1fr; } }
  .tag{ display:inline-block; font-family:var(--mono); font-size:12px; padding:3px 9px; border-radius:20px; border:1px solid var(--line); color:var(--ink-soft); margin-bottom:10px; }
  .tag.new{ border-color:var(--danger); color:var(--danger); }
  ul.plain{ margin:0; padding-left:22px; font-size:18px; }
  ul.plain li{ margin-bottom:9px; line-height:1.5; }
  blockquote.quote{ font-family:var(--serif); font-style:italic; font-size:26px; line-height:1.4; color:var(--tox-green-deep); border-left:3px solid var(--amber); padding-left:22px; margin:22px 0; }
  blockquote.quote cite{ display:block; font-size:15px; font-style:normal; color:var(--ink-soft); margin-top:8px; }
  #navbtns{ position:fixed; bottom:22px; right:28px; display:flex; gap:10px; z-index:50; }
  .navbtn{ width:46px; height:46px; border-radius:50%; border:1px solid var(--line); background:var(--card); color:var(--ink); font-size:19px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .navbtn:hover{ border-color:var(--amber); color:var(--amber-deep); }
  .navbtn:disabled{ opacity:.3; cursor:default; }
  #overlay{ position:fixed; inset:0; background:rgba(30,32,25,.94); z-index:100; display:none; padding:56px 8vw; overflow-y:auto; }
  #overlay.show{ display:block; }
  #overlay h3{ font-family:var(--serif); color:#fff; font-weight:400; font-size:23px; margin-bottom:20px; }
  #overlay-list{ list-style:none; margin:0; padding:0; columns:2; column-gap:40px; }
  @media (max-width:800px){ #overlay-list{ columns:1; } }
  #overlay-list li{ color:#EDEEE6; font-size:16px; padding:9px 0; border-bottom:1px solid rgba(255,255,255,.12); cursor:pointer; break-inside:avoid; }
  #overlay-list li span{ font-family:var(--mono); color:var(--amber); margin-right:10px; font-size:13px; }
  #overlay-list li:hover{ color:var(--amber); }
  #overlay-close{ position:absolute; top:22px; right:30px; color:#fff; font-size:28px; background:none; border:none; cursor:pointer; }

  .quiz-card{ background:var(--card); border:1px solid var(--line); border-radius:12px; padding:24px 26px; margin-top:10px; }
  .quiz-q{ font-size:19px; font-weight:600; margin-bottom:16px; line-height:1.45; }
  .quiz-opt{ display:block; width:100%; text-align:left; padding:13px 16px; margin-bottom:10px; border:1px solid var(--line); border-radius:8px; background:#fff; cursor:pointer; font-size:18px; font-family:var(--sans); color:var(--ink); }
  .quiz-opt:hover{ border-color:var(--amber); }
  .quiz-opt.correct{ border-color:var(--tox-green); background:#EAF1EA; color:var(--tox-green-deep); font-weight:600; }
  .quiz-opt.wrong{ border-color:var(--danger); background:#F7EAE7; color:var(--danger); }
  .quiz-opt[disabled]{ cursor:default; }
  .quiz-feedback{ margin-top:14px; font-size:18px; line-height:1.55; color:var(--ink-soft); display:none; }
  .quiz-feedback.show{ display:block; }

  table.data-table{ width:100%; border-collapse:collapse; font-size:18px; margin-top:10px; }
  table.data-table th{ text-align:left; font-family:var(--mono); font-size:16px; color:var(--ink-soft); padding:9px 10px; border-bottom:1px solid var(--ink); }
  table.data-table td{ padding:10px 10px; border-bottom:1px solid var(--line); }
  table.data-table tr.highlight td{ background:#FBF0DD; font-weight:600; }

  .tl-item{ min-width:200px; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 16px; cursor:pointer; flex-shrink:0; }
  .tl-item .tl-year{ font-family:var(--mono); font-size:18px; color:var(--amber-deep); }
  .tl-item .tl-title{ font-family:var(--serif); font-size:20px; margin:4px 0 8px 0; }
  .tl-item .tl-detail{ font-size:19px; color:var(--ink-soft); line-height:1.5; display:none; }
  .tl-item.open .tl-detail{ display:block; }
  .tl-item.open{ border-color:var(--amber); }

  .footer-note{ margin-top:20px; font-size:18px; color:var(--ink-soft); font-family:var(--mono); line-height:1.5; }
  .two-col-story{ display:grid; grid-template-columns:1.15fr .85fr; gap:34px; align-items:start; }
  @media (max-width:820px){ .two-col-story{ grid-template-columns:1fr; } }
  .polonium-box{ background:var(--blue-deep); color:#EAF0F4; border-radius:12px; padding:22px 24px; }
  .polonium-box h3{ font-family:var(--serif); font-weight:400; font-size:21px; margin:0 0 10px 0; color:#fff; }
  .polonium-box p{ font-size:18px; line-height:1.6; margin:0 0 10px 0; }
  .polonium-box .stat{ font-family:var(--mono); font-size:17px; color:#9FC2D9; }
  .aspirin-box{ background:var(--tox-green-deep); color:#EFEFE6; border-radius:12px; padding:20px 22px; margin-top:16px; }
  .aspirin-box h4{ font-family:var(--serif); font-weight:400; font-size:19px; margin:0 0 8px 0; color:#fff; }
  .aspirin-box p{ font-size:18px; line-height:1.6; margin:0; }

  .sources{ font-size:14px; color:var(--ink-soft); line-height:1.7; }

  .diagram-box{ background:#fff; border:1px solid var(--line); border-radius:10px; padding:14px; margin-top:12px; }

  /* matching quiz */
  .match-wrap{ display:grid; grid-template-columns:1fr 1fr; gap:24px; margin-top:14px; }
  @media (max-width:760px){ .match-wrap{ grid-template-columns:1fr; } }
  .match-col-title{ font-family:var(--mono); font-size:13px; color:var(--ink-soft); margin-bottom:8px; }
  .match-item{ background:var(--card); border:1px solid var(--line); border-radius:8px; padding:11px 14px; margin-bottom:8px; font-size:18px; cursor:pointer; }
  .match-item.selected{ border-color:var(--amber); background:#FBF0DD; }
  .match-item.correct{ border-color:var(--tox-green); background:#EAF1EA; }
  .match-item.wrong{ border-color:var(--danger); background:#F7EAE7; }
  .match-result{ margin-top:14px; font-size:18px; color:var(--ink-soft); min-height:24px; }

  /* calculation reveal (native details/summary) */
  details.calc{ background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 18px; margin-top:12px; }
  details.calc summary{ cursor:pointer; font-family:var(--sans); font-weight:600; color:var(--amber-deep); font-size:18px; outline:none; }
  details.calc summary:hover{ color:var(--amber); }
  details.calc[open] summary{ margin-bottom:10px; border-bottom:1px dashed var(--line); padding-bottom:8px; }
  .calc-step{ font-family:var(--mono); font-size:19px; line-height:1.9; color:var(--ink); }
  .calc-step .res{ color:var(--tox-green-deep); font-weight:700; }
  .calc-note{ font-family:var(--sans); font-size:18px; line-height:1.5; color:var(--ink-soft); margin-top:8px; }
  .chart-legend{ display:flex; gap:22px; flex-wrap:wrap; justify-content:center; margin-top:8px; font-size:16px; color:var(--ink-soft); }
  .chart-legend span{ display:inline-flex; align-items:center; gap:7px; }
  .chart-legend i{ width:16px; height:4px; border-radius:2px; display:inline-block; }

  @media (prefers-reduced-motion: reduce){ .slide, .navbtn, #progress-fill{ transition:none !important; } }
</style>
</head>
<body>

<div id="topbar">
  <div class="brand">Osud cizorodých látek v organismu · Přednáška 3</div>
  <div id="progress-track"><div id="progress-fill"></div></div>
  <div id="counter">1 / 1</div>
  <button id="menu-btn" onclick="toggleOverlay(true)">Obsah</button>
</div>

<div id="deck"></div>

<div id="navbtns">
  <button class="navbtn" id="prevBtn" onclick="prevSlide()">←</button>
  <button class="navbtn" id="nextBtn" onclick="nextSlide()">→</button>
</div>

<div id="overlay">
  <button id="overlay-close" onclick="toggleOverlay(false)">×</button>
  <h3>Přeskočit na</h3>
  <ul id="overlay-list"></ul>
</div>

<script>
const slides = [];
function slide(id, title, html){ slides.push({id, title, html}); }

/* ================= 0. TITLE ================= */
slide('title','Titulní strana', `
  <div class="slide-inner">
    <p class="eyebrow">Ing. Pavla Fojtíková, Ph.D. · Přírodovědecká fakulta JU</p>
    <h1 class="headline">Osud cizorodých látek v živém organismu</h1>
    <p class="lede">Přednáška 3 <br>— toxikokinetika: vstup, distribuce, biotransformace a vylučování xenobiotik. <br>Co se s látkou v těle děje od okamžiku expozice až po její odstranění — a jak to lze matematicky popsat a využít.</p>
    <p class="footer-note">Laboratoř analytické a environmentální chemie</p>
  </div>
`);

/* ================= 1. OUTLINE ================= */
slide('outline','Osnova přednášky 3', `
  <div class="slide-inner">
    <p class="eyebrow">Dnes</p>
    <h2 class="headline">Osnova přednášky 3</h2>
    <ul class="plain">
      <li>Toxikokinetika — ADME: vstup, distribuce, biotransformace, vylučování</li>
      <li>Membrány jako klíčová bariéra a mechanismy transportu</li>
      <li>Role pH — Henderson–Hasselbalchova rovnice a výpočty s reálnými látkami</li>
      <li>Cesty vstupu do organismu — požití, inhalace, kůže, žíla</li>
      <li>Distribuce, depot a hematoencefalická bariéra</li>
      <li>Skutečný případ: otrava poloniem-210 (Alexandr Litviněnko)</li>
      <li>Biotransformace a vylučování — kinetika 0. a 1. řádu</li>
      <li>Reálný forenzní výpočet: Widmarkova rovnice a eliminace alkoholu</li>
    </ul>
    <p class="body-text" style="margin-top:18px;">Budou tři kontrolní zastávky — krátký kvíz nebo úkol k opakování — a několik výpočtů, které si rozklikneme krok za krokem.</p>
  </div>
`);

/* ================= 2. TOXICOKINETICS DEF ================= */
slide('tk-def','Co je toxikokinetika?', `
  <div class="slide-inner">
    <p class="eyebrow">Toxikokinetika</p>
    <h2 class="headline">Co se děje s látkou v organismu?</h2>
    <p class="body-text">Zatímco toxikodynamika (přednáška 2) se ptá, co látka dělá s organismem, toxikokinetika se ptá na opak: co organismus dělá s látkou.</p>
    <div class="grid-4" style="margin-top:16px;">
      <div class="card"><div class="tag">1</div><p class="body-text" style="margin:0;"><strong>Absorpce</strong><br>vstup, vstřebávání</p></div>
      <div class="card"><div class="tag">2</div><p class="body-text" style="margin:0;"><strong>Distribuce</strong><br>transport krví/lymfou</p></div>
      <div class="card"><div class="tag">3</div><p class="body-text" style="margin:0;"><strong>Metabolismus</strong><br>biotransformace</p></div>
      <div class="card"><div class="tag">4</div><p class="body-text" style="margin:0;"><strong>Exkrece</strong><br>vylučování</p></div>
    </div>
    <p class="body-text" style="margin-top:16px;">Zkratka <strong>ADME</strong> (Absorption, Distribution, Metabolism, Excretion) — základní rámec farmakokinetiky i toxikokinetiky.</p>
  </div>
`);

/* ================= 3. AOP DIAGRAM ================= */
slide('tk-td-aop','Toxikokinetika a toxikodynamika', `
  <div class="slide-inner">
    <p class="eyebrow">Návaznost na přednášku 2 · Adverse Outcome Pathway</p>
    <h2 class="headline">Kde končí toxikokinetika a začíná toxikodynamika</h2>
    <div class="diagram-box">
      <svg viewBox="0 0 900 190" style="width:100%;">
        <rect x="10" y="60" width="150" height="60" rx="8" fill="#EAF1EA" stroke="#3E5C42"/>
        <text x="85" y="85" font-size="15" text-anchor="middle">koncentrace</text>
        <text x="85" y="103" font-size="15" text-anchor="middle">v cílové tkáni</text>
        <line x1="160" y1="90" x2="185" y2="90" stroke="#5A5D51" stroke-width="2" marker-end="url(#a1)"/>
        <rect x="190" y="60" width="150" height="60" rx="8" fill="#FBF0DD" stroke="#B9791E"/>
        <text x="265" y="85" font-size="15" text-anchor="middle">interakce s</text>
        <text x="265" y="103" font-size="15" text-anchor="middle">molekulárním cílem</text>
        <line x1="340" y1="90" x2="365" y2="90" stroke="#5A5D51" stroke-width="2" marker-end="url(#a1)"/>
        <rect x="370" y="60" width="150" height="60" rx="8" fill="#F7EAE7" stroke="#9C3B2E"/>
        <text x="445" y="85" font-size="15" text-anchor="middle">buněčná</text>
        <text x="445" y="103" font-size="15" text-anchor="middle">odpověď</text>
        <line x1="520" y1="90" x2="545" y2="90" stroke="#5A5D51" stroke-width="2" marker-end="url(#a1)"/>
        <rect x="550" y="60" width="150" height="60" rx="8" fill="#F7EAE7" stroke="#9C3B2E"/>
        <text x="625" y="85" font-size="15" text-anchor="middle">orgánová</text>
        <text x="625" y="103" font-size="15" text-anchor="middle">odpověď</text>
        <line x1="700" y1="90" x2="725" y2="90" stroke="#5A5D51" stroke-width="2" marker-end="url(#a1)"/>
        <rect x="730" y="60" width="160" height="60" rx="8" fill="#EDE4EE" stroke="#6E4B73"/>
        <text x="810" y="85" font-size="15" text-anchor="middle">odpověď</text>
        <text x="810" y="103" font-size="15" text-anchor="middle">organismu</text>
        <text x="85" y="150" font-size="15" text-anchor="middle" font-weight="bold" fill="#2A3F2D">TOXIKOKINETIKA</text>
        <text x="540" y="150" font-size="15" text-anchor="middle" font-weight="bold" fill="#9C3B2E">TOXIKODYNAMIKA (přednáška 2)</text>
        <line x1="10" y1="160" x2="160" y2="160" stroke="#3E5C42" stroke-width="2"/>
        <line x1="190" y1="160" x2="890" y2="160" stroke="#9C3B2E" stroke-width="2"/>
        <defs><marker id="a1" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#5A5D51"/></marker></defs>
      </svg>
    </div>
    <p class="body-text" style="margin-top:12px;">Dnešní přednáška se soustředí na první krok tohoto řetězu — jak se koncentrace xenobiotika v cílové tkáni vůbec vytvoří a jak se v čase mění.</p>
  </div>
`);

/* ================= 4. PRIJEM VS ELIMINACE ================= */
slide('prijem-eliminace','Příjem versus eliminace', `
  <div class="slide-inner">
    <p class="eyebrow">Úvod</p>
    <h2 class="headline">Homeostáze: příjem versus eliminace</h2>
    <div class="grid-2">
      <div class="card">
        <div class="tag">rovnováha</div>
        <p class="body-text" style="margin-top:6px;"><strong>PŘÍJEM ≈ ELIMINACE</strong><br>Organismus udržuje koncentraci cizorodé látky pod úrovní škodlivého efektu — spotřebovává na to energii.</p>
      </div>
      <div class="card">
        <div class="tag" style="border-color:var(--danger);color:var(--danger);">nebezpečí</div>
        <p class="body-text" style="margin-top:6px;"><strong>PŘÍJEM &gt; ELIMINACE</strong><br>Koncentrace roste, limity homeostatických procesů jsou překročeny → nástup pozorovatelných negativních účinků.</p>
      </div>
    </div>
    <blockquote class="quote">Toxikologicky aktivní látka musí vniknout do organismu, dostat se k cílovému orgánu či tkáni a být v dostatečné blízkosti molekulárního cíle v dostatečné koncentraci.</blockquote>
  </div>
`);

/* ================= 5. VSTUP ORGANISMY ================= */
slide('vstup-organismy','Vstup u různých organismů', `
  <div class="slide-inner">
    <p class="eyebrow">Vstup cizorodých látek</p>
    <h2 class="headline">Membrána — univerzální bariéra živé buňky</h2>
    <div class="grid-2">
      <ul class="plain">
        <li><strong>jednobuněčné organismy</strong> — pasivní difuze, transportní systémy pro „selektivní" vstup</li>
        <li><strong>vícebuněčné organismy / řasy</strong> — difuze přes membránu a mezi buňkami</li>
        <li><strong>terestrické rostliny</strong> — vstup kořeny/listy (látky ve vodě, v půdě, plynné toxikanty)</li>
        <li><strong>živočichové</strong> — 3 hlavní cesty: požití, vdechnutí, přes kůži; vždy první krok = přestup přes buněčnou membránu</li>
      </ul>
      <div class="card">
        <p class="body-text" style="margin:0;">Bez ohledu na typ organismu a cestu vstupu musí toxikant překonat bariéru plazmatické membrány, resp. buněčné stěny — nejčastěji pasivní difuzí, dále aktivním transportem nebo pinocytózou.</p>
      </div>
    </div>
  </div>
`);

/* ================= 6. MEMBRANY STRUKTURA ================= */
slide('membrany-struktura','Buněčné membrány', `
  <div class="slide-inner">
    <p class="eyebrow">Struktura bariéry</p>
    <h2 class="headline">Buněčná membrána — dvojvrstva fosfolipidů</h2>
    <div class="grid-2">
      <ul class="plain">
        <li>struktura dvojvrstvy, elektrostatické interakce</li>
        <li>chemicky — fosfolipidy (fosfatidylcholin, fosfatidylserin) — fosfoestery diacylglycerolů</li>
        <li>klíčová pro distribuci biologicky účinných látek (léčiva, jedy) a látkovou výměnu s okolím</li>
        <li>membránové proteiny — transport iontů, biokatalýza, receptory</li>
        <li>sacharidy — imunitní rozpoznávání cizích struktur</li>
        <li>fluidita — dynamický, nikoli statický systém</li>

/* ================= 9. PH ROLE — HH derivace ================= */
slide('ph-role','Role pH — odvození', `
  <div class="slide-inner">
    <p class="eyebrow">Molekulární úroveň</p>
    <h2 class="headline">Proč je pH prostředí tak důležité?</h2>
    <p class="body-text">Xenobiotikum se slabě kyselou nebo slabě zásaditou funkční skupinou mění podle pH prostředí svůj náboj — a tím i lipofilitu a schopnost projít membránou. Vztah mezi pH, pK<sub>a</sub> a poměrem ionizované/neionizované formy popisuje <strong>Hendersonova–Hasselbalchova rovnice</strong>.</p>
    <details class="calc" open>
      <summary>Odvození pro slabou kyselinu HA ⇌ H⁺ + A⁻</summary>
      <div class="calc-step">
K<sub>a</sub> = [H⁺]·[A⁻] / [HA]<br>
log K<sub>a</sub> = log[H⁺] + log([A⁻]/[HA])<br>
−log K<sub>a</sub> = −log[H⁺] − log([A⁻]/[HA])<br>
pK<sub>a</sub> = pH − log([A⁻]/[HA])<br>
<span class="res">log([A⁻]/[HA]) = pH − pK<sub>a</sub></span>
      </div>
      <p class="calc-note">A⁻ = ionizovaná (hydrofilní) forma, HA = neionizovaná (lipofilní) forma. Pro slabou zásadu B + H⁺ ⇌ BH⁺ platí analogicky log([B]/[BH⁺]) = pH − pK<sub>a</sub> (kde pK<sub>a</sub> = 14 − pK<sub>b</sub>).</p>
    </details>
    <div class="grid-2" style="margin-top:14px;">
      <div class="card"><p class="body-text" style="margin:0;"><strong>Slabé kyseliny</strong> — deprotonizace v zásaditějším prostředí → záporný náboj, látka je hydrofilní.</p></div>
      <div class="card"><p class="body-text" style="margin:0;"><strong>Slabé zásady</strong> — přijímají proton v kyselejším prostředí → kladný náboj, látka je hydrofilní.</p></div>
    </div>
  </div>
`);

slide('vypocet-kyselina','Výpočet: kyselina octová', `
  <div class="slide-inner">
    <p class="eyebrow">Aplikace Henderson–Hasselbalchovy rovnice</p>
    <h2 class="headline">Kyselina octová — žaludek versus tenké střevo</h2>
    <p class="body-text">Kyselina octová má pK<sub>a</sub> = 4,75 (25 °C). Spočítejme poměr disociované (A⁻) a nedisociované (HA) formy ve dvou různých prostředích trávicího traktu.</p>
    <details class="calc" open>
      <summary>Žaludek, pH = 2</summary>
      <div class="calc-step">
log([A⁻]/[HA]) = pH − pK<sub>a</sub> = 2 − 4,75 = <span class="res">−2,75</span><br>
[A⁻]/[HA] = 10<sup>−2,75</sup> = <span class="res">1 : 562</span>
      </div>
      <p class="calc-note">Silně kyselé prostředí žaludku téměř veškerou kyselinu octovou udrží v nedisociované, lipofilní formě — ta se snadno vstřebává už žaludeční stěnou.</p>
    </details>
    <details class="calc">
      <summary>Tenké střevo, pH ≈ 7</summary>
      <div class="calc-step">
log([A⁻]/[HA]) = 7 − 4,75 = <span class="res">2,25</span><br>
[A⁻]/[HA] = 10<sup>2,25</sup> = <span class="res">178 : 1</span>
      </div>
      <p class="calc-note">V neutrálním prostředí střeva je naopak převážná část látky disociovaná (hydrofilní) — vstřebávání přes membránu je pomalejší. Proto platí obecné pravidlo: <strong>slabé kyseliny se lépe vstřebávají v žaludku.</strong></p>
    </details>
  </div>
`);

slide('kinetika-rady','Kinetika vylučování — řády reakce', `

slide('pripad-alkohol','Případ: Widmarkova rovnice', `
  <div class="slide-inner">
    <p class="eyebrow">Reálný forenzní výpočet</p>
    <h2 class="headline">Proč je alkohol výjimkou — kinetika 0. řádu</h2>
    <p class="body-text">Ethanol je metabolizován především alkoholdehydrogenázou v játrech. Na rozdíl od většiny xenobiotik je tento enzymový systém při běžných koncentracích alkoholu v krvi <strong>nasycen</strong> — rychlost odbourávání je proto konstantní (kinetika 0. řádu), typicky <strong>β ≈ 0,15&nbsp;‰/hod</strong>. Této skutečnosti využívá forenzní toxikologie ve <strong>Widmarkově rovnici</strong>:</p>
    <details class="calc" open>
      <summary>Widmarkova rovnice — výpočet koncentrace alkoholu v krvi</summary>
      <div class="calc-step">
C₀ = A / (m · r)   [g/kg ≈ ‰]<br>
C(t) = C₀ − β·t
      </div>
      <p class="calc-note">A = hmotnost požitého alkoholu [g] · m = tělesná hmotnost [kg] · r = distribuční (Widmarkův) faktor: 0,68 muži, 0,55 ženy (podíl vody v těle) · β = rychlost eliminace [‰/hod]</p>
    </details>
    <details class="calc">
      <summary>Příklad: muž 80 kg, 3 piva 12° (≈ 60 g ethanolu)</summary>
      <div class="calc-step">
C₀ = 60 / (80 · 0,68) = 60 / 54,4 = <span class="res">1,10 ‰</span><br>
t(0) = C₀ / β = 1,10 / 0,15 = <span class="res">≈ 7,3 hodiny</span> do úplného vystřízlivění
      </div>
      <p class="calc-note">Pozn.: skutečná hodnota bývá o něco nižší kvůli neúplné resorpci a individuální variabilitě β (0,10–0,20 ‰/hod) — ve forenzní praxi se proto počítá s bezpečnostním rozpětím.</p>

/* ================= RENDER ================= */
const deck = document.getElementById('deck');
slides.forEach((s,i)=>{
  const el = document.createElement('div');
  el.className='slide'; el.id='slide-'+i; el.innerHTML=s.html;
  deck.appendChild(el);
});
const overlayList = document.getElementById('overlay-list');
slides.forEach((s,i)=>{
  const li = document.createElement('li');
  li.innerHTML = '<span>'+String(i+1).padStart(2,'0')+'</span>'+s.title;
  li.onclick = ()=>{ goTo(i); toggleOverlay(false); };
  overlayList.appendChild(li);
});

let current = 0;
function render(){
  document.querySelectorAll('.slide').forEach((el,i)=> el.classList.toggle('active', i===current));
  document.getElementById('progress-fill').style.width = ((current+1)/slides.length*100)+'%';
  document.getElementById('counter').textContent = (current+1)+' / '+slides.length;
  document.getElementById('prevBtn').disabled = current===0;
  document.getElementById('nextBtn').disabled = current===slides.length-1;
  initSlideWidgets(current);
}
function goTo(i){ current = Math.max(0, Math.min(slides.length-1, i)); render(); }
function nextSlide(){ goTo(current+1); }
function prevSlide(){ goTo(current-1); }
document.addEventListener('keydown', (e)=>{
  if(document.getElementById('overlay').classList.contains('show')){ if(e.key==='Escape') toggleOverlay(false); return; }
  if(e.key==='ArrowRight' || e.key===' ') nextSlide();
  if(e.key==='ArrowLeft') prevSlide();
  if(e.key==='Escape') toggleOverlay(false);
});
function toggleOverlay(show){ document.getElementById('overlay').classList.toggle('show', show); }

/* ================= WIDGETS ================= */
const initialized = {};
function initSlideWidgets(i){
  const id = slides[i].id;
  if(initialized[id]) return;
  initialized[id] = true;
  if(id==='kviz-1') initSimpleQuizzes([
    ['q1a','q1a-fb','Správně — při pH nižším než pKa převládá u kyseliny neionizovaná forma HA, ta lépe difunduje přes membránu.','Zkuste znovu — porovnejte pH prostředí (1) s pKa látky (4,0): pH je nižší, takže rovnováha je posunuta k HA.'],
    ['q1b','q1b-fb','Přesně tak — v neutrálním střevě převládá u slabé zásady neprotonizovaná forma B, která je lipofilní.','Zkuste znovu — u slabých zásad platí opačné pravidlo než u kyselin: potřebují méně kyselé prostředí.'],
    ['q1c','q1c-fb','Ano — to je princip „ion trapping": ionizovaná forma se nemůže vrátit přes tubulární membránu zpět do krve.','Zkuste znovu — hydrogenuhličitan sodný nereaguje se salicylátem chemicky, mění pouze pH moči.']
  ]);
  if(id==='diskuse') initDiscussion();
  if(id==='kviz-2-matching') initMatching();
}

function initSimpleQuizzes(list){
  list.forEach(([cardId, fbId, correctMsg, wrongMsg])=>{
    const card = document.getElementById(cardId);
    const opts = card.querySelectorAll('.quiz-opt');
    opts.forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const isCorrect = btn.dataset.correct==='true';
        opts.forEach(o=>o.disabled=true);
        btn.classList.add(isCorrect?'correct':'wrong');
        if(!isCorrect){ opts.forEach(o=>{ if(o.dataset.correct==='true') o.classList.add('correct'); }); }
        const fb = document.getElementById(fbId);
        fb.textContent = isCorrect? correctMsg: wrongMsg;
        fb.classList.add('show');
      });
    });
  });
}

/* ---- discussion accordion ---- */
function initDiscussion(){

     a:'Ledvinové tubuly reabsorbují zpět do krve jen neionizovanou, lipofilní formu látky. U slabé kyseliny (salicylát) zvýšení pH moči zvyšuje podíl ionizované formy A⁻ → látka „zůstává v pasti" v moči a je vyloučena. U slabé zásady je to naopak — snížení pH moči zvyšuje podíl protonizované, ionizované formy BH⁺, která se nereabsorbuje, takže okyselení moči urychlí vylučování zásaditých látek.'},
    {q:'Proč je otrava poloniem-210 obtížně odhalitelná běžnými toxikologickými testy, zatímco otrava těžkými kovy jako olovo nebo rtuť se dá zjistit rutinně?',
     a:'Standardní toxikologické screeningy hledají chemickou přítomnost látky (např. atomovou absorpční spektrometrií u olova či rtuti). Polonium-210 se v těle chová chemicky jako běžný, netoxický stopový prvek přítomný jen ve zcela zanedbatelném množství — jeho nebezpečnost není dána chemickou reaktivitou, ale radioaktivitou. Je proto nutná specializovaná gama/alfa-spektrometrická analýza, na kterou se běžně netestuje, pokud není konkrétní podezření na radioaktivní kontaminaci.'},
    {q:'Widmarkova rovnice předpokládá kinetiku 0. řádu (konstantní rychlost eliminace). Co by se stalo s výpočtem doby do vystřízlivění, kdyby byla eliminace alkoholu ve skutečnosti kinetikou 1. řádu?',
     a:'U kinetiky 1. řádu by rychlost eliminace klesala úměrně s klesající koncentrací (exponenciální pokles), takže by koncentrace nikdy formálně nedosáhla nuly — klesala by čím dál pomaleji. Místo pevného „času do nuly" by se používal poločas eliminace, nezávislý na počáteční koncentraci. Skutečnost, že alkohol při běžných koncentracích v krvi klesá lineárně (konstantní rychlostí), je právě důkazem nasycení enzymového systému alkoholdehydrogenázy.'},
    {q:'Novorozenci mají neúplně vyvinutou hematoencefalickou bariéru i nezralé jaterní enzymy pro biotransformaci. Jak by se to mělo promítnout do stanovování bezpečných dávek léčiv nebo limitů expozice chemikáliím u dětí?',
     a:'Nedostatečně vyvinutá HEB znamená vyšší riziko průniku lipofilních i některých hydrofilních látek do CNS, které by u dospělého byly bariérou zadrženy. Nezralé jaterní enzymy (např. nižší aktivita cytochromu P450 a konjugačních enzymů II. fáze) znamenají pomalejší biotransformaci a delší biologický poločas látky. Bezpečné dávky pro děti proto nelze jednoduše přepočítat lineárně podle tělesné hmotnosti dospělého — je nutné zohlednit vývojové rozdíly ve všech čtyřech fázích ADME.'}

/* ---- matching game ---- */
function initMatching(){
  const pairs = [
    {left:'Kyselina acetylsalicylová při alkalizaci moči', right:'Zvýšené vylučování (ion trapping v moči)'},
    {left:'Ethanol', right:'Kinetika eliminace 0. řádu'},
    {left:'Perzistentní organické látky (POPs)', right:'Depot v tukové tkáni'},
    {left:'Polonium-210', right:'Depot v kostní dřeni'},
    {left:'Thalidomid', right:'Průnik placentární bariérou'},
    {left:'Nitroglycerin (sublingválně)', right:'Obchází first-pass efekt v játrech'}
  ];
  const leftItems = pairs.map((p,i)=>({text:p.left, idx:i}));
  const rightItems = pairs.map((p,i)=>({text:p.right, idx:i}));
  for(let i=rightItems.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [rightItems[i],rightItems[j]]=[rightItems[j],rightItems[i]]; }

  const leftEl = document.getElementById('match-left');
  const rightEl = document.getElementById('match-right');
  let selectedLeft = null;
  let solved = 0;

  leftItems.forEach(item=>{
    const div = document.createElement('div');
    div.className='match-item';
    div.textContent = item.text;
    div.dataset.idx = item.idx;
    div.onclick = ()=>{
      if(div.classList.contains('correct')) return;
      leftEl.querySelectorAll('.match-item').forEach(x=>x.classList.remove('selected'));
      div.classList.add('selected');
      selectedLeft = div;
    };
    leftEl.appendChild(div);
  });
  rightItems.forEach(item=>{
    const div = document.createElement('div');
    div.className='match-item';
    div.textContent = item.text;
    div.dataset.idx = item.idx;
    div.onclick = ()=>{
      if(!selectedLeft || div.classList.contains('correct')) return;
      const isMatch = selectedLeft.dataset.idx === div.dataset.idx;
      if(isMatch){
        selectedLeft.classList.remove('selected'); selectedLeft.classList.add('correct');
        div.classList.add('correct');
        solved++;
        selectedLeft = null;
        if(solved===pairs.length){
          document.getElementById('match-result').textContent = 'Výborně — všechny páry sedí! Od ion trappingu přes depoty až po kinetiku nultého řádu jsme dnes probrali celý osud látky v těle.';
        }
      } else {
        div.classList.add('wrong');
        setTimeout(()=>div.classList.remove('wrong'), 500);
      }
    };
    rightEl.appendChild(div);
  });
}

render();
