<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jak jedy působí — Přednáška 2</title>
<style>
  :root{
    --paper:#F4F5EF;
    --ink:#1E2019;
    --ink-soft:#5A5D51;
    --amber:#B9791E;
    --amber-deep:#8F5D14;
    --tox-green:#3E5C42;
    --tox-green-deep:#2A3F2D;
    --danger:#9C3B2E;
    --blue:#3A5A72;
    --line:#D6D6C6;
    --card:#FFFFFE;
    --serif: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', serif;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    --mono: 'SF Mono', SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans);
    overflow:hidden; font-size:18px;
  }
  ::selection{ background: var(--amber); color:#fff; }

  #topbar{
    position:fixed; top:0; left:0; right:0; height:54px;
    display:flex; align-items:center; gap:16px; padding:0 20px; z-index:50;
    background:linear-gradient(to bottom, rgba(244,245,239,0.97), rgba(244,245,239,0.85));
    border-bottom:1px solid var(--line);
  }
  #topbar .brand{ font-family:var(--serif); font-size:16px; font-style:italic; color:var(--ink-soft); white-space:nowrap; }
  #progress-track{ flex:1; height:3px; background:var(--line); border-radius:2px; overflow:hidden; }
  #progress-fill{ height:100%; width:0%; background:var(--amber); transition:width .35s ease; }
  #counter{ font-family:var(--mono); font-size:13px; color:var(--ink-soft); white-space:nowrap; }
  #menu-btn{
    font-family:var(--sans); font-size:14px; color:var(--ink); background:var(--card);
    border:1px solid var(--line); border-radius:6px; padding:6px 12px; cursor:pointer;
  }
  #menu-btn:hover{ border-color:var(--amber); }

  #deck{ position:relative; width:100%; height:100%; padding-top:54px; }
  .slide{
    position:absolute; inset:0; top:54px; display:flex; align-items:center; justify-content:center;
    padding:36px 7vw 90px 7vw; opacity:0; visibility:hidden; transform:translateY(14px);
    transition:opacity .4s ease, transform .4s ease; overflow-y:auto;
  }
  .slide.active{ opacity:1; visibility:visible; transform:translateY(0); }
  .slide-inner{ width:100%; max-width:980px; }
  .eyebrow{ font-family:var(--mono); font-size:16px; letter-spacing:.02em; color:var(--amber-deep); margin:0 0 12px 0; }
  h1.headline{ font-family:var(--serif); font-weight:400; font-size:clamp(30px,4.6vw,50px); line-height:1.1; margin:0 0 16px 0; }
  h2.headline{ font-family:var(--serif); font-weight:400; font-size:clamp(24px,3.2vw,34px); line-height:1.18; margin:0 0 16px 0; }
  p.lede{ font-size:19px; line-height:1.55; color:var(--ink-soft); max-width:680px; }
  .body-text{ font-size:19px; line-height:1.6; color:var(--ink); max-width:720px; }
  .body-text + .body-text{ margin-top:10px; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:10px; padding:20px 22px; }
  .grid-2{ display:grid; grid-template-columns:1fr 1fr; gap:18px; }
  .grid-3{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
  @media (max-width:800px){ .grid-2,.grid-3{ grid-template-columns:1fr; } }
  .tag{ display:inline-block; font-family:var(--mono); font-size:12px; padding:3px 9px; border-radius:20px; border:1px solid var(--line); color:var(--ink-soft); margin-bottom:10px; }
  .tag.new{ border-color:var(--danger); color:var(--danger); }
  ul.plain{ margin:0; padding-left:22px; font-size:18px; }
  ul.plain li{ margin-bottom:9px; line-height:1.5; }
  blockquote.quote{ font-family:var(--serif); font-style:italic; font-size:26px; line-height:1.4; color:var(--tox-green-deep); border-left:3px solid var(--amber); padding-left:22px; margin:22px 0; }
  blockquote.quote cite{ display:block; font-size:15px; font-style:normal; color:var(--ink-soft); margin-top:8px; }
  #navbtns{ position:fixed; bottom:22px; right:28px; display:flex; gap:10px; z-index:50; }
  .navbtn{ width:46px; height:46px; border-radius:50%; border:1px solid var(--line); background:var(--card); color:var(--ink); font-size:19px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .navbtn:hover{ border-color:var(--amber); color:var(--amber-deep); }
  .navbtn:disabled{ opacity:.3; cursor:default; }
  #overlay{ position:fixed; inset:0; background:rgba(30,32,25,.94); z-index:100; display:none; padding:56px 8vw; overflow-y:auto; }
  #overlay.show{ display:block; }
  #overlay h3{ font-family:var(--serif); color:#fff; font-weight:400; font-size:23px; margin-bottom:20px; }
  #overlay-list{ list-style:none; margin:0; padding:0; columns:2; column-gap:40px; }
  @media (max-width:800px){ #overlay-list{ columns:1; } }
  #overlay-list li{ color:#EDEEE6; font-size:16px; padding:9px 0; border-bottom:1px solid rgba(255,255,255,.12); cursor:pointer; break-inside:avoid; }
  #overlay-list li span{ font-family:var(--mono); color:var(--amber); margin-right:10px; font-size:13px; }
  #overlay-list li:hover{ color:var(--amber); }
  #overlay-close{ position:absolute; top:22px; right:30px; color:#fff; font-size:28px; background:none; border:none; cursor:pointer; }

  .quiz-card{ background:var(--card); border:1px solid var(--line); border-radius:12px; padding:24px 26px; margin-top:10px; }
  .quiz-q{ font-size:19px; font-weight:600; margin-bottom:16px; line-height:1.45; }
  .quiz-opt{ display:block; width:100%; text-align:left; padding:13px 16px; margin-bottom:10px; border:1px solid var(--line); border-radius:8px; background:#fff; cursor:pointer; font-size:18px; font-family:var(--sans); color:var(--ink); }
  .quiz-opt:hover{ border-color:var(--amber); }
  .quiz-opt.correct{ border-color:var(--tox-green); background:#EAF1EA; color:var(--tox-green-deep); font-weight:600; }
  .quiz-opt.wrong{ border-color:var(--danger); background:#F7EAE7; color:var(--danger); }
  .quiz-opt[disabled]{ cursor:default; }
  .quiz-feedback{ margin-top:14px; font-size:18px; line-height:1.55; color:var(--ink-soft); display:none; }
  .quiz-feedback.show{ display:block; }

  table.data-table{ width:100%; border-collapse:collapse; font-size:18px; margin-top:10px; }
  table.data-table th{ text-align:left; font-family:var(--mono); font-size:18px; color:var(--ink-soft); padding:9px 10px; border-bottom:1px solid var(--ink); }
  table.data-table td{ padding:10px 10px; border-bottom:1px solid var(--line); }
  table.data-table tr.highlight td{ background:#FBF0DD; font-weight:600; }

  .tl-item{ min-width:200px; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 16px; cursor:pointer; flex-shrink:0; }
  .tl-item .tl-year{ font-family:var(--mono); font-size:18px; color:var(--amber-deep); }
  .tl-item .tl-title{ font-family:var(--serif); font-size:20px; margin:4px 0 8px 0; }
  .tl-item .tl-detail{ font-size:19px; color:var(--ink-soft); line-height:1.5; display:none; }
  .tl-item.open .tl-detail{ display:block; }
  .tl-item.open{ border-color:var(--amber); }

  .footer-note{ margin-top:20px; font-size:18px; color:var(--ink-soft); font-family:var(--mono); line-height:1.5; }
  .two-col-story{ display:grid; grid-template-columns:1.15fr .85fr; gap:34px; align-items:start; }
  @media (max-width:820px){ .two-col-story{ grid-template-columns:1fr; } }
  .ricin-box{ background:var(--tox-green-deep); color:#EFEFE6; border-radius:12px; padding:22px 24px; }
  .ricin-box h3{ font-family:var(--serif); font-weight:400; font-size:21px; margin:0 0 10px 0; color:#fff; }
  .ricin-box p{ font-size:18px; line-height:1.6; margin:0 0 10px 0; }
  .ricin-box .stat{ font-family:var(--mono); font-size:17px; color:#D9C58F; }
  .novichok-box{ background:var(--blue); color:#EAF0F4; border-radius:12px; padding:20px 22px; margin-top:16px; }
  .novichok-box h4{ font-family:var(--serif); font-weight:400; font-size:19px; margin:0 0 8px 0; color:#fff; }
  .novichok-box p{ font-size:18px; line-height:1.6; margin:0; }

  .sources{ font-size:14px; color:var(--ink-soft); line-height:1.7; }

  /* expert cards for group work */
  .expert-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-top:14px; }
  @media (max-width:900px){ .expert-grid{ grid-template-columns:repeat(2,1fr); } }
  @media (max-width:560px){ .expert-grid{ grid-template-columns:1fr; } }
  .expert-card{ background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px 14px; cursor:pointer; }
  .expert-card:hover{ border-color:var(--amber); }
  .expert-card .grp{ font-family:var(--mono); font-size:11.5px; color:var(--amber-deep); }
  .expert-card .name{ font-family:var(--serif); font-size:19px; margin:3px 0 0 0; }
  .expert-detail{ display:none; margin-top:8px; font-size:17px; color:var(--ink-soft); line-height:1.55; }
  .expert-card.open .expert-detail{ display:block; }
  .expert-card.open{ border-color:var(--amber); grid-column: span 2; }
  @media (max-width:560px){ .expert-card.open{ grid-column: span 1; } }

  .diagram-box{ background:#fff; border:1px solid var(--line); border-radius:10px; padding:14px; margin-top:12px; }

  /* matching quiz */
  .match-wrap{ display:grid; grid-template-columns:1fr 1fr; gap:24px; margin-top:14px; }
  @media (max-width:760px){ .match-wrap{ grid-template-columns:1fr; } }
  .match-col-title{ font-family:var(--mono); font-size:13px; color:var(--ink-soft); margin-bottom:8px; }
  .match-item{ background:var(--card); border:1px solid var(--line); border-radius:8px; padding:11px 14px; margin-bottom:8px; font-size:18px; cursor:pointer; }
  .match-item.selected{ border-color:var(--amber); background:#FBF0DD; }
  .match-item.correct{ border-color:var(--tox-green); background:#EAF1EA; }
  .match-item.wrong{ border-color:var(--danger); background:#F7EAE7; }
  .match-result{ margin-top:14px; font-size:18px; color:var(--ink-soft); min-height:24px; }

  .why-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:14px; }
  @media (max-width:760px){ .why-grid{ grid-template-columns:1fr; } }

  @media (prefers-reduced-motion: reduce){ .slide, .navbtn, #progress-fill{ transition:none !important; } }
</style>
</head>
<body>

<div id="topbar">
  <div class="brand">Jak jedy působí · Přednáška 2</div>
  <div id="progress-track"><div id="progress-fill"></div></div>
  <div id="counter">1 / 1</div>
  <button id="menu-btn" onclick="toggleOverlay(true)">Obsah</button>
</div>

<div id="deck"></div>

<div id="navbtns">
  <button class="navbtn" id="prevBtn" onclick="prevSlide()">←</button>
  <button class="navbtn" id="nextBtn" onclick="nextSlide()">→</button>
</div>

<div id="overlay">
  <button id="overlay-close" onclick="toggleOverlay(false)">×</button>
  <h3>Přeskočit na</h3>
  <ul id="overlay-list"></ul>
</div>

<script>
const slides = [];
function slide(id, title, html){ slides.push({id, title, html}); }

/* ================= 0. TITLE ================= */
slide('title','Titulní strana', `
  <div class="slide-inner">
    <p class="eyebrow">Ing. Pavla Fojtíková, Ph.D. · Přírodovědecká fakulta JU</p>
    <h1 class="headline">Jak jedy působí?</h1>
    <p class="lede">Přednáška 2 — toxikodynamika: biologicky významné molekuly, mechanismy účinku, chemické reakce xenobiotik a jejich cíle na molekulární, subcelulární i buněčné úrovni.</p>
    <p class="footer-note">Laboratoř analytické a environmentální chemie</p>
  </div>
`);

/* ================= 1. OUTLINE ================= */
slide('outline','Osnova přednášky 2', `
  <div class="slide-inner">
    <p class="eyebrow">Dnes</p>
    <h2 class="headline">Osnova přednášky 2</h2>
    <ul class="plain">
      <li>Toxikodynamika — co se děje při otravě</li>
      <li>Biologicky významné molekuly: proteiny, nukleové kyseliny, glutathion</li>
      <li>Úrovně účinku: od molekuly po celý organismus</li>
      <li>Mechanismy účinku — receptorová teorie, agonisté a antagonisté</li>
      <li>Chemické reakce xenobiotik: elektrofily, nukleofily, volné radikály</li>
      <li>Skutečný případ: „deštníková vražda" a mechanismus ricinu</li>
      <li>Cíle na subcelulární a buněčné úrovni</li>
      <li>Skupinová práce — toxicita vybraných látek</li>
    </ul>
    <p class="body-text" style="margin-top:18px;">Budou čtyři kontrolní zastávky — krátký úkol nebo kvíz k opakování.</p>
  </div>
`);

/* ================= 2. TOXICODYNAMICS DEF ================= */
slide('toxdyn-def','Co se děje při otravě?', `
  <div class="slide-inner">
    <p class="eyebrow">Toxikodynamika</p>
    <h2 class="headline">Co se děje při otravě?</h2>
    <p class="body-text">K jakým změnám dochází v těle, v jednotlivých orgánech, tkáních nebo buňkách po vniknutí toxické látky do organismu?</p>
    <div class="card" style="margin-top:16px;">
      <ul class="plain" style="margin-top:0;">
        <li><strong>Toxikodynamika</strong> — studium účinků xenobiotik na organismus</li>
        <li>cizorodá látka (xenobiotikum) zasahuje do fyziologických a biochemických procesů</li>
        <li>interakce s biologicky významnými molekulami</li>
        <li>interakce → kompenzační homeostatické děje, nebo porušení homeostáze</li>
        <li>mechanismus účinku = molekulární cíl + navázání xenobiotika na cílovou strukturu + další děje a projevený účinek</li>
      </ul>
    </div>
  </div>
`);

/* ================= 3. PROTEINS ================= */
slide('biomol-proteins','Proteiny', `
  <div class="slide-inner">
    <p class="eyebrow">Biologicky významné molekuly</p>
    <h2 class="headline">Proteiny neboli bílkoviny</h2>
    <div class="grid-2">
      <div>
        <ul class="plain">
          <li>stavební jednotka — L-α-aminokyseliny (AMK)</li>
          <li>biopolymery — jeden nebo více polypeptidových řetězců (100 až tisíce AMK zbytků)</li>
          <li>AMK mají dipolární charakter — podle pH prostředí se chovají jako slabé kyseliny nebo zásady</li>
          <li>proteiny jsou <strong>amfolyty</strong> — dovedou „pufrovat" roztoky</li>
        </ul>
      </div>
      <div class="diagram-box">
        <svg viewBox="0 0 400 220" style="width:100%;">
          <text x="200" y="24" font-size="16" text-anchor="middle" fill="#5A5D51" font-family="monospace">aminokyselina — zwitterion (pH 7)</text>
          <text x="200" y="110" font-size="26" text-anchor="middle" fill="#1E2019" font-family="monospace">H₃N⁺–CH(R)–COO⁻</text>
          <line x1="130" y1="130" x2="130" y2="160" stroke="#9C3B2E" stroke-width="1.5"/>
          <text x="130" y="180" font-size="16" text-anchor="middle" fill="#9C3B2E">kladný náboj</text>
          <line x1="275" y1="130" x2="275" y2="160" stroke="#3E5C42" stroke-width="1.5"/>
          <text x="275" y="180" font-size="16" text-anchor="middle" fill="#3E5C42">záporný náboj</text>
          <text x="200" y="207" font-size="14" text-anchor="middle" fill="#5A5D51">R = postranní řetězec (např. –SH u cysteinu)</text>
        </svg>
      </div>
    </div>
  </div>
`);

/* ================= 4. NUCLEIC ACIDS ================= */
slide('biomol-nucleic','Nukleové kyseliny', `
  <div class="slide-inner">
    <p class="eyebrow">Biologicky významné molekuly</p>
    <h2 class="headline">Nukleové kyseliny</h2>
    <div class="grid-2">
      <div>
        <ul class="plain">
          <li>biopolymery</li>
          <li>stavební jednotka — nukleotid</li>
          <li>nukleotid = fosforečný ester nukleosidu (cukr ribóza/deoxyribóza + purinová/pyrimidinová báze)</li>
          <li>báze obsahují nukleofilní centra (N, O) — cíl pro elektrofilní xenobiotika (viz dále)</li>
        </ul>
      </div>
      <div class="diagram-box">
        <svg viewBox="0 0 430 190" style="width:100%;">
          <rect x="20" y="82" width="90" height="46" rx="6" fill="#EDE7D9" stroke="#B9791E"/>
          <text x="65" y="110" font-size="16" text-anchor="middle">fosfát</text>
          <line x1="110" y1="105" x2="135" y2="105" stroke="#5A5D51" stroke-width="2"/>
          <circle cx="183" cy="105" r="48" fill="#EAF1EA" stroke="#3E5C42"/>
          <text x="183" y="101" font-size="16" text-anchor="middle">cukr</text>
          <text x="183" y="120" font-size="13" text-anchor="middle">(ribóza)</text>
          <line x1="231" y1="105" x2="256" y2="105" stroke="#5A5D51" stroke-width="2"/>
          <rect x="256" y="78" width="150" height="55" rx="6" fill="#F7EAE7" stroke="#9C3B2E"/>
          <text x="331" y="100" font-size="15" text-anchor="middle">dusíkatá báze</text>
          <text x="331" y="119" font-size="13" text-anchor="middle" fill="#5A5D51">(purin/pyrimidin)</text>
          <text x="213" y="26" font-size="15" text-anchor="middle" fill="#5A5D51" font-family="monospace">nukleotid</text>
        </svg>
      </div>
    </div>
  </div>
`);

/* ================= 5. GLUTATHIONE ================= */
slide('glutathione','Glutathion (GSH)', `
  <div class="slide-inner">
    <p class="eyebrow">Biologicky významné molekuly</p>
    <h2 class="headline">Tripeptid glutathion (GSH)</h2>
    <div class="grid-2">
      <div class="diagram-box">
        <svg viewBox="0 0 390 150" style="width:100%;">
          <rect x="10" y="40" width="115" height="55" rx="8" fill="#EAF1EA" stroke="#3E5C42"/>
          <text x="67" y="63" font-size="15" text-anchor="middle">kyselina</text>
          <text x="67" y="81" font-size="15" text-anchor="middle">glutamová</text>
          <line x1="125" y1="67" x2="150" y2="67" stroke="#5A5D51" stroke-width="2"/>
          <rect x="155" y="40" width="100" height="55" rx="8" fill="#FBF0DD" stroke="#B9791E"/>
          <text x="205" y="73" font-size="16" text-anchor="middle">cystein</text>
          <line x1="255" y1="67" x2="280" y2="67" stroke="#5A5D51" stroke-width="2"/>
          <rect x="285" y="40" width="95" height="55" rx="8" fill="#F7EAE7" stroke="#9C3B2E"/>
          <text x="332" y="73" font-size="16" text-anchor="middle">glycin</text>
          <text x="195" y="118" font-size="15" text-anchor="middle" fill="#5A5D51" font-family="monospace">γ-Glu–Cys–Gly</text>
          <text x="195" y="138" font-size="14" text-anchor="middle" fill="#9C3B2E">reaktivní –SH skupina cysteinu</text>
        </svg>
      </div>
      <ul class="plain">
        <li>kofaktor důležitých oxidoreduktáz</li>
        <li>oxidovaný glutathion — disulfidový můstek (GSSG)</li>
        <li>odstraňování peroxidu vodíku i volných radikálů</li>
        <li>ochrana biomolekul (DNA, proteiny, lipidy) proti oxidačnímu stresu</li>
        <li><strong>detoxikace</strong> — konjugace s elektrofilními (reaktivními) toxickými molekulami ve fázi II metabolismu → vyšší rozpustnost ve vodě → usnadnění vylučování (moč, žluč)</li>
      </ul>
    </div>
  </div>
`);

/* ================= 6. LEVELS OF ACTION ================= */
slide('levels','Úrovně účinku', `
  <div class="slide-inner">
    <p class="eyebrow">Jak jedy působí?</p>
    <h2 class="headline">Od molekuly po celý organismus</h2>
    <div class="grid-2">
      <svg viewBox="0 0 320 260" style="width:100%;">
        <polygon points="160,10 300,240 20,240" fill="none" stroke="#B9791E" stroke-width="1.5"/>
        <line x1="60" y1="200" x2="260" y2="200" stroke="#D6D6C6"/>
        <line x1="80" y1="160" x2="240" y2="160" stroke="#D6D6C6"/>
        <line x1="100" y1="120" x2="220" y2="120" stroke="#D6D6C6"/>
        <line x1="120" y1="80" x2="200" y2="80" stroke="#D6D6C6"/>
        <text x="160" y="30" font-size="15" text-anchor="middle">molekulární</text>
        <text x="160" y="65" font-size="15" text-anchor="middle">subcelulární</text>
        <text x="160" y="105" font-size="15" text-anchor="middle">buněčná</text>
        <text x="160" y="145" font-size="15" text-anchor="middle">tkáně</text>
        <text x="160" y="185" font-size="15" text-anchor="middle">orgány</text>
        <text x="160" y="225" font-size="16" text-anchor="middle" font-weight="bold">lidské tělo</text>
      </svg>
      <div class="body-text">

      <div>
        <p class="body-text">7. září 1978 čekal bulharský disident a novinář Georgi Markov na autobus na Waterloo Bridge v Londýně. Ucítil bodavou bolest v stehně — muž s deštníkem se omluvil a odešel. Markov zemřel o čtyři dny později. Pitva odhalila v ráně platino-iridiovou kuličku (1,7 mm) se dvěma dutinkami — nosič mikroskopické dávky jedu.</p>
        <p class="body-text">Forenzní analýza identifikovala obsah jako <strong>ricin</strong>, bílkovinný toxin ze semen skočce obecného.</p>
      </div>
      <div class="ricin-box">
        <h3>Ricin — jak funguje</h3>
        <p>Ribozom-inaktivující protein typu II. Řetězec B se váže na buněčný povrch a umožní vstup; řetězec A (RTA) v cytosolu odštěpí jediný adenin ze specifického místa 28S ribozomální RNA (sarcin-ricinová smyčka).</p>
        <p class="stat">letální dávka u člověka odhadována již od stovek µg</p>
        <p>Jde o <strong>katalytickou, nikoli stechiometrickou</strong> reakci — jedna molekula RTA inaktivuje tisíce ribozomů za minutu. Translace bílkovin se nevratně zastaví. Specifické antidotum neexistuje.</p>
      </div>
    </div>

      <p>Zatímco ricin nevratně blokuje syntézu bílkovin uvnitř buňky, novičok (organofosfát) inhibuje acetylcholinesterázu — enzym rozkládající acetylcholin v synapsích. Výsledkem je nadměrná stimulace cholinergních receptorů (křeče, respirační selhání). Rozdíl: tato inhibice je zpočátku <strong>reverzibilní</strong> — existují oximy (reaktivace enzymu) a atropin (kompetitivní blokáda downstream účinků). U ricinu takový farmakologický cíl chybí.</p>
    </div>
  </div>
`);

/* ================= RENDER ================= */
const deck = document.getElementById('deck');
slides.forEach((s,i)=>{
  const el = document.createElement('div');
  el.className='slide'; el.id='slide-'+i; el.innerHTML=s.html;
  deck.appendChild(el);
});
const overlayList = document.getElementById('overlay-list');
slides.forEach((s,i)=>{
  const li = document.createElement('li');
  li.innerHTML = '<span>'+String(i+1).padStart(2,'0')+'</span>'+s.title;
  li.onclick = ()=>{ goTo(i); toggleOverlay(false); };
  overlayList.appendChild(li);
});

let current = 0;
function render(){
  document.querySelectorAll('.slide').forEach((el,i)=> el.classList.toggle('active', i===current));
  document.getElementById('progress-fill').style.width = ((current+1)/slides.length*100)+'%';
  document.getElementById('counter').textContent = (current+1)+' / '+slides.length;
  document.getElementById('prevBtn').disabled = current===0;
  document.getElementById('nextBtn').disabled = current===slides.length-1;
  initSlideWidgets(current);
}
function goTo(i){ current = Math.max(0, Math.min(slides.length-1, i)); render(); }
function nextSlide(){ goTo(current+1); }
function prevSlide(){ goTo(current-1); }
document.addEventListener('keydown', (e)=>{
  if(document.getElementById('overlay').classList.contains('show')){ if(e.key==='Escape') toggleOverlay(false); return; }
  if(e.key==='ArrowRight' || e.key===' ') nextSlide();
  if(e.key==='ArrowLeft') prevSlide();
  if(e.key==='Escape') toggleOverlay(false);
});
function toggleOverlay(show){ document.getElementById('overlay').classList.toggle('show', show); }

/* ================= WIDGETS ================= */
const initialized = {};
function initSlideWidgets(i){
  const id = slides[i].id;
  if(initialized[id]) return;
  initialized[id] = true;
  if(id==='quiz-receptors') initSimpleQuizzes([
    ['qr1','qr1-fb','Správně — CO a O₂ soutěží o stejné vazebné místo na hemu.','Zkuste znovu — CO se váže přímo na místo, kam normálně patří kyslík.'],
    ['qr2','qr2-fb','Správně — vazba mimo aktivní místo mění konformaci a tím i funkci enzymu.','Zkuste znovu — těžké kovy nemusí útočit přímo na aktivní místo.'],
    ['qr3','qr3-fb','Správně, lithium tak úzké terapeutické okno.','Zkuste znovu — text říká, že Li⁺ soutěží o totéž vazebné místo jako Mg²⁺.']
  ]);
  if(id==='quiz-classify') initSimpleQuizzes([
    ['qc1','qc1-fb','Přesně tak — nukleofily útočí na kladně nabitá centra, zde na Fe³⁺/Fe²⁺ v hemu.','Zkuste znovu — CN⁻ je samo záporně nabité, hledá tedy kladný náboj.'],
    ['qc2','qc2-fb','Ano — abstrakce vodíku radikálem je start řetězové lipoperoxidační reakce.','Zkuste znovu — radikál má nepárový elektron, nejde o klasickou alkylaci.']
  ]);
  if(id==='discussion') initDiscussion();
  if(id==='group-work') initExpertCards();
  if(id==='matching-game') initMatching();
}

function initSimpleQuizzes(list){
  list.forEach(([cardId, fbId, correctMsg, wrongMsg])=>{
    const card = document.getElementById(cardId);
    const opts = card.querySelectorAll('.quiz-opt');
    opts.forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const isCorrect = btn.dataset.correct==='true';
        opts.forEach(o=>o.disabled=true);
        btn.classList.add(isCorrect?'correct':'wrong');
        if(!isCorrect){ opts.forEach(o=>{ if(o.dataset.correct==='true') o.classList.add('correct'); }); }
        const fb = document.getElementById(fbId);
        fb.textContent = isCorrect? correctMsg: wrongMsg;
        fb.classList.add('show');
      });
    });
  });
}

/* ---- matching game ---- */
function initMatching(){
  const pairs = [
    {left:'Oxid uhelnatý (CO)', right:'Hemové železo hemoglobinu'},
    {left:'Kyanidový ion (CN⁻)', right:'Cytochrom-c oxidasa'},
    {left:'α-amanitin', right:'RNA polymeráza II'},
    {left:'Ricin', right:'Ribozomální RNA (28S)'},
    {left:'Kadmium (Cd²⁺)', right:'Sulfanylové (–SH) skupiny proteinů'}
  ];
  const leftItems = pairs.map((p,i)=>({text:p.left, idx:i}));
  const rightItems = pairs.map((p,i)=>({text:p.right, idx:i}));
  // shuffle right items for a real matching challenge
  for(let i=rightItems.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [rightItems[i],rightItems[j]]=[rightItems[j],rightItems[i]]; }

  const leftEl = document.getElementById('match-left');
  const rightEl = document.getElementById('match-right');
  let selectedLeft = null;
  let solved = 0;

  leftItems.forEach(item=>{
    const div = document.createElement('div');
    div.className='match-item';
    div.textContent = item.text;
    div.dataset.idx = item.idx;
    div.onclick = ()=>{
      if(div.classList.contains('correct')) return;
      leftEl.querySelectorAll('.match-item').forEach(x=>x.classList.remove('selected'));
      div.classList.add('selected');
      selectedLeft = div;
    };
    leftEl.appendChild(div);
  });
  rightItems.forEach(item=>{
    const div = document.createElement('div');
    div.className='match-item';
    div.textContent = item.text;
    div.dataset.idx = item.idx;
    div.onclick = ()=>{
      if(!selectedLeft || div.classList.contains('correct')) return;
      const isMatch = selectedLeft.dataset.idx === div.dataset.idx;
      if(isMatch){
        selectedLeft.classList.remove('selected'); selectedLeft.classList.add('correct');
        div.classList.add('correct');
        solved++;
        selectedLeft = null;
        if(solved===pairs.length){
          document.getElementById('match-result').textContent = 'Výborně — všechny páry sedí! Katalytické (amanitin, ricin) i vazebné (CO, CN⁻, Cd²⁺) mechanismy jsme dnes probrali podrobně.';
        }
      } else {
        div.classList.add('wrong');
        setTimeout(()=>div.classList.remove('wrong'), 500);
      }
    };
    rightEl.appendChild(div);
  });
}
