<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Metody zjišťování a predikce toxicity — Přednáška 6 (obsáhlá verze)</title>
<style>
  :root{
    --paper:#F4F5EF;
    --paper-deep:#ECEEE4;
    --ink:#1E2019;
    --ink-soft:#5A5D51;
    --amber:#B9791E;
    --amber-deep:#8F5D14;
    --tox-green:#3E5C42;
    --tox-green-deep:#2A3F2D;
    --danger:#9C3B2E;
    --blue:#3A5A72;
    --blue-deep:#233C4E;
    --line:#D6D6C6;
    --card:#FFFFFE;
    --serif: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', serif;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    --mono: 'SF Mono', SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans);
    overflow:hidden; font-size:18px;
  }
  ::selection{ background: var(--amber); color:#fff; }

  #topbar{
    position:fixed; top:0; left:0; right:0; height:54px;
    display:flex; align-items:center; gap:16px; padding:0 20px; z-index:50;
    background:linear-gradient(to bottom, rgba(244,245,239,0.97), rgba(244,245,239,0.85));
    border-bottom:1px solid var(--line);
  }
  #topbar .brand{ font-family:var(--serif); font-size:16px; font-style:italic; color:var(--ink-soft); white-space:nowrap; }
  #progress-track{ flex:1; height:3px; background:var(--line); border-radius:2px; overflow:hidden; }
  #progress-fill{ height:100%; width:0%; background:var(--amber); transition:width .35s ease; }
  #counter{ font-family:var(--mono); font-size:13px; color:var(--ink-soft); white-space:nowrap; }
  #menu-btn{
    font-family:var(--sans); font-size:14px; color:var(--ink); background:var(--card);
    border:1px solid var(--line); border-radius:6px; padding:6px 12px; cursor:pointer;
  }
  #menu-btn:hover{ border-color:var(--amber); }

  #deck{ position:relative; width:100%; height:100%; padding-top:54px; }
  .slide{
    position:absolute; inset:0; top:54px; display:flex; align-items:center; justify-content:center;
    padding:36px 7vw 90px 7vw; opacity:0; visibility:hidden; transform:translateY(14px);
    transition:opacity .4s ease, transform .4s ease; overflow-y:auto;
  }
  .slide.active{ opacity:1; visibility:visible; transform:translateY(0); }
  .slide-inner{ width:100%; max-width:1000px; }
  .eyebrow{ font-family:var(--mono); font-size:16px; letter-spacing:.02em; color:var(--amber-deep); margin:0 0 12px 0; }
  h1.headline{ font-family:var(--serif); font-weight:400; font-size:clamp(30px,4.6vw,50px); line-height:1.1; margin:0 0 16px 0; }
  h2.headline{ font-family:var(--serif); font-weight:400; font-size:clamp(24px,3.2vw,34px); line-height:1.18; margin:0 0 16px 0; }
  p.lede{ font-size:19px; line-height:1.55; color:var(--ink-soft); max-width:700px; }
  .body-text{ font-size:19px; line-height:1.6; color:var(--ink); max-width:760px; }
  .body-text + .body-text{ margin-top:10px; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:10px; padding:20px 22px; }
  .grid-2{ display:grid; grid-template-columns:1fr 1fr; gap:18px; }
  .grid-3{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
  @media (max-width:800px){ .grid-2,.grid-3{ grid-template-columns:1fr; } }
  ul.plain{ margin:0; padding-left:22px; font-size:18px; }
  ul.plain li{ margin-bottom:9px; line-height:1.5; }
  blockquote.quote{ font-family:var(--serif); font-style:italic; font-size:26px; line-height:1.4; color:var(--tox-green-deep); border-left:3px solid var(--amber); padding-left:22px; margin:22px 0; }
  blockquote.quote cite{ display:block; font-size:15px; font-style:normal; color:var(--ink-soft); margin-top:8px; }
  #navbtns{ position:fixed; bottom:22px; right:28px; display:flex; gap:10px; z-index:50; }
  .navbtn{ width:46px; height:46px; border-radius:50%; border:1px solid var(--line); background:var(--card); color:var(--ink); font-size:19px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .navbtn:hover{ border-color:var(--amber); color:var(--amber-deep); }
  .navbtn:disabled{ opacity:.3; cursor:default; }
  #overlay{ position:fixed; inset:0; background:rgba(30,32,25,.94); z-index:100; display:none; padding:56px 8vw; overflow-y:auto; }
  #overlay.show{ display:block; }
  #overlay h3{ font-family:var(--serif); color:#fff; font-weight:400; font-size:23px; margin-bottom:20px; }
  #overlay-list{ list-style:none; margin:0; padding:0; columns:2; column-gap:40px; }
  @media (max-width:800px){ #overlay-list{ columns:1; } }
  #overlay-list li{ color:#EDEEE6; font-size:16px; padding:9px 0; border-bottom:1px solid rgba(255,255,255,.12); cursor:pointer; break-inside:avoid; }
  #overlay-list li span{ font-family:var(--mono); color:var(--amber); margin-right:10px; font-size:13px; }
  #overlay-list li:hover{ color:var(--amber); }
  #overlay-close{ position:absolute; top:22px; right:30px; color:#fff; font-size:28px; background:none; border:none; cursor:pointer; }

  .quiz-card{ background:var(--card); border:1px solid var(--line); border-radius:12px; padding:22px 26px; margin-top:10px; }
  .quiz-q{ font-size:19px; font-weight:600; margin-bottom:16px; line-height:1.45; }
  .quiz-opt{ display:block; width:100%; text-align:left; padding:13px 16px; margin-bottom:10px; border:1px solid var(--line); border-radius:8px; background:#fff; cursor:pointer; font-size:18px; font-family:var(--sans); color:var(--ink); }
  .quiz-opt:hover{ border-color:var(--amber); }
  .quiz-opt.correct{ border-color:var(--tox-green); background:#EAF1EA; color:var(--tox-green-deep); font-weight:600; }
  .quiz-opt.wrong{ border-color:var(--danger); background:#F7EAE7; color:var(--danger); }
  .quiz-opt[disabled]{ cursor:default; }
  .quiz-feedback{ margin-top:14px; font-size:18px; line-height:1.55; color:var(--ink-soft); display:none; }
  .quiz-feedback.show{ display:block; }

  table.data-table{ width:100%; border-collapse:collapse; font-size:18px; margin-top:10px; }
  table.data-table th{ text-align:left; font-family:var(--mono); font-size:16px; color:var(--ink-soft); padding:9px 10px; border-bottom:1px solid var(--ink); }
  table.data-table td{ padding:10px 10px; border-bottom:1px solid var(--line); }
  table.data-table tr.highlight td{ background:#FBF0DD; font-weight:600; }
  table.data-table.compact{ font-size:16.5px; }
  table.data-table.compact th{ font-size:14px; padding:7px 8px; }
  table.data-table.compact td{ padding:6px 8px; }
  table.data-table td.num, table.data-table th.num{ text-align:right; font-variant-numeric:tabular-nums; }

  .tl-item{ min-width:200px; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 16px; cursor:pointer; flex-shrink:0; }
  .tl-item .tl-year{ font-family:var(--mono); font-size:18px; color:var(--amber-deep); }
  .tl-item .tl-title{ font-family:var(--serif); font-size:20px; margin:4px 0 8px 0; }
  .tl-item .tl-detail{ font-size:19px; color:var(--ink-soft); line-height:1.5; display:none; }
  .tl-item.open .tl-detail{ display:block; }
  .tl-item.open{ border-color:var(--amber); }

  .footer-note{ margin-top:20px; font-size:18px; color:var(--ink-soft); font-family:var(--mono); line-height:1.5; }
  .sources{ font-size:14px; color:var(--ink-soft); line-height:1.6; }
  .sources p{ margin:0 0 6px 0; }
  .cite{ font-size:12.5px; color:var(--ink-soft); line-height:1.45; margin-top:10px; }
  .flag{ font-size:13px; color:var(--danger); margin-top:6px; }

  .diagram-box{ background:#fff; border:1px solid var(--line); border-radius:10px; padding:14px; margin-top:12px; }
  .scheme-img{ width:100%; max-width:720px; display:block; margin:0 auto; border:1px solid var(--line); border-radius:8px; background:#fff; cursor:zoom-in; }
  .scheme-img.wide{ max-width:960px; }
  .scheme-img.narrow{ max-width:520px; }
  .scheme-img.tiny{ max-width:300px; }
  .diagram-box svg{ cursor:zoom-in; }
  figure.fig{ margin:12px 0 0 0; }
  figure.fig figcaption{ font-size:12.5px; color:var(--ink-soft); text-align:center; margin-top:6px; line-height:1.45; }
  .portrait{ max-height:300px; width:auto; max-width:100%; }

  #lightbox{ position:fixed; inset:0; background:rgba(15,16,12,.95); z-index:300; display:none; align-items:center; justify-content:center; padding:4vh 4vw; cursor:zoom-out; }
  #lightbox.show{ display:flex; }
  #lightbox-inner{ max-width:100%; max-height:100%; cursor:default; }
  #lightbox-inner img{ display:block; max-width:92vw; max-height:92vh; border-radius:10px; background:#fff; }
  #lightbox-inner svg{ display:block; width:92vw; height:auto; max-height:92vh; background:#fff; border-radius:10px; padding:28px; }
  #lightbox-hint{ position:absolute; bottom:22px; left:50%; transform:translateX(-50%); color:#B9B9A8; font-family:var(--mono); font-size:13px; }

  .match-wrap{ display:grid; grid-template-columns:1fr 1fr; gap:24px; margin-top:14px; }
  @media (max-width:760px){ .match-wrap{ grid-template-columns:1fr; } }
  .match-col-title{ font-family:var(--mono); font-size:13px; color:var(--ink-soft); margin-bottom:8px; }
  .match-item{ background:var(--card); border:1px solid var(--line); border-radius:8px; padding:11px 14px; margin-bottom:8px; font-size:18px; cursor:pointer; }
  .match-item.selected{ border-color:var(--amber); background:#FBF0DD; }
  .match-item.correct{ border-color:var(--tox-green); background:#EAF1EA; }
  .match-item.wrong{ border-color:var(--danger); background:#F7EAE7; }
  .match-result{ margin-top:14px; font-size:18px; color:var(--ink-soft); min-height:24px; }

  /* třídění do kategorií (3R) */
  .sort-row{ display:grid; grid-template-columns:1fr auto; gap:12px; align-items:center; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:10px 14px; margin-bottom:8px; font-size:17.5px; }
  .sort-row.correct{ border-color:var(--tox-green); background:#EAF1EA; }
  .sort-btns{ display:flex; gap:6px; }
  .sort-btn{ font-family:var(--sans); font-size:14.5px; padding:6px 10px; border:1px solid var(--line); border-radius:6px; background:#fff; cursor:pointer; color:var(--ink); }
  .sort-btn:hover{ border-color:var(--amber); }
  .sort-btn.wrong{ border-color:var(--danger); background:#F7EAE7; color:var(--danger); }
  .sort-btn.right{ border-color:var(--tox-green); background:var(--tox-green); color:#fff; }
  .sort-why{ grid-column:1 / -1; font-size:15.5px; color:var(--ink-soft); display:none; }
  .sort-row.correct .sort-why{ display:block; }

  details.calc{ background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 18px; margin-top:12px; }
  details.calc summary{ cursor:pointer; font-family:var(--sans); font-weight:600; color:var(--amber-deep); font-size:18px; outline:none; }
  .calc-step{ font-family:var(--mono); font-size:19px; line-height:1.9; color:var(--ink); }
  .calc-step .res{ color:var(--tox-green-deep); font-weight:700; }
  .calc-step .bad{ color:var(--danger); font-weight:700; }
  .calc-note{ font-family:var(--sans); font-size:18px; line-height:1.5; color:var(--ink-soft); margin-top:8px; }

  /* zadání / řešení */
  .task-box{ background:var(--card); border:1px solid var(--line); border-left:4px solid var(--amber); border-radius:10px; padding:16px 20px; margin-top:12px; }
  .task-box ol{ margin:0; padding-left:24px; font-size:18px; }
  .task-box ol li{ margin-bottom:8px; line-height:1.5; }
  .sol-box{ background:#F3F7F2; border:1px solid #C9D8CA; border-left:4px solid var(--tox-green); border-radius:10px; padding:16px 20px; margin-top:12px; }
  .sol-box .calc-step{ font-size:18px; line-height:1.8; }
  .sol-box ul.plain li{ margin-bottom:7px; }
  .sol-label{ font-family:var(--mono); font-size:13px; color:var(--tox-green-deep); letter-spacing:.03em; margin-bottom:6px; }
  .hint{ font-size:16px; color:var(--ink-soft); margin-top:10px; line-height:1.5; }
  .think{ background:#EEF3F6; border:1px solid #C6D4DE; border-left:4px solid var(--blue); border-radius:10px; padding:14px 18px; margin-top:14px; font-size:18px; line-height:1.5; }
  .think b{ font-family:var(--mono); font-size:13px; color:var(--blue-deep); display:block; margin-bottom:4px; letter-spacing:.03em; font-weight:600; }

  @media (prefers-reduced-motion: reduce){ .slide, .navbtn, #progress-fill{ transition:none !important; } }
</style>
</head>
<body>

<div id="topbar">
  <div class="brand">Metody zjišťování a predikce toxicity · Přednáška 6 · obsáhlá verze</div>
  <div id="progress-track"><div id="progress-fill"></div></div>
  <div id="counter">1 / 1</div>
  <button id="menu-btn" onclick="toggleOverlay(true)">Obsah</button>
</div>

<div id="deck"></div>

<div id="navbtns">
  <button class="navbtn" id="prevBtn" onclick="prevSlide()">←</button>
  <button class="navbtn" id="nextBtn" onclick="nextSlide()">→</button>
</div>

<div id="lightbox" onclick="closeLightbox()">
  <div id="lightbox-inner" onclick="event.stopPropagation()"></div>
  <div id="lightbox-hint">klikněte mimo obrázek nebo stiskněte Esc pro zavření</div>
</div>

<div id="overlay">
  <button id="overlay-close" onclick="toggleOverlay(false)">×</button>
  <h3>Přeskočit na</h3>
  <ul id="overlay-list"></ul>
</div>

<script>
const slides = [];
function slide(id, title, html){ slides.push({id, title, html}); }

/* =====================================================================
   0. ÚVOD
   ===================================================================== */
slide('title','Titulní strana', `
  <div class="slide-inner">
    <p class="eyebrow">Ing. Pavla Fojtíková, Ph.D. · Přírodovědecká fakulta JU</p>
    <h1 class="headline">Metody zjišťování a predikce toxicity látek</h1>
    <p class="lede">Přednáška 6: od LD50 k orgánům na čipu a predikci toxicity pomocí umělé inteligence</p>
    <p class="footer-note">Laboratoř analytické a environmentální chemie</p>
  </div>
`);

slide('outline','Osnova přednášky 6', `
  <div class="slide-inner">
    <p class="eyebrow">Dnes</p>
    <h2 class="headline">Osnova</h2>
    <ul class="plain" style="font-size:19px;">
      <li>Proč a jak testujeme toxicitu</li>
      <li>Historie metod: 1538–2026</li>
      <li>Klasické testy in vivo a jejich limity</li>
      <li>In vitro metody, NAMs, AOP a integrované strategie</li>
      <li>Orgány na čipu (organ-on-chip)</li>
      <li>In silico toxikologie a AI</li>
      <li>Regulace 2025–2026, analýza rizika</li>
    </ul>
    <p class="footer-note">V přednášce průběžně: kvízy, úkoly a otázky k úsudku.</p>
  </div>
`);

slide('cile','Výukové cíle', `
  <div class="slide-inner">
    <p class="eyebrow">Po přednášce byste měli umět</p>
    <h2 class="headline">Výukové cíle</h2>
    <ul class="plain">
      <li>vysvětlit LD50, NOAEL, LOAEL, EC50 a limity zvířecích testů</li>
      <li>rozlišit metody in vivo, in vitro, in chemico a in silico</li>
      <li>vysvětlit pojmy NAMs, AOP, IATA a definovaný přístup</li>
      <li>kriticky zhodnotit data o orgánech na čipu a AI predikcích</li>
      <li>shrnout regulační vývoj v USA a EU (2025–2026)</li>
    </ul>
  </div>
`);

slide('proc-testujeme','Proč testujeme toxicitu', `
  <div class="slide-inner">
    <p class="eyebrow">1. Úvod a motivace</p>
    <h2 class="headline">Data o nebezpečnosti vyžaduje legislativa</h2>
    <ul class="plain">
      <li>léčiva</li>
      <li>průmyslové chemikálie (v EU nařízení REACH)</li>
      <li>pesticidy a biocidy</li>
      <li>potravinářská aditiva, kosmetika</li>
    </ul>
    <div class="think"><b>KLÍČOVÁ OTÁZKA PŘEDNÁŠKY</b>Jak dobře předpovídají data z laboratoře, ze zvířat nebo z počítače účinek látky na člověka a ekosystémy?</div>
  </div>
`);

slide('kviz-odhad','Zahřívací odhad', `
  <div class="slide-inner">
    <p class="eyebrow">Zahřívací otázka · tipněte si</p>
    <h2 class="headline">Kolik závažných nežádoucích účinků léčiv zachytily testy na zvířatech?</h2>
    <div class="quiz-card" id="q-odhad">
      <div class="quiz-q">Po uvedení na trh bylo zjištěno 93 závažných nežádoucích účinků. Kolik procent z nich bylo zachyceno v předklinických studiích na zvířatech?</div>
      <button class="quiz-opt" data-correct="false">asi 80 %</button>
      <button class="quiz-opt" data-correct="false">asi 50 %</button>
      <button class="quiz-opt" data-correct="true">asi 19 %</button>
      <div class="quiz-feedback" id="q-odhad-fb"></div>
    </div>
    <p class="cite">Van Norman GA (2019) JACC Basic Transl Sci 4(7):845–854.</p>
  </div>
`);

slide('fialuridin','Když testy selhaly', `
  <div class="slide-inner">
    <p class="eyebrow">1. Úvod · dva dobře dokumentované případy</p>
    <h2 class="headline">Když předklinické testy selhaly</h2>
    <div class="grid-2">
      <div class="card">
        <p class="body-text" style="margin:0;"><strong>Fialuridin (FIAU), 1993</strong><br>nukleosidový analog, klinická studie u chronické hepatitidy B. Ve 13. týdnu selhání jater s laktátovou acidózou: ze 7 pacientů 5 zemřelo, 2 přežili díky transplantaci jater. Příčina: pravděpodobně poškození mitochondrií.</p>
      </div>
      <div class="card">
        <p class="body-text" style="margin:0;"><strong>Troglitazon, 1997–2000</strong><br>antidiabetikum, staženo v březnu 2000 po desítkách případů těžkého selhání jater. Mechanismus (reaktivní metabolity, inhibice transportu žlučových kyselin) byl objasněn až zpětně.</p>
      </div>
    </div>
    <p class="cite">McKenzie R et al. (1995) N Engl J Med 333:1099–1105; Scheen AJ (2001) Diabetes Metab 27:305–313.</p>
  </div>
`);

slide('van-norman','Selhání léčiv v klinickém vývoji', `
  <div class="slide-inner">
    <p class="eyebrow">1. Úvod · data</p>
    <h2 class="headline">Kolik léčiv projde vývojem?</h2>
    <figure class="fig">
      <img class="scheme-img narrow" src="obrázky_6/vannorman2019_selhani.jpg" alt="Podíl selhání léčiv v předklinické a klinické fázi">
      <figcaption>Podíl neúspěšných a úspěšných léčiv v předklinické a klinické fázi; vpravo hypotetický stav, kdyby se podařilo předejít selháním kvůli toxicitě.<br>Van Norman GA (2019) JACC Basic Transl Sci 4(7):845–854, obr. 1 (CC BY-NC-ND 4.0).</figcaption>
    </figure>
  </div>
`);

slide('kviz-90','Pozor na číslo 90 %', `
  <div class="slide-inner">
    <p class="eyebrow">Kontrolní zastávka · kritické čtení</p>
    <h2 class="headline">„90 % léčiv selže v klinickém vývoji“</h2>
    <div class="quiz-card" id="q-90">
      <div class="quiz-q">Média z toho často vyvozují, že „zvířecí testy selhávají v 90 % případů“. Je to správně?</div>
      <button class="quiz-opt" data-correct="false">Ano, každé selhání v klinice je selháním zvířecího modelu.</button>
      <button class="quiz-opt" data-correct="true">Ne. Většina selhání má jiné příčiny než nepředpovězenou toxicitu.</button>
      <div class="quiz-feedback" id="q-90-fb"></div>
    </div>
    <p class="cite">Sun D et al. (2022) Acta Pharm Sin B 12(7):3049–3062 (analýza klinických dat 2010–2017).</p>
  </div>
`);

/* =====================================================================
   2. HISTORIE
   ===================================================================== */
slide('casova-osa','Časová osa', `
  <div class="slide-inner">
    <p class="eyebrow">2. Historický vývoj · přehled</p>
    <h2 class="headline">Od Paracelsa k regulačnímu obratu</h2>
    <figure class="fig">
      <img class="scheme-img wide" src="obrázky_6/casova_osa.png" alt="Časová osa vývoje metod zjišťování toxicity">
      <figcaption>Barva značí typ milníku. Vlastní zpracování podle Borzelleca 2000; Michaleas 2022; Trevan 1927; Russell &amp; Burch 1959; Krewski 2010; Ankley 2010; Huh 2010; Mayr 2016; Ewart 2022; OECD; FDA; EK.</figcaption>
    </figure>
  </div>
`);

slide('paracelsus-orfila','Paracelsus a Orfila', `
  <div class="slide-inner">
    <p class="eyebrow">2. Historie · 16.–19. století</p>

const deck = document.getElementById('deck');
slides.forEach((s,i)=>{
  const el = document.createElement('div');
  el.className='slide'; el.id='slide-'+i; el.innerHTML=s.html;
  deck.appendChild(el);
});
const overlayList = document.getElementById('overlay-list');
slides.forEach((s,i)=>{
  const li = document.createElement('li');
  li.innerHTML = '<span>'+String(i+1).padStart(2,'0')+'</span>'+s.title;
  li.onclick = ()=>{ goTo(i); toggleOverlay(false); };
  overlayList.appendChild(li);
});

let current = 0;
function render(){
  document.querySelectorAll('.slide').forEach((el,i)=> el.classList.toggle('active', i===current));
  document.getElementById('progress-fill').style.width = ((current+1)/slides.length*100)+'%';
  document.getElementById('counter').textContent = (current+1)+' / '+slides.length;
  document.getElementById('prevBtn').disabled = current===0;
  document.getElementById('nextBtn').disabled = current===slides.length-1;
  initSlideWidgets(current);
}
function goTo(i){ current = Math.max(0, Math.min(slides.length-1, i)); render(); }
function nextSlide(){ goTo(current+1); }
function prevSlide(){ goTo(current-1); }
document.addEventListener('keydown', (e)=>{
  if(document.getElementById('lightbox').classList.contains('show')){ if(e.key==='Escape') closeLightbox(); return; }
  if(document.getElementById('overlay').classList.contains('show')){ if(e.key==='Escape') toggleOverlay(false); return; }
  if(e.key==='ArrowRight' || e.key===' ') nextSlide();
  if(e.key==='ArrowLeft') prevSlide();
  if(e.key==='Escape') toggleOverlay(false);
});
function toggleOverlay(show){ document.getElementById('overlay').classList.toggle('show', show); }

/* ---- schema lightbox (click to enlarge) ---- */
deck.addEventListener('click', (e)=>{
  const img = e.target.closest('.scheme-img');
  if(img){ openLightbox('<img src="'+img.getAttribute('src')+'" alt="'+(img.getAttribute('alt')||'')+'">'); return; }
  const svg = e.target.closest('.diagram-box svg');
  if(svg){ openLightbox(svg.outerHTML); return; }
});
function openLightbox(html){
  document.getElementById('lightbox-inner').innerHTML = html;
  document.getElementById('lightbox').classList.add('show');
}
function closeLightbox(){
  document.getElementById('lightbox').classList.remove('show');
  document.getElementById('lightbox-inner').innerHTML = '';
}

/* ================= WIDGETS ================= */
const initialized = {};
function initSlideWidgets(i){

  const Q = {

    'kviz-90':[['q-90','q-90-fb','Správně. Podle analýzy 2010–2017 připadá 40–50 % neúspěchů na nedostatečnou účinnost, asi 30 % na toxicitu, 10–15 % na farmakokinetiku a asi 10 % na komerční důvody. Problém prediktivity je reálný, ale číslo 90 % ho nekvantifikuje.','Ne. Podle analýzy 2010–2017 připadá 40–50 % neúspěchů na nedostatečnou účinnost, asi 30 % na toxicitu, 10–15 % na farmakokinetiku a asi 10 % na komerční důvody.']],
    'kviz-noael':[['q-noael','q-noael-fb','Správně. NOAEL je nejvyšší testovaná dávka bez účinku, LOAEL nejnižší testovaná dávka s účinkem. Obě jsou vždy skutečně testované dávky, skutečný práh leží někde mezi nimi.','Ne. NOAEL i LOAEL jsou vždy skutečně testované dávky: NOAEL = 10, LOAEL = 30 mg/kg/den. Skutečný práh leží někde mezi nimi a průměr nemá oporu v datech.']],
    'kviz-ames':[['q-ames','q-ames-fb','Správně. Ames zachytí mutagenitu u bakterií. Ne každý mutagen je karcinogen a existují i negenotoxické (epigenetické) karcinogeny, které Ames nezachytí (přednáška 8).','Ne. Ames zachytí mutagenitu u bakterií; je to varovný signál. Ne každý mutagen je karcinogen a negenotoxické karcinogeny Ames nezachytí.']],
    'kviz-2ze3':[['q-2ze3','q-2ze3-fb','Správně. Výsledek „2 ze 3“ určují dva shodné výsledky. Test na zvířatech (LLNA) není potřeba.','Ne. V přístupu „2 ze 3“ rozhodují dva shodné výsledky, tedy senzibilizátor, a to bez testu na zvířatech.']],
    'kviz-0':[['q-zero','q-zero-fb','Přesně tak. Vybrána byla léčiva, která na zvířatech prošla jako bezpečná a hepatotoxicitu projevila až u člověka. Hodnota 0 % tedy není nezávislé měření.','Ne. Vybrána byla léčiva, která na zvířatech prošla jako bezpečná, takže 0 % je dáno výběrem, ne nezávislým měřením.']],
    'kviz-pdms':[['q-pdms','q-pdms-fb','Správně. Benzo[a]pyren je silně lipofilní PAU a sorbuje se do hydrofobního PDMS, takže buňky „vidí“ nižší koncentraci a toxicita se podhodnotí. To je zvlášť důležité u organických polutantů.','Ne. Sorpce do hydrofobního PDMS se týká lipofilních látek, jako je benzo[a]pyren. Glukóza i NaCl jsou polární.']],
    'kviz-domena':[['q-domena','q-domena-fb','Správně. Necílená LC-HRMS a in silico predikce se dobře doplňují, ale jen tehdy, když látka leží v doméně použitelnosti. Predikce pak slouží k prioritizaci.','Ne. Rozumný postup je ověřit doménu použitelnosti a predikci použít k prioritizaci, ne jako definitivní odpověď ani ji zcela zavrhnout.']],
    'kviz-regulace':[
      ['q-reg1','q-reg1-fb','Správně. Testy na zvířatech nejsou zakázány, jen už nejsou zákonem vyžadovány jako jediná možnost.','Ne. Zákon testy nezakázal, jen zrušil povinnost a připustil alternativy (buněčné modely, MPS, počítačové modely).'],
      ['q-reg2','q-reg2-fb','Správně. Karcinogeneze je vícestupňový proces (přednáška 8) a Amesův test pokryje jen mutagenitu.','Ne. Amesův test pokryje jen mutagenitu, ne celý vícestupňový proces karcinogeneze.']]

function initSimpleQuizzes(list){
  list.forEach(([cardId, fbId, correctMsg, wrongMsg])=>{
    const card = document.getElementById(cardId);
    const opts = card.querySelectorAll('.quiz-opt');
    opts.forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const isCorrect = btn.dataset.correct==='true';
        opts.forEach(o=>o.disabled=true);
        btn.classList.add(isCorrect?'correct':'wrong');
        if(!isCorrect){ opts.forEach(o=>{ if(o.dataset.correct==='true') o.classList.add('correct'); }); }
        const fb = document.getElementById(fbId);
        fb.textContent = isCorrect? correctMsg: wrongMsg;
        fb.classList.add('show');
      });
    });
  });
}

    {t:'Predikce akutní toxicity v ProTox 3.0 před plánováním experimentu', a:'Replacement', why:'In silico metoda (pro prioritizaci) poskytne informaci bez zvířat.'},
    {t:'Sdílení existujících dat mezi registranty v REACH, aby se test neopakoval', a:'Reduction', why:'Zabraňuje duplicitním testům, takže se použije méně zvířat.'}

  const wrap = document.getElementById('sort3r');
  items.forEach(it=>{
    const row = document.createElement('div'); row.className='sort-row';
    row.innerHTML = '<div>'+it.t+'</div><div class="sort-btns"></div><div class="sort-why">✓ '+it.a+': '+it.why+'</div>';
    const btns = row.querySelector('.sort-btns');
    ['Replacement','Reduction','Refinement'].forEach(c=>{

      b.onclick = ()=>{

        if(c===it.a){ row.classList.add('correct'); b.classList.add('right'); }
        else { b.classList.add('wrong'); setTimeout(()=>b.classList.remove('wrong'),600); }

     a:'Ne automaticky. Střet zájmů je důvod číst pozorněji: ověřit design (slepé testování, předem definovaná sada léčiv podle konsorcia IQ MPS), velikost vzorku a interval spolehlivosti a hledat nezávislé replikace. Problematické je spíš zkrácené podání výsledků („87 %“ bez kontextu podskupiny) než samotný fakt financování.'},

/* ---- párování (obecné) ---- */
function initMatching(prefix, pairs, doneMsg){
  const leftItems = pairs.map((p,i)=>({text:p.left, idx:i}));
  const rightItems = pairs.map((p,i)=>({text:p.right, idx:i}));
  for(let i=rightItems.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [rightItems[i],rightItems[j]]=[rightItems[j],rightItems[i]]; }
  const leftEl = document.getElementById(prefix+'-left');
  const rightEl = document.getElementById(prefix+'-right');
  let selectedLeft = null, solved = 0;
  leftItems.forEach(item=>{
    const div = document.createElement('div');
    div.className='match-item'; div.textContent = item.text; div.dataset.idx = item.idx;
    div.onclick = ()=>{
      if(div.classList.contains('correct')) return;
      leftEl.querySelectorAll('.match-item').forEach(x=>x.classList.remove('selected'));
      div.classList.add('selected'); selectedLeft = div;
    };
    leftEl.appendChild(div);
  });
  rightItems.forEach(item=>{
    const div = document.createElement('div');
    div.className='match-item'; div.textContent = item.text; div.dataset.idx = item.idx;
    div.onclick = ()=>{
      if(!selectedLeft || div.classList.contains('correct')) return;
      if(selectedLeft.dataset.idx === div.dataset.idx){
        selectedLeft.classList.remove('selected'); selectedLeft.classList.add('correct');
        div.classList.add('correct'); solved++; selectedLeft = null;
        if(solved===pairs.length) document.getElementById(prefix+'-result').textContent = doneMsg;
      } else {
        div.classList.add('wrong'); setTimeout(()=>div.classList.remove('wrong'), 500);
      }
    };
    rightEl.appendChild(div);
  });
}
