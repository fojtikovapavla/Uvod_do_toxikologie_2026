<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Metody měření expozice a biologický monitoring — Přednáška 5</title>
<style>
  :root{
    --paper:#F4F5EF;
    --paper-deep:#ECEEE4;
    --ink:#1E2019;
    --ink-soft:#5A5D51;
    --amber:#B9791E;
    --amber-deep:#8F5D14;
    --tox-green:#3E5C42;
    --tox-green-deep:#2A3F2D;
    --danger:#9C3B2E;
    --blue:#3A5A72;
    --blue-deep:#233C4E;
    --line:#D6D6C6;
    --card:#FFFFFE;
    --serif: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', serif;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    --mono: 'SF Mono', SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans);
    overflow:hidden; font-size:18px;
  }
  ::selection{ background: var(--amber); color:#fff; }

  #topbar{
    position:fixed; top:0; left:0; right:0; height:54px;
    display:flex; align-items:center; gap:16px; padding:0 20px; z-index:50;
    background:linear-gradient(to bottom, rgba(244,245,239,0.97), rgba(244,245,239,0.85));
    border-bottom:1px solid var(--line);
  }
  #topbar .brand{ font-family:var(--serif); font-size:16px; font-style:italic; color:var(--ink-soft); white-space:nowrap; }
  #progress-track{ flex:1; height:3px; background:var(--line); border-radius:2px; overflow:hidden; }
  #progress-fill{ height:100%; width:0%; background:var(--amber); transition:width .35s ease; }
  #counter{ font-family:var(--mono); font-size:13px; color:var(--ink-soft); white-space:nowrap; }
  #menu-btn{
    font-family:var(--sans); font-size:14px; color:var(--ink); background:var(--card);
    border:1px solid var(--line); border-radius:6px; padding:6px 12px; cursor:pointer;
  }
  #menu-btn:hover{ border-color:var(--amber); }

  #deck{ position:relative; width:100%; height:100%; padding-top:54px; }
  .slide{
    position:absolute; inset:0; top:54px; display:flex; align-items:center; justify-content:center;
    padding:36px 7vw 90px 7vw; opacity:0; visibility:hidden; transform:translateY(14px);
    transition:opacity .4s ease, transform .4s ease; overflow-y:auto;
  }
  .slide.active{ opacity:1; visibility:visible; transform:translateY(0); }
  .slide-inner{ width:100%; max-width:1000px; }
  .eyebrow{ font-family:var(--mono); font-size:16px; letter-spacing:.02em; color:var(--amber-deep); margin:0 0 12px 0; }
  h1.headline{ font-family:var(--serif); font-weight:400; font-size:clamp(30px,4.6vw,50px); line-height:1.1; margin:0 0 16px 0; }
  h2.headline{ font-family:var(--serif); font-weight:400; font-size:clamp(24px,3.2vw,34px); line-height:1.18; margin:0 0 16px 0; }
  p.lede{ font-size:19px; line-height:1.55; color:var(--ink-soft); max-width:700px; }
  .body-text{ font-size:19px; line-height:1.6; color:var(--ink); max-width:760px; }
  .body-text + .body-text{ margin-top:10px; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:10px; padding:20px 22px; }
  .grid-2{ display:grid; grid-template-columns:1fr 1fr; gap:18px; }
  .grid-3{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
  .grid-4{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
  @media (max-width:800px){ .grid-2,.grid-3,.grid-4{ grid-template-columns:1fr; } }
  .tag{ display:inline-block; font-family:var(--mono); font-size:12px; padding:3px 9px; border-radius:20px; border:1px solid var(--line); color:var(--ink-soft); margin-bottom:10px; }
  .tag.new{ border-color:var(--danger); color:var(--danger); }
  ul.plain{ margin:0; padding-left:22px; font-size:18px; }
  ul.plain li{ margin-bottom:9px; line-height:1.5; }
  ol.plain{ margin:0; padding-left:24px; font-size:18px; }
  ol.plain li{ margin-bottom:9px; line-height:1.5; }
  blockquote.quote{ font-family:var(--serif); font-style:italic; font-size:26px; line-height:1.4; color:var(--tox-green-deep); border-left:3px solid var(--amber); padding-left:22px; margin:22px 0; }
  blockquote.quote cite{ display:block; font-size:15px; font-style:normal; color:var(--ink-soft); margin-top:8px; }
  #navbtns{ position:fixed; bottom:22px; right:28px; display:flex; gap:10px; z-index:50; }
  .navbtn{ width:46px; height:46px; border-radius:50%; border:1px solid var(--line); background:var(--card); color:var(--ink); font-size:19px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .navbtn:hover{ border-color:var(--amber); color:var(--amber-deep); }
  .navbtn:disabled{ opacity:.3; cursor:default; }
  #overlay{ position:fixed; inset:0; background:rgba(30,32,25,.94); z-index:100; display:none; padding:56px 8vw; overflow-y:auto; }
  #overlay.show{ display:block; }
  #overlay h3{ font-family:var(--serif); color:#fff; font-weight:400; font-size:23px; margin-bottom:20px; }
  #overlay-list{ list-style:none; margin:0; padding:0; columns:2; column-gap:40px; }
  @media (max-width:800px){ #overlay-list{ columns:1; } }
  #overlay-list li{ color:#EDEEE6; font-size:16px; padding:9px 0; border-bottom:1px solid rgba(255,255,255,.12); cursor:pointer; break-inside:avoid; }
  #overlay-list li span{ font-family:var(--mono); color:var(--amber); margin-right:10px; font-size:13px; }
  #overlay-list li:hover{ color:var(--amber); }
  #overlay-close{ position:absolute; top:22px; right:30px; color:#fff; font-size:28px; background:none; border:none; cursor:pointer; }

  .quiz-card{ background:var(--card); border:1px solid var(--line); border-radius:12px; padding:24px 26px; margin-top:10px; }
  .quiz-q{ font-size:19px; font-weight:600; margin-bottom:16px; line-height:1.45; }
  .quiz-opt{ display:block; width:100%; text-align:left; padding:13px 16px; margin-bottom:10px; border:1px solid var(--line); border-radius:8px; background:#fff; cursor:pointer; font-size:18px; font-family:var(--sans); color:var(--ink); }
  .quiz-opt:hover{ border-color:var(--amber); }
  .quiz-opt.correct{ border-color:var(--tox-green); background:#EAF1EA; color:var(--tox-green-deep); font-weight:600; }
  .quiz-opt.wrong{ border-color:var(--danger); background:#F7EAE7; color:var(--danger); }
  .quiz-opt[disabled]{ cursor:default; }
  .quiz-feedback{ margin-top:14px; font-size:18px; line-height:1.55; color:var(--ink-soft); display:none; }
  .quiz-feedback.show{ display:block; }

  table.data-table{ width:100%; border-collapse:collapse; font-size:18px; margin-top:10px; }
  table.data-table th{ text-align:left; font-family:var(--mono); font-size:16px; color:var(--ink-soft); padding:9px 10px; border-bottom:1px solid var(--ink); }
  table.data-table td{ padding:10px 10px; border-bottom:1px solid var(--line); }
  table.data-table tr.highlight td{ background:#FBF0DD; font-weight:600; }
  table.data-table.compact{ font-size:16.5px; }
  table.data-table.compact th{ font-size:14px; padding:7px 8px; }
  table.data-table.compact td{ padding:6px 8px; }
  table.data-table td.num, table.data-table th.num{ text-align:right; font-variant-numeric:tabular-nums; }
  td.over{ color:var(--danger); font-weight:700; }
  td.ok{ color:var(--tox-green-deep); font-weight:600; }

  .tl-item{ min-width:200px; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 16px; cursor:pointer; flex-shrink:0; }
  .tl-item .tl-year{ font-family:var(--mono); font-size:18px; color:var(--amber-deep); }
  .tl-item .tl-title{ font-family:var(--serif); font-size:20px; margin:4px 0 8px 0; }
  .tl-item .tl-detail{ font-size:19px; color:var(--ink-soft); line-height:1.5; display:none; }
  .tl-item.open .tl-detail{ display:block; }
  .tl-item.open{ border-color:var(--amber); }

  .footer-note{ margin-top:20px; font-size:18px; color:var(--ink-soft); font-family:var(--mono); line-height:1.5; }

  .sources{ font-size:14px; color:var(--ink-soft); line-height:1.7; }

  .diagram-box{ background:#fff; border:1px solid var(--line); border-radius:10px; padding:14px; margin-top:12px; }
  .scheme-img{ width:100%; max-width:720px; display:block; margin:0 auto; border:1px solid var(--line); border-radius:8px; background:#fff; cursor:zoom-in; }
  .scheme-img.wide{ max-width:900px; }
  .scheme-img.narrow{ max-width:520px; }
  .diagram-box svg{ cursor:zoom-in; }
  figure.fig{ margin:12px 0 0 0; }
  figure.fig figcaption{ font-size:14.5px; color:var(--ink-soft); text-align:center; margin-top:6px; line-height:1.45; }

  #lightbox{ position:fixed; inset:0; background:rgba(15,16,12,.95); z-index:300; display:none; align-items:center; justify-content:center; padding:4vh 4vw; cursor:zoom-out; }
  #lightbox.show{ display:flex; }
  #lightbox-inner{ max-width:100%; max-height:100%; cursor:default; }
  #lightbox-inner img{ display:block; max-width:92vw; max-height:92vh; border-radius:10px; }
  #lightbox-inner svg{ display:block; width:92vw; height:auto; max-height:92vh; background:#fff; border-radius:10px; padding:28px; }
  #lightbox-hint{ position:absolute; bottom:22px; left:50%; transform:translateX(-50%); color:#B9B9A8; font-family:var(--mono); font-size:13px; }

  .match-wrap{ display:grid; grid-template-columns:1fr 1fr; gap:24px; margin-top:14px; }
  @media (max-width:760px){ .match-wrap{ grid-template-columns:1fr; } }
  .match-col-title{ font-family:var(--mono); font-size:13px; color:var(--ink-soft); margin-bottom:8px; }
  .match-item{ background:var(--card); border:1px solid var(--line); border-radius:8px; padding:11px 14px; margin-bottom:8px; font-size:18px; cursor:pointer; }
  .match-item.selected{ border-color:var(--amber); background:#FBF0DD; }
  .match-item.correct{ border-color:var(--tox-green); background:#EAF1EA; }
  .match-item.wrong{ border-color:var(--danger); background:#F7EAE7; }
  .match-result{ margin-top:14px; font-size:18px; color:var(--ink-soft); min-height:24px; }

  details.calc{ background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 18px; margin-top:12px; }
  details.calc summary{ cursor:pointer; font-family:var(--sans); font-weight:600; color:var(--amber-deep); font-size:18px; outline:none; }
  details.calc summary:hover{ color:var(--amber); }
  details.calc[open] summary{ margin-bottom:10px; border-bottom:1px dashed var(--line); padding-bottom:8px; }
  .calc-step{ font-family:var(--mono); font-size:19px; line-height:1.9; color:var(--ink); }
  .calc-step .res{ color:var(--tox-green-deep); font-weight:700; }
  .calc-step .bad{ color:var(--danger); font-weight:700; }
  .calc-note{ font-family:var(--sans); font-size:18px; line-height:1.5; color:var(--ink-soft); margin-top:8px; }

  /* zadání / řešení */
  .task-box{ background:var(--card); border:1px solid var(--line); border-left:4px solid var(--amber); border-radius:10px; padding:16px 20px; margin-top:12px; }
  .task-box ol{ margin:0; padding-left:24px; font-size:18px; }
  .task-box ol li{ margin-bottom:8px; line-height:1.5; }
  .sol-box{ background:#F3F7F2; border:1px solid #C9D8CA; border-left:4px solid var(--tox-green); border-radius:10px; padding:16px 20px; margin-top:12px; }
  .sol-box .calc-step{ font-size:18px; line-height:1.8; }
  .sol-label{ font-family:var(--mono); font-size:13px; color:var(--tox-green-deep); letter-spacing:.03em; margin-bottom:6px; }
  .hint{ font-size:16px; color:var(--ink-soft); margin-top:10px; line-height:1.5; }
  .prompt-box{ font-family:var(--mono); white-space:pre-wrap; font-size:15px; line-height:1.6; background:#fff; border:1px solid var(--line); border-left:4px solid var(--blue); border-radius:8px; padding:14px 18px; margin-top:12px; color:var(--ink); }
  .step-row{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-top:12px; }
  @media (max-width:800px){ .step-row{ grid-template-columns:1fr 1fr; } }
  .step{ background:var(--card); border:1px solid var(--line); border-radius:8px; padding:10px 12px; font-size:15.5px; line-height:1.4; }
  .step b{ display:block; font-family:var(--mono); font-size:12.5px; color:var(--blue); margin-bottom:3px; font-weight:600; }
  .step.loop{ border-color:var(--blue); background:#EEF3F6; }

  .expert-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:14px; }
  @media (max-width:900px){ .expert-grid{ grid-template-columns:repeat(2,1fr); } }
  @media (max-width:560px){ .expert-grid{ grid-template-columns:1fr; } }
  .expert-card{ background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px 14px; cursor:pointer; }
  .expert-card:hover{ border-color:var(--amber); }
  .expert-card .grp{ font-family:var(--mono); font-size:11.5px; color:var(--amber-deep); }
  .expert-card .name{ font-family:var(--serif); font-size:19px; margin:3px 0 0 0; }
  .expert-detail{ display:none; margin-top:8px; font-size:17px; color:var(--ink-soft); line-height:1.55; }
  .expert-card.open .expert-detail{ display:block; }
  .expert-card.open{ border-color:var(--amber); grid-column: span 3; }
  @media (max-width:900px){ .expert-card.open{ grid-column: span 2; } }
  @media (max-width:560px){ .expert-card.open{ grid-column: span 1; } }

  @media (prefers-reduced-motion: reduce){ .slide, .navbtn, #progress-fill{ transition:none !important; } }
</style>
</head>
<body>

<div id="topbar">
  <div class="brand">Metody měření expozice a biologický monitoring · Přednáška 5</div>
  <div id="progress-track"><div id="progress-fill"></div></div>
  <div id="counter">1 / 1</div>
  <button id="menu-btn" onclick="toggleOverlay(true)">Obsah</button>
</div>

<div id="deck"></div>

<div id="navbtns">
  <button class="navbtn" id="prevBtn" onclick="prevSlide()">←</button>
  <button class="navbtn" id="nextBtn" onclick="nextSlide()">→</button>
</div>

<div id="lightbox" onclick="closeLightbox()">
  <div id="lightbox-inner" onclick="event.stopPropagation()"></div>
  <div id="lightbox-hint">klikněte mimo obrázek nebo stiskněte Esc pro zavření</div>
</div>

<div id="overlay">
  <button id="overlay-close" onclick="toggleOverlay(false)">×</button>
  <h3>Přeskočit na</h3>
  <ul id="overlay-list"></ul>
</div>

<script>
const slides = [];
function slide(id, title, html){ slides.push({id, title, html}); }

/* ================= TITLE ================= */
slide('title','Titulní strana', `
  <div class="slide-inner">
    <p class="eyebrow">Ing. Pavla Fojtíková, Ph.D. · Přírodovědecká fakulta JU</p>
    <h1 class="headline">Metody měření expozice a biologický monitoring</h1>
    <p class="lede">Přednáška 5 — jak odhadnout expozici, porovnat ji s limity a ověřit, co se do těla skutečně dostalo. Pracujeme s reálnými daty ČHMÚ a s laboratorním stanovením kofeinu a jeho metabolitů v moči.</p>
    <p class="footer-note">Laboratoř analytické a environmentální chemie</p>
  </div>
`);

/* ================= OUTLINE ================= */
slide('outline','Osnova přednášky 5', `
  <div class="slide-inner">
    <p class="eyebrow">Dnes</p>
    <h2 class="headline">Osnova přednášky 5</h2>
    <ul class="plain">
      <li>Vnější expozice vs. absorbovaná dávka <em>(úkol A)</em></li>
      <li>Limity v pracovním ovzduší: PEL a NPK-P <em>(úkol B)</em></li>
      <li>Imisní limity a data ČHMÚ <em>(úkoly C, D)</em></li>
      <li>Biologické monitorování a BEL <em>(úkol E)</em></li>
      <li>Laboratorní případ: kofein <em>(úkoly 1–3)</em></li>
    </ul>
 </div>
`);

/* ================= PROC NAROCNE ================= */
slide('proc-narocne','Proč je odhad expozice náročný', `
  <div class="slide-inner">
    <p class="eyebrow">Úvod</p>
    <h2 class="headline">Proč je správný odhad expozice důležitý?</h2>
    <ul class="plain">
      <li>v experimentu dávku známe, v reálném prostředí ji musíme <strong>odhadnout</strong></li>
      <li>na odhadu stojí hodnocení rizika, epidemiologické studie i legislativní limity</li>
    </ul>
    <div class="grid-2" style="margin-top:16px;">
      <div class="card">
        <p class="body-text" style="margin:0;"><strong>Dávka podaná (intake)</strong><br>množství látky, které se dostalo do kontaktu s organismem</p>
      </div>
      <div class="card">
        <p class="body-text" style="margin:0;"><strong>Dávka absorbovaná (uptake)</strong><br>množství, které prošlo přes biologickou bariéru do organismu</p>
      </div>
    </div>
    <blockquote class="quote" style="margin-top:20px;font-size:22px;">Stejná vnější expozice může u dvou lidí vést k velmi odlišné vnitřní dávce.</blockquote>
  </div>
`);

/* ================= INHALACNI ================= */
slide('inhalacni-expozice','Inhalační expozice — model', `
  <div class="slide-inner">
    <p class="eyebrow">Modely odhadu dávky</p>
    <h2 class="headline">Inhalační expozice</h2>
    <div class="card" style="margin-top:12px;">
      <div class="calc-step" style="font-size:24px;">D<sub>inh</sub> = R · V<sub>inh</sub> · c<sub>inh</sub> · t</div>
      <ul class="plain" style="margin-top:12px;">
        <li><strong>R</strong> — retence v plicích, R = (c<sub>inh</sub> − c<sub>exh</sub>)/c<sub>inh</sub></li>
        <li><strong>V<sub>inh</sub></strong> — plicní ventilace (m³/h), roste s námahou</li>
        <li><strong>c<sub>inh</sub></strong> — koncentrace ve vdechovaném vzduchu (mg/m³)</li>
        <li><strong>c<sub>exh</sub></strong> — koncentrace ve vydechovaném vzduchu (mg/m³)</li>
        <li><strong>t</strong> — doba expozice (h)</li>
      </ul>
    </div>
    <p class="body-text" style="margin-top:14px;">Přímo měříme jen koncentraci (osobní odběr v dýchací zóně); ostatní veličiny jsou tabelované.</p>
    <p class="footer-note">20 l/min = 1,2 m³/h — s touto ventilací počítá definice PEL.</p>
  </div>
`);

/* ================= KOZNI A PERORALNI ================= */
slide('kozni-peroralni','Kožní a perorální expozice', `
  <div class="slide-inner">
    <p class="eyebrow">Modely odhadu dávky</p>
    <h2 class="headline">Expozice kůží a ústy</h2>
    <div class="grid-2">
      <div class="card">
        <p class="body-text" style="margin:0;"><strong>Kůže — 1. Fickův zákon</strong></p>
        <div class="calc-step" style="margin-top:8px;">D<sub>derm</sub> = K<sub>p</sub> · c · A · t</div>
        <p class="calc-note">K<sub>p</sub> permeabilitní koeficient (cm/h), c koncentrace na kůži, A plocha, t doba</p>
      </div>
      <div class="card">
        <p class="body-text" style="margin:0;"><strong>Ústa — potrava, voda</strong></p>
        <div class="calc-step" style="margin-top:8px;">D<sub>or</sub> = c · IR / BW</div>
        <p class="calc-note">c koncentrace v potravě/vodě, IR denní spotřeba, BW tělesná hmotnost</p>
      </div>
    </div>
    <p class="footer-note" style="margin-top:20px;">Látky s poznámkou „D" (NV 361/2007 Sb.) se významně vstřebávají kůží — měření ve vzduchu tuto část dávky nezachytí.</p>
  </div>
`);

/* ================= UKOL A ================= */
slide('ukolA-zadani','Úkol A — zadání', `
  <div class="slide-inner">
    <p class="eyebrow">Úkol A · zadání</p>
    <h2 class="headline">Kolik toluenu pracovník za směnu vstřebá?</h2>
    <p class="body-text">Lakýrník (70 kg), 8 h, toluen <strong>96 mg/m³</strong>, retence R ≈ 0,5.</p>
    <div class="task-box">
      <ol type="a">
        <li>Vypočítejte dávku při lehké práci (20 l/min), i v mg/kg.</li>
        <li>Jak se změní při těžké práci (40 l/min)?</li>
        <li>Při 40 l/min platí PEL ve výši 50 %. Proč?</li>
      </ol>
    </div>
    <p class="hint">Nápověda: převeďte ventilaci na m³/h.</p>
  </div>
`);

slide('ukolA-reseni','Úkol A — řešení', `
  <div class="slide-inner">
    <p class="eyebrow">Úkol A · řešení</p>
    <h2 class="headline">Dávka roste s ventilací</h2>
    <div class="sol-box">
      <div class="calc-step">
a) D = 0,5 · 1,2 m³/h · 96 mg/m³ · 8 h = <span class="res">≈ 461 mg</span> (≈ 6,6 mg/kg)<br>
b) D = 0,5 · 2,4 · 96 · 8 = <span class="res">≈ 922 mg</span> → dvojnásobek
      </div>
    </div>
    <div class="sol-box">

const deck = document.getElementById('deck');
slides.forEach((s,i)=>{
  const el = document.createElement('div');
  el.className='slide'; el.id='slide-'+i; el.innerHTML=s.html;
  deck.appendChild(el);
});
const overlayList = document.getElementById('overlay-list');
slides.forEach((s,i)=>{
  const li = document.createElement('li');
  li.innerHTML = '<span>'+String(i+1).padStart(2,'0')+'</span>'+s.title;
  li.onclick = ()=>{ goTo(i); toggleOverlay(false); };
  overlayList.appendChild(li);
});

let current = 0;
function render(){
  document.querySelectorAll('.slide').forEach((el,i)=> el.classList.toggle('active', i===current));
  document.getElementById('progress-fill').style.width = ((current+1)/slides.length*100)+'%';
  document.getElementById('counter').textContent = (current+1)+' / '+slides.length;
  document.getElementById('prevBtn').disabled = current===0;
  document.getElementById('nextBtn').disabled = current===slides.length-1;
  initSlideWidgets(current);
}
function goTo(i){ current = Math.max(0, Math.min(slides.length-1, i)); render(); }
function nextSlide(){ goTo(current+1); }
function prevSlide(){ goTo(current-1); }
document.addEventListener('keydown', (e)=>{
  if(document.getElementById('lightbox').classList.contains('show')){ if(e.key==='Escape') closeLightbox(); return; }
  if(document.getElementById('overlay').classList.contains('show')){ if(e.key==='Escape') toggleOverlay(false); return; }
  if(e.key==='ArrowRight' || e.key===' ') nextSlide();
  if(e.key==='ArrowLeft') prevSlide();
  if(e.key==='Escape') toggleOverlay(false);
});
function toggleOverlay(show){ document.getElementById('overlay').classList.toggle('show', show); }

/* ---- schema lightbox (click to enlarge) ---- */
deck.addEventListener('click', (e)=>{
  const img = e.target.closest('.scheme-img');
  if(img){ openLightbox('<img src="'+img.getAttribute('src')+'" alt="'+(img.getAttribute('alt')||'')+'">'); return; }
  const svg = e.target.closest('.diagram-box svg');
  if(svg){ openLightbox(svg.outerHTML); return; }
});
function openLightbox(html){
  document.getElementById('lightbox-inner').innerHTML = html;
  document.getElementById('lightbox').classList.add('show');
}
function closeLightbox(){
  document.getElementById('lightbox').classList.remove('show');
  document.getElementById('lightbox-inner').innerHTML = '';
}

/* ================= WIDGETS ================= */
const initialized = {};
function initSlideWidgets(i){
  const id = slides[i].id;
  if(initialized[id]) return;
  initialized[id] = true;
  if(id==='kviz-biomarkery') initSimpleQuizzes([
    ['qb1','qb1-fb','Správně — kreatinin se vylučuje víceméně konstantní rychlostí, takže poměr látka/kreatinin koriguje vliv ředění moči pitným režimem.','Zkuste znovu — kreatinin sám o sobě není sledovaným toxikantem, slouží jako standardizační veličina.'],
    ['qb2','qb2-fb','Správně — PEL a NPK-P se hodnotí samostatně; překročení NPK-P nelze „vyrovnat" nízkým směnovým průměrem.','Zkuste znovu — NV 361/2007 Sb. vyžaduje dodržení obou limitů; NPK-P chrání před akutními účinky krátkodobých špiček.'],
    ['qb3','qb3-fb','Správně — rozdíl plyne z exponované populace a doby expozice, nikoli z jiné toxicity látky.','Zkuste znovu — jde o tutéž látku; rozhoduje, koho a jak dlouho limit chrání.']
  ]);
  if(id==='kviz-kofein') initSimpleQuizzes([
    ['qk1','qk1-fb','Správně — hodnota mimo kalibrační rozsah metody není spolehlivá; vzorek je nutné naředit tak, aby odezva spadla do ověřeného rozsahu.','Zkuste znovu — jednoduché vydělení neřeší to, že mimo kalibrační rozsah odezva detektoru nemusí být lineární.'],
    ['qk2','qk2-fb','Správně — polárnější látky mají na nepolární (C18) koloně slabší interakci se stacionární fází, a proto eluují dříve.','Zkuste znovu — metabolity mají naopak nižší molekulovou hmotnost; retenci na obrácené fázi určuje především polarita.'],
    ['qk3','qk3-fb','Správně — vyhláška č. 432/2003 Sb. připouští k hodnocení jen moč s kreatininem 0,3–3 g/l; u silně zředěné moči standardizace selhává.','Zkuste znovu — standardizace na kreatinin má své meze; příliš zředěný vzorek se nehodnotí.']
  ]);
  if(id==='kviz-zdroje-poradi') initCycleMatching();
  if(id==='diskuse') initDiscussion();
}

function initSimpleQuizzes(list){
  list.forEach(([cardId, fbId, correctMsg, wrongMsg])=>{
    const card = document.getElementById(cardId);
    const opts = card.querySelectorAll('.quiz-opt');
    opts.forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const isCorrect = btn.dataset.correct==='true';
        opts.forEach(o=>o.disabled=true);
        btn.classList.add(isCorrect?'correct':'wrong');
        if(!isCorrect){ opts.forEach(o=>{ if(o.dataset.correct==='true') o.classList.add('correct'); }); }
        const fb = document.getElementById(fbId);
        fb.textContent = isCorrect? correctMsg: wrongMsg;
        fb.classList.add('show');
      });
    });
  });
}

function initDiscussion(){
  const qa = [
    {q:'U kofeinového experimentu se poměr metabolitů (teobromin, paraxantin, teofylin, kofein) mezi studenty výrazně lišil. Čím to může být způsobeno?',
     a:'Hlavní enzym metabolizující kofein, CYP1A2, vykazuje výrazné interindividuální rozdíly — genetický polymorfismus, indukci kouřením, inhibici některými léčivy a hormonální antikoncepcí (přednáška 4). Dále záleží na době mezi konzumací a odběrem (metabolity vznikají a vylučují se různou rychlostí), na dalších zdrojích methylxantinů ve stravě (čokoláda → teobromin) a na individuálních rozdílech v ledvinné exkreci.'},
    {q:'Pracovník má směnový průměr toluenu ve vzduchu pod PEL, a přesto má zvýšenou kyselinu hippurovou v moči. Uveďte co nejvíce možných vysvětlení.',
     a:'Kožní absorpce (toluen má poznámku D), vyšší plicní ventilace při fyzické práci, nereprezentativní měření ve vzduchu (jiné pracovní místo, krátký odběr), mimopracovní expozice (domácí kutilství, kouření), a hlavně nespecifičnost ukazatele — kyselina hippurová vzniká i z benzoátů v potravě. Proto se při nálezu 1600–2500 mg/g doplňuje specifičtější o-kresol.'},
    {q:'Proč nelze z jedné hodinové hodnoty PM10 na webu ČHMÚ rozhodnout, zda je v daném místě dodržen imisní limit?',
     a:'Imisní limit PM10 je definován pro 24h průměr s povoleným počtem 35 překročení za kalendářní rok a dále pro roční průměr. Hodinová hodnota je jen okamžitý údaj, navíc operativní (neověřený). Pro hodnocení je třeba spočítat platné denní průměry (≥ 75 % hodinových dat) a sečíst překročení za celý rok, ideálně z verifikovaných dat.'},
    {q:'Vzorek moči má kreatinin 0,15 g/l. Po přepočtu na mg/g kreatininu vyjde nejvyšší koncentrace kofeinu ze skupiny. Je to důkaz nejvyšší expozice?',
     a:'Ne. Tak zředěná moč nevyhovuje podmínce 0,3–3 g/l kreatininu (vyhl. č. 432/2003 Sb.). Při velmi nízkém kreatininu se dělí malým číslem a i malá absolutní chyba měření se výrazně zvětší; vylučování kreatininu ani látky navíc při velkém příjmu tekutin nemusí probíhat úměrně. Výsledek se nehodnotí a odběr se opakuje.'},
    {q:'V úkolu s kofeinovým nápojem byl neředěný vzorek mimo kalibrační rozsah metody. Proč nelze kalibrační přímku extrapolovat?',
     a:'Odezva detektoru je lineární jen v ověřeném rozsahu koncentrací — při vysokých koncentracích dochází k saturaci detektoru nebo přetížení kolony a vztah přestává být lineární. Extrapolace by vedla k systematické chybě (obvykle podhodnocení). Vzorek se proto ředí zpět do ověřeného rozsahu.'}
  ];
  const wrap = document.getElementById('discussion-list');
  qa.forEach((item,i)=>{
    const div = document.createElement('div');
    div.className='tl-item'; div.style.cssText='min-width:auto;width:100%;margin-bottom:10px;';
    div.innerHTML = `<div class="tl-year">Otázka ${i+1}</div><div class="tl-title" style="font-size:20px;">${item.q}</div><div class="tl-detail"><strong>Řešení:</strong> ${item.a}</div>`;
    div.onclick = ()=> div.classList.toggle('open');
    wrap.appendChild(div);
  });
}

/* ---- information-source matching ---- */
function initCycleMatching(){
  const pairs = [
    {left:'ČHMÚ', right:'měření kvality venkovního ovzduší, přehled překročení imisních limitů a otevřená data'},
    {left:'e-Sbírka', right:'aktuální znění předpisů, např. NV č. 361/2007 Sb. s hodnotami PEL a NPK-P'},
    {left:'TIS', right:'nepřetržitá telefonní konzultační služba pro akutní otravy v ČR'},
    {left:'PubChem', right:'volně dostupná databáze NIH/NCBI se strukturou, vlastnostmi a souhrny toxicity látek'},
    {left:'GESTIS', right:'databáze nebezpečných látek a mezinárodních expozičních limitů na pracovišti (IFA, Německo)'},
    {left:'ECHA CHEM', right:'databáze chemických látek v EU, klasifikace a registrační údaje dle REACH/CLP'}
  ];
  const leftItems = pairs.map((p,i)=>({text:p.left, idx:i}));
  const rightItems = pairs.map((p,i)=>({text:p.right, idx:i}));
  for(let i=rightItems.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [rightItems[i],rightItems[j]]=[rightItems[j],rightItems[i]]; }

  const leftEl = document.getElementById('match-left');
  const rightEl = document.getElementById('match-right');
  let selectedLeft = null;
  let solved = 0;

  leftItems.forEach(item=>{
    const div = document.createElement('div');
    div.className='match-item';
    div.textContent = item.text;
    div.dataset.idx = item.idx;
    div.onclick = ()=>{
      if(div.classList.contains('correct')) return;
      leftEl.querySelectorAll('.match-item').forEach(x=>x.classList.remove('selected'));
      div.classList.add('selected');
      selectedLeft = div;
    };
    leftEl.appendChild(div);
  });
  rightItems.forEach(item=>{
    const div = document.createElement('div');
    div.className='match-item';
    div.textContent = item.text;
    div.dataset.idx = item.idx;
    div.onclick = ()=>{
      if(!selectedLeft || div.classList.contains('correct')) return;
      const isMatch = selectedLeft.dataset.idx === div.dataset.idx;
      if(isMatch){
        selectedLeft.classList.remove('selected'); selectedLeft.classList.add('correct');
        div.classList.add('correct');
        solved++;
        selectedLeft = null;
        if(solved===pairs.length){
          document.getElementById('match-result').textContent = 'Výborně — všechny zdroje jsou správně přiřazeny!';
        }
      } else {
        div.classList.add('wrong');
        setTimeout(()=>div.classList.remove('wrong'), 500);
      }
    };
    rightEl.appendChild(div);
  });
}

render();
</script>
