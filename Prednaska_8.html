<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neurotoxicita, mutagenita a karcinogenita — Přednáška 8</title>
<style>
  :root{
    --paper:#F4F5EF;
    --ink:#1E2019;
    --ink-soft:#5A5D51;
    --amber:#B9791E;
    --amber-deep:#8F5D14;
    --tox-green:#3E5C42;
    --tox-green-deep:#2A3F2D;
    --danger:#9C3B2E;
    --blue:#3A5A72;
    --blue-deep:#233C4E;
    --violet:#6A55A8;
    --line:#D6D6C6;
    --card:#FFFFFE;
    --serif: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', serif;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    --mono: 'SF Mono', SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{ margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans); overflow:hidden; font-size:20px; }
  ::selection{ background: var(--amber); color:#fff; }

  #topbar{ position:fixed; top:0; left:0; right:0; height:54px; display:flex; align-items:center; gap:16px; padding:0 20px; z-index:50;
    background:linear-gradient(to bottom, rgba(244,245,239,0.97), rgba(244,245,239,0.85)); border-bottom:1px solid var(--line); }
  #topbar .brand{ font-family:var(--serif); font-size:18px; font-style:italic; color:var(--ink-soft); white-space:nowrap; }
  #progress-track{ flex:1; height:3px; background:var(--line); border-radius:2px; overflow:hidden; }
  #progress-fill{ height:100%; width:0%; background:var(--amber); transition:width .35s ease; }
  #counter{ font-family:var(--mono); font-size:16px; color:var(--ink-soft); white-space:nowrap; }
  #menu-btn{ font-family:var(--sans); font-size:16px; color:var(--ink); background:var(--card); border:1px solid var(--line); border-radius:6px; padding:6px 12px; cursor:pointer; }
  #menu-btn:hover{ border-color:var(--amber); }

  #deck{ position:relative; width:100%; height:100%; padding-top:54px; }
  .slide{ position:absolute; inset:0; top:54px; display:flex; align-items:center; justify-content:center;
    padding:30px 6vw 90px 6vw; opacity:0; visibility:hidden; transform:translateY(14px);
    transition:opacity .4s ease, transform .4s ease; overflow-y:auto; }
  .slide.active{ opacity:1; visibility:visible; transform:translateY(0); }
  .slide-inner{ width:100%; max-width:1180px; }
  .eyebrow{ font-family:var(--mono); font-size:18px; letter-spacing:.02em; color:var(--amber-deep); margin:0 0 10px 0; }
  h1.headline{ font-family:var(--serif); font-weight:400; font-size:clamp(30px,4.6vw,50px); line-height:1.1; margin:0 0 16px 0; }
  h2.headline{ font-family:var(--serif); font-weight:400; font-size:clamp(24px,3.2vw,34px); line-height:1.18; margin:0 0 16px 0; }
  p.lede{ font-size:22px; line-height:1.55; color:var(--ink-soft); max-width:760px; }
  .body-text{ font-size:21px; line-height:1.6; color:var(--ink); }
  .grid-2{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .grid-3{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
  @media (max-width:860px){ .grid-2,.grid-3{ grid-template-columns:1fr; } }
  ul.plain{ margin:0; padding-left:22px; font-size:20px; }
  ul.plain li{ margin-bottom:8px; line-height:1.5; }
  .mt{ margin-top:14px; }

  /* ---------- barevná pole ---------- */
  .box{ border-radius:12px; padding:14px 18px; border:1px solid; border-left-width:6px; font-size:20px; line-height:1.5; }
  .box p{ margin:0; }
  .box p + p{ margin-top:6px; }
  .box ul.plain{ font-size:20px; }
  .box-title{ font-family:var(--mono); font-size:16px; letter-spacing:.06em; text-transform:uppercase; margin-bottom:6px; font-weight:600; }
  .box .big{ font-family:var(--serif); font-size:26px; margin-bottom:4px; display:block; }
  .box.blue{ background:#EAF2F8; border-color:#C3D6E4; border-left-color:var(--blue); }   .box.blue .box-title{ color:var(--blue-deep); }
  .box.green{ background:#EAF4EC; border-color:#C5DCC9; border-left-color:var(--tox-green); } .box.green .box-title{ color:var(--tox-green-deep); }
  .box.amber{ background:#FDF3E1; border-color:#EBD3A8; border-left-color:var(--amber); } .box.amber .box-title{ color:var(--amber-deep); }
  .box.red{ background:#FBECE9; border-color:#E8C4BD; border-left-color:var(--danger); }   .box.red .box-title{ color:var(--danger); }
  .box.violet{ background:#F1EDF9; border-color:#D5CBEB; border-left-color:var(--violet); } .box.violet .box-title{ color:var(--violet); }
  .box.grey{ background:#FFFFFE; border-color:var(--line); border-left-color:#9A9C8E; } .box.grey .box-title{ color:var(--ink-soft); }

  /* zkratky */
  .abbr{ margin-top:16px; padding:10px 14px; background:#F0F1EA; border:1px dashed #BFC1B2; border-radius:10px; font-size:18px; line-height:1.55; color:var(--ink-soft); }
  .abbr b{ color:var(--ink); font-family:var(--mono); font-size:17px; }
  .abbr .lbl{ font-family:var(--mono); font-size:15px; letter-spacing:.06em; color:var(--amber-deep); margin-right:6px; }

  /* tok / řetězec */
  .flow{ display:flex; align-items:stretch; gap:8px; margin-top:12px; }
  .flow .step{ flex:1; border-radius:12px; padding:12px 10px; border:2px solid; text-align:center; font-size:19px; line-height:1.4; display:flex; flex-direction:column; justify-content:center; }
  .flow .step b{ display:block; font-size:21px; margin-bottom:4px; }
  .flow .arr{ align-self:center; font-size:26px; color:#8A8C7E; flex:0 0 18px; text-align:center; }
  .mechanism-number{ display:inline-flex; align-items:center; justify-content:center; width:24px; height:24px; flex:0 0 24px; margin-right:6px; border-radius:50%; background:var(--ink); color:#fff; font-family:var(--mono); font-size:14px; font-weight:700; line-height:1; vertical-align:middle; }
  .s-red{ background:#FBECE9; border-color:#D9897B; } .s-blue{ background:#EAF2F8; border-color:#7FA3BF; }
  .s-green{ background:#EAF4EC; border-color:#86AE8D; } .s-violet{ background:#F1EDF9; border-color:#A797D2; }
  .s-amber{ background:#FDF3E1; border-color:#D9AE62; }
  @media (max-width:860px){ .flow{ flex-direction:column; } .flow .arr{ transform:rotate(90deg); } }
  .under{ display:flex; gap:8px; margin-top:8px; }
  .under div{ flex:1; text-align:center; font-size:18px; color:var(--ink-soft); line-height:1.35; }
  .under .gap{ flex:0 0 18px; }

  /* časová osa */
  .tline{ display:grid; gap:8px; margin-top:8px; }
  .tline .ev{ display:grid; grid-template-columns:96px 1fr; gap:14px; align-items:center; }
  .tline .yr{ font-family:var(--mono); font-size:18px; font-weight:700; color:#fff; border-radius:8px; padding:7px 0; text-align:center; }
  .tline .tx{ font-size:20px; line-height:1.4; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:7px 12px; }
  .y-vivo{ background:#C4673A; } .y-vitro{ background:#3E8A5E; } .y-silico{ background:#6A55A8; } .y-reg{ background:#3A6FA0; }
  .legend{ display:flex; gap:16px; flex-wrap:wrap; font-size:18px; color:var(--ink-soft); margin-top:12px; }
  .legend span::before{ content:''; display:inline-block; width:12px; height:12px; border-radius:3px; margin-right:6px; vertical-align:-1px; background:var(--c); }

  /* sloupcový graf */
  .bars{ margin-top:10px; }
  .bar-row{ display:grid; grid-template-columns:260px 1fr 80px; gap:12px; align-items:center; margin-bottom:10px; font-size:20px; }
  .bar-track{ background:#E7E8DF; border-radius:6px; height:32px; overflow:hidden; }
  .bar-fill{ height:100%; border-radius:6px; }
  .bar-val{ font-family:var(--mono); font-weight:700; font-size:19px; text-align:right; }

  /* pyramida */
  .pyr{ display:flex; flex-direction:column; align-items:center; gap:6px; margin-top:6px; }
  .pyr div{ border-radius:10px; padding:10px 14px; text-align:center; font-size:19px; line-height:1.35; border:2px solid; }
  .pyr b{ display:block; font-size:20px; }

  /* délka testů */
  .dur-row{ display:grid; grid-template-columns:200px 1fr; gap:12px; align-items:center; margin-bottom:9px; font-size:20px; }
  .dur-bar{ height:32px; border-radius:6px; color:#fff; font-size:18px; display:flex; align-items:center; padding:0 10px; white-space:nowrap; font-weight:600; }

  #navbtns{ position:fixed; bottom:22px; right:28px; display:flex; gap:10px; z-index:50; }
  .navbtn{ width:46px; height:46px; border-radius:50%; border:1px solid var(--line); background:var(--card); color:var(--ink); font-size:19px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .navbtn:hover{ border-color:var(--amber); color:var(--amber-deep); }
  .navbtn:disabled{ opacity:.3; cursor:default; }
  #overlay{ position:fixed; inset:0; background:rgba(30,32,25,.94); z-index:100; display:none; padding:56px 8vw; overflow-y:auto; }
  #overlay.show{ display:block; }
  #overlay h3{ font-family:var(--serif); color:#fff; font-weight:400; font-size:23px; margin-bottom:20px; }
  #overlay-list{ list-style:none; margin:0; padding:0; columns:2; column-gap:40px; }
  @media (max-width:800px){ #overlay-list{ columns:1; } }
  #overlay-list li{ color:#EDEEE6; font-size:18px; padding:9px 0; border-bottom:1px solid rgba(255,255,255,.12); cursor:pointer; break-inside:avoid; }
  #overlay-list li span{ font-family:var(--mono); color:var(--amber); margin-right:10px; font-size:13px; }
  #overlay-list li:hover{ color:var(--amber); }
  #overlay-close{ position:absolute; top:22px; right:30px; color:#fff; font-size:28px; background:none; border:none; cursor:pointer; }

  /* poznámky vyučujícího (klávesa N; obsah jen z lokálního souboru Lektor_poznamky_P8.js) */
  #notes{ position:fixed; left:0; right:0; bottom:0; max-height:42vh; overflow-y:auto; background:#1E2019; color:#EDEEE6; z-index:200;
    padding:16px 6vw 20px 6vw; font-size:16px; line-height:1.55; display:none; border-top:3px solid var(--amber); }
  #notes.show{ display:block; }
  #notes .nh{ font-family:var(--mono); font-size:12.5px; color:var(--amber); letter-spacing:.05em; margin-bottom:6px; }
  #notes ul{ margin:4px 0 0 0; padding-left:20px; } #notes li{ margin-bottom:4px; }
  #notes b{ color:#F3D9A8; }

  .quiz-card{ background:var(--card); border:1px solid var(--line); border-left:6px solid var(--blue); border-radius:12px; padding:20px 24px; margin-top:10px; }
  .quiz-q{ font-size:22px; font-weight:600; margin-bottom:14px; line-height:1.45; }
  .quiz-opt{ display:block; width:100%; text-align:left; padding:12px 16px; margin-bottom:9px; border:1px solid var(--line); border-radius:8px; background:#fff; cursor:pointer; font-size:20px; font-family:var(--sans); color:var(--ink); }
  .quiz-opt:hover{ border-color:var(--amber); }
  .quiz-opt.correct{ border-color:var(--tox-green); background:#EAF1EA; color:var(--tox-green-deep); font-weight:600; }
  .quiz-opt.wrong{ border-color:var(--danger); background:#F7EAE7; color:var(--danger); }
  .quiz-opt[disabled]{ cursor:default; }
  .quiz-feedback{ margin-top:12px; font-size:20px; line-height:1.55; color:var(--ink-soft); display:none; }
  .quiz-feedback.show{ display:block; }

  table.data-table{ width:100%; border-collapse:collapse; font-size:20px; margin-top:10px; background:var(--card); border-radius:10px; overflow:hidden; }
  table.data-table th{ text-align:left; font-family:var(--mono); font-size:18px; color:#fff; background:var(--blue); padding:9px 12px; }
  table.data-table td{ padding:9px 12px; border-bottom:1px solid var(--line); }
  table.data-table td.num, table.data-table th.num{ text-align:right; font-variant-numeric:tabular-nums; }
  table.data-table tr.c1 td:first-child{ border-left:6px solid #D9897B; }
  table.data-table tr.c2 td:first-child{ border-left:6px solid #D9AE62; }
  table.data-table tr.c3 td:first-child{ border-left:6px solid #86AE8D; }
  table.data-table tr.c4 td:first-child{ border-left:6px solid #7FA3BF; }

  .tl-item{ background:var(--card); border:1px solid var(--line); border-left:6px solid var(--violet); border-radius:10px; padding:14px 16px; cursor:pointer; }
  .tl-item .tl-year{ font-family:var(--mono); font-size:17px; color:var(--violet); }
  .tl-item .tl-title{ font-family:var(--serif); font-size:22px; margin:4px 0 6px 0; }
  .tl-item .tl-detail{ font-size:20px; color:var(--ink-soft); line-height:1.5; display:none; }
  .tl-item.open .tl-detail{ display:block; }

  .footer-note{ margin-top:16px; font-size:19px; color:var(--ink-soft); font-family:var(--mono); line-height:1.5; }
  .sources{ font-size:16px; color:var(--ink-soft); line-height:1.45; column-count:2; column-gap:26px; background:#fff; border:1px solid var(--line); border-radius:10px; padding:14px 18px; }
  .sources p{ margin:0 0 4px 0; break-inside:avoid; }
  .sources h4{ font-family:var(--mono); font-size:16px; color:var(--amber-deep); margin:6px 0 4px 0; letter-spacing:.05em; }

  .diagram-box{ background:#fff; border:1px solid var(--line); border-radius:12px; padding:12px; }
  .diagram-box svg{ cursor:zoom-in; display:block; width:100%; height:auto; }
  .scheme-img{ width:100%; max-width:720px; display:block; margin:0 auto; border:1px solid var(--line); border-radius:8px; background:#fff; cursor:zoom-in; }
  .scheme-img.tiny{ max-width:300px; }
  .portrait{ max-height:290px; width:auto; max-width:100%; }
  figure.fig{ margin:0; }
  figure.fig figcaption{ font-size:18px; color:var(--ink-soft); text-align:center; margin-top:6px; line-height:1.45; }

  #lightbox{ position:fixed; inset:0; background:rgba(15,16,12,.95); z-index:300; display:none; align-items:center; justify-content:center; padding:4vh 4vw; cursor:zoom-out; }
  #lightbox.show{ display:flex; }
  #lightbox-inner{ max-width:100%; max-height:100%; cursor:default; }
  #lightbox-inner img{ display:block; max-width:92vw; max-height:92vh; border-radius:10px; background:#fff; }
  #lightbox-inner svg{ display:block; width:92vw; height:auto; max-height:92vh; background:#fff; border-radius:10px; padding:28px; }
  #lightbox-hint{ position:absolute; bottom:22px; left:50%; transform:translateX(-50%); color:#B9B9A8; font-family:var(--mono); font-size:16px; }

  .match-wrap{ display:grid; grid-template-columns:1fr 1fr; gap:24px; margin-top:14px; }
  @media (max-width:760px){ .match-wrap{ grid-template-columns:1fr; } }
  .match-col-title{ font-family:var(--mono); font-size:16px; color:var(--ink-soft); margin-bottom:8px; }
  .match-item{ background:var(--card); border:1px solid var(--line); border-radius:8px; padding:11px 14px; margin-bottom:8px; font-size:20px; cursor:pointer; }
  .match-item.selected{ border-color:var(--amber); background:#FBF0DD; }
  .match-item.correct{ border-color:var(--tox-green); background:#EAF1EA; }
  .match-item.wrong{ border-color:var(--danger); background:#F7EAE7; }
  .match-result{ margin-top:12px; font-size:20px; color:var(--tox-green-deep); min-height:24px; font-weight:600; }

  .sort-row{ display:grid; grid-template-columns:1fr auto; gap:12px; align-items:center; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:10px 14px; margin-bottom:8px; font-size:20px; }
  .sort-row.correct{ border-color:var(--tox-green); background:#EAF1EA; }
  .sort-btns{ display:flex; gap:6px; }
  .sort-btn{ font-family:var(--sans); font-size:18px; padding:6px 10px; border:1px solid var(--line); border-radius:6px; background:#fff; cursor:pointer; color:var(--ink); }
  .sort-btn:hover{ border-color:var(--amber); }
  .sort-btn.wrong{ border-color:var(--danger); background:#F7EAE7; color:var(--danger); }
  .sort-btn.right{ border-color:var(--tox-green); background:var(--tox-green); color:#fff; }
  .sort-why{ grid-column:1 / -1; font-size:18px; color:var(--ink-soft); display:none; }
  .sort-row.correct .sort-why{ display:block; }

  .task-box{ background:var(--card); border:1px solid var(--line); border-left:6px solid var(--amber); border-radius:12px; padding:16px 20px; margin-top:12px; }
  .task-box ol{ margin:0; padding-left:24px; font-size:20px; }
  .task-box ol li{ margin-bottom:8px; line-height:1.5; }
  .sol-box{ background:#EAF4EC; border:1px solid #C5DCC9; border-left:6px solid var(--tox-green); border-radius:12px; padding:14px 20px; margin-top:12px; }
  .calc-step{ font-family:var(--mono); font-size:20px; line-height:1.9; color:var(--ink); }
  .calc-step .res{ color:var(--tox-green-deep); font-weight:700; }
  .calc-step .bad{ color:var(--danger); font-weight:700; }
  .sol-label{ font-family:var(--mono); font-size:16px; color:var(--tox-green-deep); letter-spacing:.05em; margin-bottom:6px; font-weight:600; }
  .hint{ font-size:18px; color:var(--ink-soft); margin-top:10px; line-height:1.5; }

  /* štítky CNS / PNS */
  .chip{ display:inline-block; font-family:var(--mono); font-size:18px; font-weight:700; padding:1px 11px; border-radius:999px; margin-left:12px; vertical-align:1px; color:#fff; letter-spacing:.02em; }
  .chip.cns{ background:#3A6FA0; } .chip.pns{ background:#3E8A5E; } .chip.both{ background:#6A55A8; }
  td .chip, .box-title .chip{ margin-left:0; margin-right:6px; }
  .box-title .chip{ font-size:16px; }

  @media (prefers-reduced-motion: reduce){ .slide, .navbtn, #progress-fill{ transition:none !important; } }
</style>
</head>
<body>

<div id="topbar">
  <div class="brand">Neurotoxicita, mutagenita a karcinogenita · Přednáška 8</div>
  <div id="progress-track"><div id="progress-fill"></div></div>
  <div id="counter">1 / 1</div>
  <button id="menu-btn" onclick="toggleOverlay(true)">Obsah</button>
</div>

<div id="deck"></div>

<div id="navbtns">
  <button class="navbtn" id="prevBtn" onclick="prevSlide()">←</button>
  <button class="navbtn" id="nextBtn" onclick="nextSlide()">→</button>
</div>

<div id="lightbox" onclick="closeLightbox()">
  <div id="lightbox-inner" onclick="event.stopPropagation()"></div>
  <div id="lightbox-hint">klikněte mimo obrázek nebo stiskněte Esc pro zavření</div>
</div>

<div id="overlay">
  <button id="overlay-close" onclick="toggleOverlay(false)">×</button>
  <h3>Přeskočit na</h3>
  <ul id="overlay-list"></ul>
</div>

<div id="notes"></div>

<script>
const slides = [];
function slide(id, title, html){ slides.push({id, title, html}); }

function keepTextTogether(root){
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes = [];
  while(walker.nextNode()) nodes.push(walker.currentNode);

  nodes.forEach(node=>{
    node.nodeValue = node.nodeValue
      .replace(/(^|[^\p{L}\p{N}])([KkSsVvZzUuIiAaOo])\s+(?=\p{L})/gu, '$1$2\u00A0')
      .replace(/(\d[\d.,]*)[ \t]+(?=(?:%|µg|μg|mg|kg|ng|g|mL|ml|L|l|km|cm|mm|m|mmol|mol|min|h|s)(?![\p{L}\p{N}]))/gu, '$1\u00A0');
  });

  for(let i=0;i<nodes.length-1;i++){
    const current = nodes[i], next = nodes[i+1];
    const blockSelector = 'p,li,td,th,figcaption,.box,.abbr,.task-box,.sol-box,.sources,.footer-note,.body-text,.lede,.flow .step';
    const block = current.parentElement?.closest(blockSelector);
    if(!block || block !== next.parentElement?.closest(blockSelector)) continue;
    if(/^[\p{L}]/u.test(next.nodeValue) && /(^|[^\p{L}\p{N}])([KkSsVvZzUuIiAaOo])\s+$/u.test(current.nodeValue)){
      current.nodeValue = current.nodeValue.replace(/\s+$/u, '\u00A0');
    }
    if(/(\d[\d.,]*)[ \t]+$/u.test(current.nodeValue) && /^(?:%|µg|μg|mg|kg|ng|g|mL|ml|L|l|km|cm|mm|m|mmol|mol|min|h|s)(?![\p{L}\p{N}])/u.test(next.nodeValue)){
      current.nodeValue = current.nodeValue.replace(/[ \t]+$/u, '\u00A0');
    }
  }
}

/* =====================================================================
   0 · ÚVOD (≈ 4 min)
   ===================================================================== */
slide('title','Titulní strana', `
  <div class="slide-inner">
    <p class="eyebrow">Ing. Pavla Fojtíková, Ph.D. · Přírodovědecká fakulta JU</p>
    <h1 class="headline">Neurotoxicita, mutagenita a karcinogenita</h1>
    <p class="lede">Přednáška 8: mechanismy poškození nervové soustavy, inhibitory acetylcholinesterázy jako případová studie, vícestupňový proces karcinogeneze a kvantifikace bezprahového rizika.</p>
    <p class="footer-note">Laboratoř analytické a environmentální chemie</p>
  </div>
`);

slide('outline','Osnova', `
  <div class="slide-inner">
    <p class="eyebrow">Obsah přednášky</p>
    <h2 class="headline">Dvě velké části, šest tematických celků</h2>
    <div class="grid-3">

  </div>
`);

    <p class="body-text">Zhoubný nádor je geneticky podmíněná porucha regulace buněčného dělení a růstu. Přeměna normální buňky na nádorovou je podmíněna <strong>změnami v genetické informaci a v její expresi</strong>, nikoli jediným dějem: vzniká postupným hromaděním změn v průběhu let až desetiletí.</p>
    <div class="grid-2 mt">
      <div class="box blue"><div class="box-title">Historické vodítko: povolání</div><p>Souvislost mezi nádory a chemickou expozicí byla poprvé rozpoznána na základě povolání. Percivall Pott popsal roku 1775 nádory šourku u kominíků, později byly popsány nádory močového měchýře u dělníků v barvářském průmyslu a nádory plic u horníků. Profesní expozice je zpravidla vyšší a lépe ohraničená než expozice obecné populace, proto se karcinogeny často odhalí nejdříve zde.</p></div>
      <div class="box red"><div class="box-title">Chemický princip</div><p>Většina chemických karcinogenů jsou <strong>elektrofilní</strong> látky nebo jejich metabolity. Vážou se na <strong>nukleofilní centra v bázích nukleových kyselin</strong> (zejména N7 a O6 guaninu) za vzniku <strong>aduktů DNA</strong>. Neopravený adukt se při replikaci stává zdrojem mutace.</p></div>
    </div>

    <div class="abbr"><span class="lbl">POJMY</span><b>elektrofil</b> = částice s nedostatkem elektronů, vyhledávající centra s jejich přebytkem · <b>adukt DNA</b> = produkt kovalentní vazby cizorodé molekuly na bázi DNA</div>
  </div>
`);

  </div>
`);

slide('oprava','Opravné mechanismy', `
  <div class="slide-inner">
    <p class="eyebrow">5 · Karcinogeneze · obrana buňky</p>
    <h2 class="headline">Proč nás tisíce lézí denně nezabijí</h2>
    <div class="grid-2">
      <div class="box green"><div class="box-title">Rozsah dějů</div><p>V buňkách vznikají průběžně četná poškození DNA, převážně endogenního původu: spontánní chemické změny, reaktivní formy kyslíku při buněčném metabolismu a další látky vznikající v organismu.</p><p>Většinu lézí buňka opraví. Jen část přetrvá a při replikaci se může zafixovat jako mutace; četnost závisí na typu buňky, jejím dělení a účinnosti opravných systémů.</p><p>Mutace jsou přirozeným zdrojem genetické variability, ale pro jednotlivou buňku mohou mít závažné následky.</p></div>
      <div class="box blue"><div class="box-title">Tři úrovně obrany</div><p><strong>1 · Oprava DNA</strong> – excizní reparace báze nebo nukleotidu, oprava chybného párování, oprava dvouvláknových zlomů.</p><p><strong>2 · Kontrolní body a apoptóza</strong> – bílkovina <strong>p53</strong>, kódovaná tumor supresorovým genem <em>TP53</em>, zastaví buněčný cyklus do doby opravy a při rozsáhlém poškození spustí řízenou buněčnou smrt.</p><p><strong>3 · Imunitní dohled</strong> – iniciovaná buňka může být rozpoznána a eliminována imunitním systémem.</p></div>
    </div>
    <div class="box red mt"><div class="box-title">Kde se obrana láme</div><p>Nejnebezpečnější jsou mutace v genech, které <strong>řídí samotnou obranu</strong>. Mutace <em>TP53</em> je přítomna ve více než polovině lidských nádorů; buňka tím ztrácí schopnost zastavit cyklus i spustit apoptózu, a hromadění dalších mutací se zrychluje. Připomeňme konkrétní příklad z přednášky 7: aflatoxin B1 vyvolává charakteristickou mutaci v <strong>kodonu 249</strong> genu <em>TP53</em>.</p></div>
    <div class="abbr"><span class="lbl">POJMY</span><b>apoptóza</b> = programovaná buněčná smrt · <b>tumor supresorový gen</b> = gen, jehož produkt brzdí dělení buňky; jeho ztráta funkce dělení uvolňuje · <b>excizní reparace</b> = vyříznutí poškozeného úseku a jeho dosyntetizování podle druhého vlákna</div>
  </div>
`);

slide('promoce','Promoce', `
  <div class="slide-inner">
    <p class="eyebrow">5 · Karcinogeneze · fáze 2</p>
    <h2 class="headline">Promoce: růst již iniciované buňky</h2>
    <div class="grid-2">
      <div class="box amber"><div class="box-title">Co se při promoci děje</div><p><strong>Promotor podporuje množení již iniciovaných buněk</strong>, například tím, že urychluje dělení nebo omezuje signály, které je brzdí. Sám nemusí působit mutagenně.</p><p><strong>Příklady:</strong> některé růstové faktory a hormony; z vnějších látek například DDT, TCDD nebo forbolestery.</p></div>
      <div class="box blue"><div class="box-title">Nepřímá promoce</div><p>Cytotoxická látka může usmrtit část buněk cílové tkáně. Následná regenerace zvýší počet dělení přeživších buněk, a tím i příležitost k růstu již iniciovaných buněk.</p><p>Proto může dlouhodobé poškozování a obnova tkáně přispívat ke karcinogenezi, i když látka přímo nepoškozuje DNA.</p></div>
    </div>
    <div class="box green mt"><div class="box-title">Proč je promoce důležitá pro prevenci</div><p>V klasickém pokusu na zvířatech vyvolá iniciátor následovaný opakovaným působením promotoru nádory; samotný promotor ani opačné pořadí tento účinek obvykle nevyvolá. Ukončení působení promotoru může proto zpomalit či zastavit rozvoj iniciované tkáně.</p></div>
  </div>
`);

slide('progrese','Progrese', `
  <div class="slide-inner">
    <p class="eyebrow">5 · Karcinogeneze · fáze 3</p>
    <h2 class="headline">Progrese: nádor získává další vlastnosti</h2>
    <div class="grid-2">
      <div class="box red"><div class="box-title">Co se mění</div><p>V průběhu progrese se v nádorové populaci hromadí další genetické a epigenetické změny. Buňky se mohou stát méně závislými na běžných růstových signálech, rychleji se množit a získávat schopnost prorůstat do okolní tkáně.</p></div>
      <div class="box amber"><div class="box-title">Proč je průběh různý</div><p>Nádorové buňky se vyvíjejí a selektují v čase; rychlost i konkrétní vlastnosti progrese se liší podle typu nádoru, tkáně a dalších faktorů. Nejde o jediný univerzální sled změn.</p></div>
    </div>
    <div class="box blue mt"><p>Progrese obvykle činí nádor biologicky agresivnějším a léčbu obtížnější. <strong>Metastazování</strong> může následovat po získání schopnosti šířit se do vzdálených tkání; nejde však o samostatnou čtvrtou fázi klasického modelu iniciace–promoce–progrese.</p></div>
  </div>
`);

slide('mutagen-karcinogen','Mutagenita a karcinogenita', `
  <div class="slide-inner">
    <p class="eyebrow">5 · Karcinogeneze · vztah pojmů</p>
    <h2 class="headline">Mutagenita a karcinogenita nejsou totéž</h2>
    <div class="grid-2">
      <div class="box blue"><div class="box-title">Co z čeho plyne</div><p>Mutace jsou podstatné ve stadiu iniciace a progrese. Z toho plyne předpoklad, že <strong>mutagenní látka má karcinogenní potenciál</strong>.</p><p>Samotná iniciace však k rozvoji nádoru <strong>nestačí</strong>: bez promoce a progrese zůstane iniciovaná buňka bez klinického následku.</p><p>A obráceně: mutagenita <strong>není nutnou podmínkou</strong> karcinogenity, protože existují i negenotoxické mechanismy.</p></div>
      <div class="box green"><div class="box-title">Praktický rozdíl v měřitelnosti</div><p>Mutagenitu lze <strong>snadno, rychle a kvantitativně</strong> měřit a srovnávat: Amesův test a další testy in vitro (přednáška 6) poskytnou výsledek v řádu dnů.</p><p>Karcinogenitu lze přímo prokázat pouze dvouletou studií na hlodavcích nebo epidemiologicky, tedy s odstupem desetiletí.</p><p><strong>Proto se mutagenita používá jako prediktor karcinogenity</strong> – se všemi omezeními, která z nedokonalé shody obou vlastností plynou.</p></div>
    </div>
    <div class="box amber mt"><p>Vztah mezi oběma vlastnostmi je tedy silný, ale nikoli jednoznačný. Pozitivní Amesův test je důvodem k podezření a k dalšímu testování, nikoli důkazem karcinogenity; negativní výsledek karcinogenitu nevylučuje, protože negenotoxické mechanismy tímto testem neodhalíme.</p></div>
  </div>
`);

slide('dve-skupiny','Genotoxické a negenotoxické', `
  <div class="slide-inner">
    <p class="eyebrow">5 · Karcinogeneze · dva základní typy účinku</p>
    <h2 class="headline">Rozdělení, které rozhoduje o způsobu regulace</h2>
    <div class="grid-2">
      <div class="box red"><div class="box-title">Genotoxické (mutagenní) karcinogeny</div><p>Poškozují genetický materiál. Teoreticky může nádor iniciovat <strong>jediná neopravená mutace v kritickém genu</strong>, a proto <strong>nelze spolehlivě stanovit práh účinku</strong>.</p><p><strong>Příklady:</strong> benzo[a]pyren, aflatoxin B1, vinylchlorid, nitrosaminy, ethylenoxid, ionizující záření.</p><p><strong>Regulace:</strong> expozice se snižuje na nejnižší rozumně dosažitelnou úroveň. Místo bezpečné dávky se kvantifikuje <strong>pravděpodobnost</strong> nádoru při dané expozici.</p></div>
      <div class="box green"><div class="box-title">Negenotoxické (někdy „epigenetické“) karcinogeny</div><p>Nezpůsobují primární poškození DNA; mohou působit například podporou množení iniciovaných buněk, hormonálními účinky nebo dlouhodobým poškozením tkáně. Pro řadu těchto mechanismů se předpokládá <strong>prahová dávková závislost</strong>, nelze ji však automaticky přisoudit každé látce.</p><p><strong>Příklady:</strong> fenobarbital, polychlorované dibenzo-<em>p</em>-dioxiny, DDT a některé hormonálně aktivní látky.</p><p><strong>Regulace:</strong> pokud data podporují existenci prahu, lze odvodit referenční hodnotu (např. ADI nebo TDI) s použitím faktorů nejistoty.</p></div>
    </div>
    <div class="box blue mt"><div class="box-title">Návaznost na přednášku 7</div><p>Právě zde se uplatní rozdíl mezi <strong>prahovou a bezprahovou závislostí dávka–odpověď</strong>. Rozhodnutí, do které skupiny látku zařadit, není formalitou: určuje, zda pro ni vůbec lze stanovit zdravotně bezpečnou dávku. U části látek je zařazení předmětem odborného sporu, protože mechanismus není dostatečně objasněn.</p></div>
  </div>
`);

slide('alkylacni','Alkylační činidla', `
  <div class="slide-inner">
    <p class="eyebrow">5 · Karcinogeneze · skupina 1</p>
    <h2 class="headline">Alkylační činidla, aktivované olefiny a oxirany</h2>
    <div class="grid-2">
      <div class="box red"><div class="box-title">Alkylační činidla</div><p><strong>Jednoduchá</strong> (dimethylsulfát, methyljodid, diazomethan) alkylují DNA neselektivně.</p><p><strong>Bifunkční</strong> činidla nesou dvě reaktivní skupiny a vytvářejí <strong>křížové vazby</strong>: bis(chlormethyl)ether, yperit čili bis(2-chlorethyl)sulfid, dusíkaté yperity.</p><p>Právě tato mimořádná biologická aktivita vedla k <strong>využití odvozených látek v protinádorové léčbě</strong>: cytostatikum zasáhne nejsilněji buňky, které se nejrychleji dělí. Jde o dobře doloženou ukázku toho, že táž vlastnost může být jedem i lékem.</p></div>
      <div class="box amber"><div class="box-title">Olefiny a oxirany</div><p>Alkeny se substituentem na koncové dvojné vazbě (halogen, karbonyl, ester, amid, nitril) se vážou na nukleofilní centra buď přímo, nebo <strong>po metabolické aktivaci cytochromem P450 na epoxid</strong>, tedy derivát oxiranu.</p><p><strong>Vinylchlorid</strong> – prokázaný lidský karcinogen; vyvolává vzácný <strong>hemangiosarkom jater</strong>. Jeho objev u dělníků v polymeraci PVC v 70. letech vedl k radikálnímu zpřísnění limitů.</p><p><strong>Akrylamid</strong> – neurotoxický, toxický pro reprodukci, podezřelý lidský karcinogen; vzniká <strong>při tepelné úpravě škrobnatých potravin</strong> nad 120 °C.</p><p><strong>Akrylonitril</strong> – podezřelý lidský karcinogen.</p></div>
    </div>
    <div class="box blue mt"><p><strong>Společný rys skupiny:</strong> reaktivita vůči nukleofilům není vůči DNA nijak specifická. Tytéž látky alkylují i bílkoviny, což se využívá analyticky: <strong>adukty s hemoglobinem</strong> slouží jako biomarkery expozice s dobou výpovědi odpovídající životnosti erytrocytu, tedy asi 120 dnů (přednáška 5).</p></div>
  </div>
`);

slide('arylaminy','Arylaminy a nitroareny', `
  <div class="slide-inner">
    <p class="eyebrow">5 · Karcinogeneze · skupiny 3 a 4</p>
    <h2 class="headline">Arylaminy a nitroareny: společný konečný metabolit</h2>
    <div class="grid-2">
      <div class="box violet"><div class="box-title">Arylaminy a heteroarylaminy</div><p>Aromatické aminy procházejí rozvětvenou sítí biotransformačních cest: N-oxidací, N-acetylací, glukuronidací a sulfatací. Jedna z nich vede přes N-hydroxyderivát a jeho ester ke <strong>arylnitreniovému iontu</strong>, elektrofilní částici tvořící adukty s DNA.</p><p><strong>Cílovým orgánem je typicky močový měchýř.</strong> N-glukuronid vzniklý v játrech je vyloučen do moči, v jejím kyselém prostředí se rozpadá zpět a výsledná reaktivní částice působí přímo na urotel, kde moč stojí. Jde o mimořádně názornou ukázku toho, že cílový orgán určuje <strong>místo uvolnění reaktivního metabolitu</strong>, nikoli místo jeho vzniku.</p><p><strong>Příklady:</strong> benzidin, 2-naftylamin, 4-aminobifenyl (barvářský průmysl, cigaretový kouř), heterocyklické aminy vznikající při smažení masa.</p></div>
      <div class="box amber"><div class="box-title">Nitroareny</div><p>Aromatické nitrolátky ze <strong>výfukových plynů vznětových motorů</strong>, cigaretového kouře, spalovacích procesů a grilování.</p><p>Jsou netěkavé a <strong>adsorbují se na povrch prachových částic</strong>, s nimiž se dostávají až do alveolární oblasti (přednáška 7).</p><p>Metabolická aktivace probíhá <strong>redukcí</strong> nitroskupiny (na rozdíl od oxidace u arylaminů), výsledkem je však opět <strong>arylnitreniový iont</strong>. Byla nalezena korelace mezi mutagenitou nitroarenů a stabilitou odpovídajícího nitreniového iontu.</p></div>
    </div>
    <div class="box red mt"><div class="box-title">Mezidruhové rozdíly a lidská variabilita</div><p>U arylaminů jsou rozdíly mezi druhy mimořádně velké, protože zastoupení jednotlivých biotransformačních cest se druh od druhu liší; pes například prakticky postrádá N-acetyltransferázovou aktivitu. <strong>Extrapolace z pokusného zvířete na člověka je zde proto obzvlášť nejistá.</strong> I mezi lidmi existuje dobře doložený polymorfismus N-acetyltransferázy, který ovlivňuje individuální vnímavost.</p></div>
  </div>
`);

slide('nitrosaminy','N-Nitrosaminy', `
  <div class="slide-inner">
    <p class="eyebrow">5 · Karcinogeneze · skupina 5</p>
    <h2 class="headline">Nitrosaminy: karcinogen, který vzniká v nás</h2>
    <div class="grid-2">
      <div class="box red"><div class="box-title">Mechanismus</div><p>N-Nitrosaminy jsou <strong>genotoxické karcinogeny</strong>. Po hydroxylaci cytochromem P450 se rozpadají za vzniku <strong>silných methylačních činidel</strong>, která alkylují DNA, zejména na O6 guaninu. Právě O6-methylguanin je mimořádně mutagenní, protože se chybně páruje s thyminem.</p><p>Nejznámějším zástupcem je <strong>N-nitrosodimethylamin (NDMA)</strong>.</p></div>
      <div class="box amber"><div class="box-title">Výskyt a souvislost s dusičnany</div><p>Nalezeny v <strong>uzeninách a dalších masných výrobcích</strong>, v pivu (dříve v podstatně vyšších koncentracích, než se změnila technologie sušení sladu), v nakládaných rybách.</p><p>Vznikají <strong>reakcí dusitanů se sekundárními aminy</strong>, a to jak při zpracování a tepelné úpravě, tak <strong>endogenně v kyselém prostředí žaludku</strong>. Právě proto spolu souvisí téma dusičnanů z přednášky 7 s tímto tématem: dusičnany se v ústní dutině redukují na dusitany a ty se mohou stát výchozí látkou pro nitrosaci.</p></div>
    </div>
    <div class="box green mt"><div class="box-title">Praktické důsledky</div><p>Z tohoto poznatku vycházejí konkrétní opatření: snížení přídavku dusitanových solicích směsí na technologicky nezbytné minimum, povinné přidávání <strong>kyseliny askorbové</strong>, která nitrosaci inhibuje, a doporučení omezovat spotřebu zpracovaného masa. IARC zařadila <strong>zpracované maso do skupiny 1</strong> a <strong>červené maso do skupiny 2A</strong> (2015). Ke správnému výkladu této klasifikace se dostaneme na konci přednášky.</p></div>
    <div class="abbr"><span class="lbl">POJMY</span><b>nitrosace</b> = zavedení skupiny −N=O; zde reakce dusitanu se sekundárním aminem · <b>O6-methylguanin</b> = methylovaný guanin, který se při replikaci chybně páruje</div>
  </div>
`);

slide('co-ovlivnuje','Co rozhoduje o potenciálu', `

      <div class="box blue"><div class="box-title">Na straně látky a jejího metabolismu</div><p><strong>Charakter a rozsah metabolické aktivace</strong> – u většiny karcinogenů rozhoduje, zda a jak rychle vznikne reaktivní metabolit.</p><p><strong>Reaktivita vzniklého metabolitu</strong> – příliš nereaktivní nezasáhne DNA, příliš reaktivní zanikne dříve, než se k jádru dostane.</p><p><strong>Stabilita metabolitu</strong> – určuje, zda působí jen v místě vzniku, nebo i ve vzdálené tkáni.</p><p><strong>Poměr aktivačních a detoxikačních enzymů</strong> v dané tkáni.</p></div>

slide('ukolC','Úkol C – zadání', `

    <p class="body-text">U látek bez prahu nelze stanovit bezpečnou dávku. Místo toho se odhaduje <strong>pravděpodobnost</strong>, s jakou celoživotní expozice dané koncentraci vyvolá nádorové onemocnění. Slouží k tomu <strong>jednotkové riziko</strong> (unit risk).</p>

      <li>Předpokládejte, že tato skupina je celoživotně exponována koncentraci <strong>3 ng·m⁻³</strong>. Kolik dalších případů nad rámec situace při limitu to znamená?</li>
      <li>Hlavním zdrojem emisí benzo[a]pyrenu v ČR je <strong>lokální vytápění domácností, a to z 96,6 %</strong>. Jaká opatření z toho logicky plynou a proč by zpřísnění limitů pro průmysl situaci nevyřešilo?</li>
    </ol></div>
    <div class="abbr"><span class="lbl">POJMY</span><b>jednotkové riziko</b> = přírůstek pravděpodobnosti nádoru při celoživotní expozici jednotkové koncentraci · <b>cílový imisní limit</b> = hodnota, které má být dosaženo, je-li to dosažitelné přiměřenými prostředky (směrnice 2004/107/ES, zákon č. 201/2012 Sb.)</div>

slide('ukolC-res2','Úkol C – řešení (4)', `
  <div class="slide-inner">

    <div class="grid-2">
      <div class="box green"><div class="box-title">4 · Kam opatření musí mířit</div><p>Podílí-li se lokální vytápění domácností na emisích benzo[a]pyrenu z <strong>96,6 %</strong>, je zřejmé, že zpřísnění limitů pro průmyslové zdroje by na celkové emisi změnilo nejvýše jednotky procent. Účinná opatření musí směřovat na <strong>velký počet malých, rozptýlených a obtížně kontrolovatelných zdrojů</strong>: výměnu kotlů, zákaz spalování nekvalitního paliva a odpadu, kontrolu provozu spalovacích zdrojů, podporu náhradních způsobů vytápění.</p></div>
      <div class="box amber"><div class="box-title">Proč je to obtížné</div><p>Na rozdíl od průmyslového zdroje se emise jednotlivé domácnosti neměří, zdroj je nízký, takže se znečištění nerozptýlí, a expozice je nejvyšší právě tam, kde lidé bydlí. Regulace navíc zasahuje do soukromí a má výrazný sociální rozměr: nejhůře spalují ti, kdo si nemohou dovolit lepší palivo ani nový kotel.</p></div>

    <div class="box red mt"><p><strong>Poznámka k nejistotě:</strong> hodnoty jednotkového rizika se mezi autoritami liší, protože se liší výchozí studie i model extrapolace. Číslo je nástrojem srovnání a rozhodování, nikoli přesnou předpovědí počtu onemocnění.</p></div>
  </div>
`);

      <div class="box green"><div class="box-title">3 · Benzen</div><p>Harmonizovaná klasifikace: <strong>Carc. 1A</strong> (H350), <strong>Muta. 1B</strong> (H340), dále STOT RE 1, Asp. Tox. 1 a další. IARC jej řadí do <strong>skupiny 1</strong>. Zde se oba systémy shodují, protože důkazy u člověka jsou jednoznačné (leukemie, přednáška 7).</p></div>
    </div>
    <div class="box amber mt"><div class="box-title">4 · Jak sdělení číst</div><p>Skupina 2B znamená <strong>„důkaz je omezený a nelze vyloučit, že látka karcinogenní je“</strong>. Nevypovídá o tom, jak silný účinek látka má, ani při jaké expozici. Zpráva „látka byla zařazena mezi možné karcinogeny“ je proto bez uvedení expozice prakticky nezpravodajská. Při výkladu je nutné připojit tři údaje: <strong>sílu důkazu, očekávanou expozici a existenci limitní hodnoty</strong>. Pro samotného spotřebitele je podstatnější sdělení, že ADI se při obvyklé spotřebě nepřekračuje.</p></div>
  </div>
`);

const deck = document.getElementById('deck');
slides.forEach((s,i)=>{
  const el = document.createElement('div');
  el.className='slide'; el.id='slide-'+i; el.innerHTML=s.html;
  keepTextTogether(el);
  deck.appendChild(el);
});
const overlayList = document.getElementById('overlay-list');
slides.forEach((s,i)=>{
  const li = document.createElement('li');
  li.innerHTML = '<span>'+String(i+1).padStart(2,'0')+'</span>'+s.title;
  keepTextTogether(li);
  li.onclick = ()=>{ goTo(i); toggleOverlay(false); };
  overlayList.appendChild(li);
});

let current = 0;
function render(){
  document.querySelectorAll('.slide').forEach((el,i)=> el.classList.toggle('active', i===current));
  document.getElementById('progress-fill').style.width = ((current+1)/slides.length*100)+'%';
  document.getElementById('counter').textContent = (current+1)+' / '+slides.length;
  document.getElementById('prevBtn').disabled = current===0;
  document.getElementById('nextBtn').disabled = current===slides.length-1;
  initSlideWidgets(current);
  renderNotes();
}
function goTo(i){ current = Math.max(0, Math.min(slides.length-1, i)); render(); }
function nextSlide(){ goTo(current+1); }
function prevSlide(){ goTo(current-1); }
document.addEventListener('keydown', (e)=>{
  if(document.getElementById('lightbox').classList.contains('show')){ if(e.key==='Escape') closeLightbox(); return; }
  if(document.getElementById('overlay').classList.contains('show')){ if(e.key==='Escape') toggleOverlay(false); return; }
  if(e.key==='ArrowRight' || e.key===' ') nextSlide();
  if(e.key==='ArrowLeft') prevSlide();
  if(e.key==='Escape') toggleOverlay(false);
  if(e.key==='n' || e.key==='N'){ document.getElementById('notes').classList.toggle('show'); renderNotes(); }
});
function toggleOverlay(show){ document.getElementById('overlay').classList.toggle('show', show); }

/* ---- poznámky vyučujícího: obsah jen z lokálního souboru Lektor_poznamky_P8.js (klávesa N) ---- */
function renderNotes(){
  const box = document.getElementById('notes');
  if(!box.classList.contains('show')) return;
  const N = window.LEKTOR_NOTES || null;
  const id = slides[current].id;
  if(!N){ box.innerHTML = '<div class="nh">POZNÁMKY VYUČUJÍCÍHO</div>Soubor Lektor_poznamky_P8.js nebyl nalezen.'; return; }
  box.innerHTML = '<div class="nh">POZNÁMKY VYUČUJÍCÍHO · '+(current+1)+' / '+slides.length+' · '+slides[current].title+' · (N = skrýt)</div>' + (N[id] || '<em>K tomuto slidu nejsou poznámky.</em>');
}

/* ---- lightbox ---- */
deck.addEventListener('click', (e)=>{
  const img = e.target.closest('.scheme-img');
  if(img){ openLightbox('<img src="'+img.getAttribute('src')+'" alt="'+(img.getAttribute('alt')||'')+'">'); return; }
  const svg = e.target.closest('.diagram-box svg');
  if(svg){ openLightbox(svg.outerHTML); return; }
});
function openLightbox(html){ document.getElementById('lightbox-inner').innerHTML = html; document.getElementById('lightbox').classList.add('show'); }
function closeLightbox(){ document.getElementById('lightbox').classList.remove('show'); document.getElementById('lightbox-inner').innerHTML = ''; }


/* ================= WIDGETS ================= */
const initialized = {};
function initSlideWidgets(i){
  const id = slides[i].id;
  if(initialized[id]) return;
  initialized[id] = true;
  const Q = {
    'kviz-rtut':[['q-rtut','q-rtut-fb','Správně. Rozhoduje dostupnost cílové struktury. Methylrtuť je lipofilní a jako komplex s cysteinem je navíc přenášena transportérem LAT1, takže se na rozdíl od Hg²⁺ dostane v dostatečném množství do mozku.','Nesprávně. Afinita k sulfanylové skupině je u obou forem vysoká a methylrtuť se na elementární rtuť nerozkládá. Rozhodující je průchod hematoencefalickou bariérou.']],
    'kviz-prah':[['q-prah','q-prah-fb','Správně. V běžném regulačním modelu se u genotoxických karcinogenů uvažuje bezprahová závislost, protože nelze vyloučit účinek velmi nízké dávky. Proto se kvantifikuje pravděpodobnostní riziko.','Nesprávně. Důvodem není ani zákaz, ani nedostatek dat, nýbrž předpoklad bezprahové závislosti v běžném regulačním modelu.']]
  };
  if(Q[id]) initSimpleQuizzes(Q[id]);
  if(id==='parovani') initMatching('mK', [
    {left:'Benzo[a]pyren', right:'diolepoxid po aktivaci CYP1A1 · plíce'},
    {left:'2-Naftylamin', right:'arylnitreniový iont uvolněný v moči · močový měchýř'},
    {left:'Vinylchlorid', right:'epoxid po aktivaci P450 · hemangiosarkom jater'},
    {left:'N-Nitrosodimethylamin', right:'methylace O6 guaninu · trávicí trakt'},
    {left:'Yperit', right:'bifunkční alkylace, křížové vazby v DNA · dýchací cesty'},
    {left:'TCDD', right:'negenotoxický mechanismus s předpokládaným prahem, podpora promoce · více tkání'}
  ], 'Správně, všech šest dvojic je přiřazeno.');
  if(id==='diskuse') initDiscussion();
}

function initSimpleQuizzes(list){
  list.forEach(([cardId, fbId, correctMsg, wrongMsg])=>{
    const card = document.getElementById(cardId);
    const opts = card.querySelectorAll('.quiz-opt');
    opts.forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const isCorrect = btn.dataset.correct==='true';
        opts.forEach(o=>o.disabled=true);
        btn.classList.add(isCorrect?'correct':'wrong');
        if(!isCorrect){ opts.forEach(o=>{ if(o.dataset.correct==='true') o.classList.add('correct'); }); }
        const fb = document.getElementById(fbId);
        fb.textContent = isCorrect? correctMsg: wrongMsg;
        fb.classList.add('show');
      });
    });
  });
}

function initDiscussion(){
  const qa = [
    {q:'Botulotoxin je nejtoxičtější známou látkou a zároveň běžně používaným léčivem. Není to rozpor?',
     a:'Není. Toxicita se vyjadřuje vztaženě k dávce a cestě podání. Terapeuticky se aplikuje řádově v nanogramech přímo do cílového svalu, takže systémová koncentrace zůstává zanedbatelná, zatímco místní účinek je plně využit. Jde o důsledné uplatnění Paracelsova principu i o ukázku toho, že riziko je funkcí nebezpečnosti a expozice: vysoce nebezpečná látka může být za řízených podmínek bezpečně použitelná.'},
    {q:'Proč se u nervově paralytických látek podává nejprve atropin, a nikoli oxim, když právě oxim obnovuje zasažený enzym?',
     a:'Protože o přežití rozhoduje dýchání. Atropin během minut vysuší sekret v dýchacích cestách a uvolní bronchospasmus, tedy odstraní bezprostřední příčinu smrti. Oxim působí kauzálně, ale pomaleji, nepomůže proti centrální složce a po zestárnutí enzymu je neúčinný. Pořadí tedy neodráží, který zásah je mechanisticky důležitější, nýbrž co ohrožuje pacienta dříve. Obecné pravidlo zní: nejprve se stabilizují vitální funkce, teprve poté se řeší příčina.'},
    {q:'Lze říci, že látka zařazená IARC do skupiny 1 je nebezpečnější než látka ve skupině 2B?',
     a:'Nikoli v tom smyslu, v jakém se to obvykle chápe. Skupiny IARC vyjadřují sílu důkazu, nikoli potenci látky ani velikost rizika. Ve skupině 1 jsou vedle sebe látky s velmi odlišnou potencí a s velmi odlišnou obvyklou expozicí. Srovnání nebezpečnosti vyžaduje údaj o dávkové závislosti a srovnání rizika navíc údaj o expozici. Zařazení do skupiny 1 tedy znamená, že o karcinogenitě není pochyb, nikoli že je látka nejnebezpečnější.'},
    {q:'U benzo[a]pyrenu jsme spočítali riziko řádu 10⁻⁴ při koncentraci rovné imisnímu limitu. Je přijatelné stanovit limit na úrovni, která sama o sobě není bezpečná?',
     a:'U bezprahové látky jiná možnost neexistuje: jediná koncentrace s nulovým rizikem je nulová, a té nelze dosáhnout. Limit je proto výsledkem rozhodnutí, jakou úroveň rizika společnost přijímá, při zohlednění technické a ekonomické dosažitelnosti. Odborná analýza poskytuje kvantifikaci rizika, volba přijatelné úrovně je však rozhodnutím politickým. Je proto legitimní a žádoucí se ptát, kdo tuto hranici stanovuje a zda je stejná pro všechny skupiny obyvatel.'}
  ];
  const wrap = document.getElementById('discussion-list');
  qa.forEach((item,i)=>{
    const div = document.createElement('div');
    div.className='tl-item';
    div.innerHTML = '<div class="tl-year">Otázka '+(i+1)+' · klikněte pro možnou odpověď</div><div class="tl-title">'+item.q+'</div><div class="tl-detail">'+item.a+'</div>';
    div.onclick = ()=> div.classList.toggle('open');
    wrap.appendChild(div);
  });
}

function initMatching(prefix, pairs, doneMsg){
  const leftItems = pairs.map((p,i)=>({text:p.left, idx:i}));
  const rightItems = pairs.map((p,i)=>({text:p.right, idx:i}));
  for(let i=rightItems.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [rightItems[i],rightItems[j]]=[rightItems[j],rightItems[i]]; }
  const leftEl = document.getElementById(prefix+'-left');
  const rightEl = document.getElementById(prefix+'-right');
  let selectedLeft = null, solved = 0;
  leftItems.forEach(item=>{
    const div = document.createElement('div');
    div.className='match-item'; div.textContent = item.text; div.dataset.idx = item.idx;
    div.onclick = ()=>{
      if(div.classList.contains('correct')) return;
      leftEl.querySelectorAll('.match-item').forEach(x=>x.classList.remove('selected'));
      div.classList.add('selected'); selectedLeft = div;
    };
    leftEl.appendChild(div);
  });
  rightItems.forEach(item=>{
    const div = document.createElement('div');
    div.className='match-item'; div.textContent = item.text; div.dataset.idx = item.idx;
    div.onclick = ()=>{
      if(!selectedLeft || div.classList.contains('correct')) return;
      if(selectedLeft.dataset.idx === div.dataset.idx){
        selectedLeft.classList.remove('selected'); selectedLeft.classList.add('correct');
        div.classList.add('correct'); solved++; selectedLeft = null;
        if(solved===pairs.length) document.getElementById(prefix+'-result').textContent = doneMsg;
      } else {
        div.classList.add('wrong'); setTimeout(()=>div.classList.remove('wrong'), 500);
      }
    };
    rightEl.appendChild(div);
  });
}

render();
