<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neurotoxicita, mutagenita a karcinogenita — Přednáška 8</title>
<style>
  :root{
    --paper:#F4F5EF;
    --ink:#1E2019;
    --ink-soft:#5A5D51;
    --amber:#B9791E;
    --amber-deep:#8F5D14;
    --tox-green:#3E5C42;
    --tox-green-deep:#2A3F2D;
    --danger:#9C3B2E;
    --blue:#3A5A72;
    --blue-deep:#233C4E;
    --violet:#6A55A8;
    --line:#D6D6C6;
    --card:#FFFFFE;
    --serif: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', serif;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    --mono: 'SF Mono', SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{ margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans); overflow:hidden; font-size:18px; }
  ::selection{ background: var(--amber); color:#fff; }

  #topbar{ position:fixed; top:0; left:0; right:0; height:54px; display:flex; align-items:center; gap:16px; padding:0 20px; z-index:50;
    background:linear-gradient(to bottom, rgba(244,245,239,0.97), rgba(244,245,239,0.85)); border-bottom:1px solid var(--line); }
  #topbar .brand{ font-family:var(--serif); font-size:16px; font-style:italic; color:var(--ink-soft); white-space:nowrap; }
  #progress-track{ flex:1; height:3px; background:var(--line); border-radius:2px; overflow:hidden; }
  #progress-fill{ height:100%; width:0%; background:var(--amber); transition:width .35s ease; }
  #counter{ font-family:var(--mono); font-size:13px; color:var(--ink-soft); white-space:nowrap; }
  #menu-btn{ font-family:var(--sans); font-size:14px; color:var(--ink); background:var(--card); border:1px solid var(--line); border-radius:6px; padding:6px 12px; cursor:pointer; }
  #menu-btn:hover{ border-color:var(--amber); }

  #deck{ position:relative; width:100%; height:100%; padding-top:54px; }
  .slide{ position:absolute; inset:0; top:54px; display:flex; align-items:center; justify-content:center;
    padding:30px 6vw 90px 6vw; opacity:0; visibility:hidden; transform:translateY(14px);
    transition:opacity .4s ease, transform .4s ease; overflow-y:auto; }
  .slide.active{ opacity:1; visibility:visible; transform:translateY(0); }
  .slide-inner{ width:100%; max-width:1080px; }
  .eyebrow{ font-family:var(--mono); font-size:16px; letter-spacing:.02em; color:var(--amber-deep); margin:0 0 10px 0; }
  h1.headline{ font-family:var(--serif); font-weight:400; font-size:clamp(30px,4.6vw,50px); line-height:1.1; margin:0 0 16px 0; }
  h2.headline{ font-family:var(--serif); font-weight:400; font-size:clamp(24px,3.2vw,34px); line-height:1.18; margin:0 0 16px 0; }
  p.lede{ font-size:20px; line-height:1.55; color:var(--ink-soft); max-width:760px; }
  .body-text{ font-size:19px; line-height:1.6; color:var(--ink); }
  .grid-2{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .grid-3{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
  @media (max-width:860px){ .grid-2,.grid-3{ grid-template-columns:1fr; } }
  ul.plain{ margin:0; padding-left:22px; font-size:18px; }
  ul.plain li{ margin-bottom:8px; line-height:1.5; }
  .mt{ margin-top:14px; }

  /* ---------- barevná pole ---------- */
  .box{ border-radius:12px; padding:14px 18px; border:1px solid; border-left-width:6px; font-size:18px; line-height:1.5; }
  .box p{ margin:0; }
  .box p + p{ margin-top:6px; }
  .box ul.plain{ font-size:17.5px; }
  .box-title{ font-family:var(--mono); font-size:13px; letter-spacing:.06em; text-transform:uppercase; margin-bottom:6px; font-weight:600; }
  .box .big{ font-family:var(--serif); font-size:23px; margin-bottom:4px; display:block; }
  .box.blue{ background:#EAF2F8; border-color:#C3D6E4; border-left-color:var(--blue); }   .box.blue .box-title{ color:var(--blue-deep); }
  .box.green{ background:#EAF4EC; border-color:#C5DCC9; border-left-color:var(--tox-green); } .box.green .box-title{ color:var(--tox-green-deep); }
  .box.amber{ background:#FDF3E1; border-color:#EBD3A8; border-left-color:var(--amber); } .box.amber .box-title{ color:var(--amber-deep); }
  .box.red{ background:#FBECE9; border-color:#E8C4BD; border-left-color:var(--danger); }   .box.red .box-title{ color:var(--danger); }
  .box.violet{ background:#F1EDF9; border-color:#D5CBEB; border-left-color:var(--violet); } .box.violet .box-title{ color:var(--violet); }
  .box.grey{ background:#FFFFFE; border-color:var(--line); border-left-color:#9A9C8E; } .box.grey .box-title{ color:var(--ink-soft); }

  /* zkratky */
  .abbr{ margin-top:16px; padding:10px 14px; background:#F0F1EA; border:1px dashed #BFC1B2; border-radius:10px; font-size:15.5px; line-height:1.55; color:var(--ink-soft); }
  .abbr b{ color:var(--ink); font-family:var(--mono); font-size:14.5px; }
  .abbr .lbl{ font-family:var(--mono); font-size:12px; letter-spacing:.06em; color:var(--amber-deep); margin-right:6px; }

  /* tok / řetězec */
  .flow{ display:flex; align-items:stretch; gap:8px; margin-top:12px; }
  .flow .step{ flex:1; border-radius:12px; padding:12px 10px; border:2px solid; text-align:center; font-size:17px; line-height:1.4; display:flex; flex-direction:column; justify-content:center; }
  .flow .step b{ display:block; font-size:18px; margin-bottom:4px; }
  .flow .arr{ align-self:center; font-size:26px; color:#8A8C7E; flex:0 0 18px; text-align:center; }
  .s-red{ background:#FBECE9; border-color:#D9897B; } .s-blue{ background:#EAF2F8; border-color:#7FA3BF; }
  .s-green{ background:#EAF4EC; border-color:#86AE8D; } .s-violet{ background:#F1EDF9; border-color:#A797D2; }
  .s-amber{ background:#FDF3E1; border-color:#D9AE62; }
  @media (max-width:860px){ .flow{ flex-direction:column; } .flow .arr{ transform:rotate(90deg); } }
  .under{ display:flex; gap:8px; margin-top:8px; }
  .under div{ flex:1; text-align:center; font-size:15px; color:var(--ink-soft); line-height:1.35; }
  .under .gap{ flex:0 0 18px; }

  /* časová osa */
  .tline{ display:grid; gap:8px; margin-top:8px; }
  .tline .ev{ display:grid; grid-template-columns:96px 1fr; gap:14px; align-items:center; }
  .tline .yr{ font-family:var(--mono); font-size:17px; font-weight:700; color:#fff; border-radius:8px; padding:7px 0; text-align:center; }
  .tline .tx{ font-size:17.5px; line-height:1.4; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:7px 12px; }
  .y-vivo{ background:#C4673A; } .y-vitro{ background:#3E8A5E; } .y-silico{ background:#6A55A8; } .y-reg{ background:#3A6FA0; }
  .legend{ display:flex; gap:16px; flex-wrap:wrap; font-size:14.5px; color:var(--ink-soft); margin-top:12px; }
  .legend span::before{ content:''; display:inline-block; width:12px; height:12px; border-radius:3px; margin-right:6px; vertical-align:-1px; background:var(--c); }

  /* sloupcový graf */
  .bars{ margin-top:10px; }
  .bar-row{ display:grid; grid-template-columns:260px 1fr 80px; gap:12px; align-items:center; margin-bottom:10px; font-size:17.5px; }
  .bar-track{ background:#E7E8DF; border-radius:6px; height:32px; overflow:hidden; }
  .bar-fill{ height:100%; border-radius:6px; }
  .bar-val{ font-family:var(--mono); font-weight:700; font-size:17px; text-align:right; }

  /* pyramida */
  .pyr{ display:flex; flex-direction:column; align-items:center; gap:6px; margin-top:6px; }
  .pyr div{ border-radius:10px; padding:10px 14px; text-align:center; font-size:17px; line-height:1.35; border:2px solid; }
  .pyr b{ display:block; font-size:18px; }

  /* délka testů */
  .dur-row{ display:grid; grid-template-columns:200px 1fr; gap:12px; align-items:center; margin-bottom:9px; font-size:18px; }
  .dur-bar{ height:32px; border-radius:6px; color:#fff; font-size:15.5px; display:flex; align-items:center; padding:0 10px; white-space:nowrap; font-weight:600; }

  #navbtns{ position:fixed; bottom:22px; right:28px; display:flex; gap:10px; z-index:50; }
  .navbtn{ width:46px; height:46px; border-radius:50%; border:1px solid var(--line); background:var(--card); color:var(--ink); font-size:19px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .navbtn:hover{ border-color:var(--amber); color:var(--amber-deep); }
  .navbtn:disabled{ opacity:.3; cursor:default; }
  #overlay{ position:fixed; inset:0; background:rgba(30,32,25,.94); z-index:100; display:none; padding:56px 8vw; overflow-y:auto; }
  #overlay.show{ display:block; }
  #overlay h3{ font-family:var(--serif); color:#fff; font-weight:400; font-size:23px; margin-bottom:20px; }
  #overlay-list{ list-style:none; margin:0; padding:0; columns:2; column-gap:40px; }
  @media (max-width:800px){ #overlay-list{ columns:1; } }
  #overlay-list li{ color:#EDEEE6; font-size:16px; padding:9px 0; border-bottom:1px solid rgba(255,255,255,.12); cursor:pointer; break-inside:avoid; }
  #overlay-list li span{ font-family:var(--mono); color:var(--amber); margin-right:10px; font-size:13px; }
  #overlay-list li:hover{ color:var(--amber); }
  #overlay-close{ position:absolute; top:22px; right:30px; color:#fff; font-size:28px; background:none; border:none; cursor:pointer; }

  /* poznámky vyučujícího (klávesa N; obsah jen z lokálního souboru Lektor_poznamky_P8.js) */
  #notes{ position:fixed; left:0; right:0; bottom:0; max-height:42vh; overflow-y:auto; background:#1E2019; color:#EDEEE6; z-index:200;
    padding:16px 6vw 20px 6vw; font-size:16px; line-height:1.55; display:none; border-top:3px solid var(--amber); }
  #notes.show{ display:block; }
  #notes .nh{ font-family:var(--mono); font-size:12.5px; color:var(--amber); letter-spacing:.05em; margin-bottom:6px; }
  #notes ul{ margin:4px 0 0 0; padding-left:20px; } #notes li{ margin-bottom:4px; }
  #notes b{ color:#F3D9A8; }

  .quiz-card{ background:var(--card); border:1px solid var(--line); border-left:6px solid var(--blue); border-radius:12px; padding:20px 24px; margin-top:10px; }
  .quiz-q{ font-size:19px; font-weight:600; margin-bottom:14px; line-height:1.45; }
  .quiz-opt{ display:block; width:100%; text-align:left; padding:12px 16px; margin-bottom:9px; border:1px solid var(--line); border-radius:8px; background:#fff; cursor:pointer; font-size:18px; font-family:var(--sans); color:var(--ink); }
  .quiz-opt:hover{ border-color:var(--amber); }
  .quiz-opt.correct{ border-color:var(--tox-green); background:#EAF1EA; color:var(--tox-green-deep); font-weight:600; }
  .quiz-opt.wrong{ border-color:var(--danger); background:#F7EAE7; color:var(--danger); }
  .quiz-opt[disabled]{ cursor:default; }
  .quiz-feedback{ margin-top:12px; font-size:18px; line-height:1.55; color:var(--ink-soft); display:none; }
  .quiz-feedback.show{ display:block; }

  table.data-table{ width:100%; border-collapse:collapse; font-size:18px; margin-top:10px; background:var(--card); border-radius:10px; overflow:hidden; }
  table.data-table th{ text-align:left; font-family:var(--mono); font-size:14.5px; color:#fff; background:var(--blue); padding:9px 12px; }
  table.data-table td{ padding:9px 12px; border-bottom:1px solid var(--line); }
  table.data-table td.num, table.data-table th.num{ text-align:right; font-variant-numeric:tabular-nums; }
  table.data-table tr.c1 td:first-child{ border-left:6px solid #D9897B; }
  table.data-table tr.c2 td:first-child{ border-left:6px solid #D9AE62; }
  table.data-table tr.c3 td:first-child{ border-left:6px solid #86AE8D; }
  table.data-table tr.c4 td:first-child{ border-left:6px solid #7FA3BF; }

  .tl-item{ background:var(--card); border:1px solid var(--line); border-left:6px solid var(--violet); border-radius:10px; padding:14px 16px; cursor:pointer; }
  .tl-item .tl-year{ font-family:var(--mono); font-size:14px; color:var(--violet); }
  .tl-item .tl-title{ font-family:var(--serif); font-size:20px; margin:4px 0 6px 0; }
  .tl-item .tl-detail{ font-size:17.5px; color:var(--ink-soft); line-height:1.5; display:none; }
  .tl-item.open .tl-detail{ display:block; }

  .footer-note{ margin-top:16px; font-size:17px; color:var(--ink-soft); font-family:var(--mono); line-height:1.5; }
  .sources{ font-size:12px; color:var(--ink-soft); line-height:1.45; column-count:2; column-gap:26px; background:#fff; border:1px solid var(--line); border-radius:10px; padding:14px 18px; }
  .sources p{ margin:0 0 4px 0; break-inside:avoid; }
  .sources h4{ font-family:var(--mono); font-size:12px; color:var(--amber-deep); margin:6px 0 4px 0; letter-spacing:.05em; }

  .diagram-box{ background:#fff; border:1px solid var(--line); border-radius:12px; padding:12px; }
  .diagram-box svg{ cursor:zoom-in; display:block; width:100%; height:auto; }
  .scheme-img{ width:100%; max-width:720px; display:block; margin:0 auto; border:1px solid var(--line); border-radius:8px; background:#fff; cursor:zoom-in; }
  .scheme-img.tiny{ max-width:300px; }
  .portrait{ max-height:290px; width:auto; max-width:100%; }
  figure.fig{ margin:0; }
  figure.fig figcaption{ font-size:15px; color:var(--ink-soft); text-align:center; margin-top:6px; line-height:1.45; }

  #lightbox{ position:fixed; inset:0; background:rgba(15,16,12,.95); z-index:300; display:none; align-items:center; justify-content:center; padding:4vh 4vw; cursor:zoom-out; }
  #lightbox.show{ display:flex; }
  #lightbox-inner{ max-width:100%; max-height:100%; cursor:default; }
  #lightbox-inner img{ display:block; max-width:92vw; max-height:92vh; border-radius:10px; background:#fff; }
  #lightbox-inner svg{ display:block; width:92vw; height:auto; max-height:92vh; background:#fff; border-radius:10px; padding:28px; }
  #lightbox-hint{ position:absolute; bottom:22px; left:50%; transform:translateX(-50%); color:#B9B9A8; font-family:var(--mono); font-size:13px; }

  .match-wrap{ display:grid; grid-template-columns:1fr 1fr; gap:24px; margin-top:14px; }
  @media (max-width:760px){ .match-wrap{ grid-template-columns:1fr; } }
  .match-col-title{ font-family:var(--mono); font-size:13px; color:var(--ink-soft); margin-bottom:8px; }
  .match-item{ background:var(--card); border:1px solid var(--line); border-radius:8px; padding:11px 14px; margin-bottom:8px; font-size:18px; cursor:pointer; }
  .match-item.selected{ border-color:var(--amber); background:#FBF0DD; }
  .match-item.correct{ border-color:var(--tox-green); background:#EAF1EA; }
  .match-item.wrong{ border-color:var(--danger); background:#F7EAE7; }
  .match-result{ margin-top:12px; font-size:18px; color:var(--tox-green-deep); min-height:24px; font-weight:600; }

  .sort-row{ display:grid; grid-template-columns:1fr auto; gap:12px; align-items:center; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:10px 14px; margin-bottom:8px; font-size:17.5px; }
  .sort-row.correct{ border-color:var(--tox-green); background:#EAF1EA; }
  .sort-btns{ display:flex; gap:6px; }
  .sort-btn{ font-family:var(--sans); font-size:14.5px; padding:6px 10px; border:1px solid var(--line); border-radius:6px; background:#fff; cursor:pointer; color:var(--ink); }
  .sort-btn:hover{ border-color:var(--amber); }
  .sort-btn.wrong{ border-color:var(--danger); background:#F7EAE7; color:var(--danger); }
  .sort-btn.right{ border-color:var(--tox-green); background:var(--tox-green); color:#fff; }
  .sort-why{ grid-column:1 / -1; font-size:15.5px; color:var(--ink-soft); display:none; }
  .sort-row.correct .sort-why{ display:block; }

  .task-box{ background:var(--card); border:1px solid var(--line); border-left:6px solid var(--amber); border-radius:12px; padding:16px 20px; margin-top:12px; }
  .task-box ol{ margin:0; padding-left:24px; font-size:18.5px; }
  .task-box ol li{ margin-bottom:8px; line-height:1.5; }
  .sol-box{ background:#EAF4EC; border:1px solid #C5DCC9; border-left:6px solid var(--tox-green); border-radius:12px; padding:14px 20px; margin-top:12px; }
  .calc-step{ font-family:var(--mono); font-size:18px; line-height:1.9; color:var(--ink); }
  .calc-step .res{ color:var(--tox-green-deep); font-weight:700; }
  .calc-step .bad{ color:var(--danger); font-weight:700; }
  .sol-label{ font-family:var(--mono); font-size:13px; color:var(--tox-green-deep); letter-spacing:.05em; margin-bottom:6px; font-weight:600; }
  .hint{ font-size:15.5px; color:var(--ink-soft); margin-top:10px; line-height:1.5; }

  @media (prefers-reduced-motion: reduce){ .slide, .navbtn, #progress-fill{ transition:none !important; } }
</style>
</head>
<body>

<div id="topbar">
  <div class="brand">Neurotoxicita, mutagenita a karcinogenita · Přednáška 8</div>
  <div id="progress-track"><div id="progress-fill"></div></div>
  <div id="counter">1 / 1</div>
  <button id="menu-btn" onclick="toggleOverlay(true)">Obsah</button>
</div>

<div id="deck"></div>

<div id="navbtns">
  <button class="navbtn" id="prevBtn" onclick="prevSlide()">←</button>
  <button class="navbtn" id="nextBtn" onclick="nextSlide()">→</button>
</div>

<div id="lightbox" onclick="closeLightbox()">
  <div id="lightbox-inner" onclick="event.stopPropagation()"></div>
  <div id="lightbox-hint">klikněte mimo obrázek nebo stiskněte Esc pro zavření</div>
</div>

<div id="overlay">
  <button id="overlay-close" onclick="toggleOverlay(false)">×</button>
  <h3>Přeskočit na</h3>
  <ul id="overlay-list"></ul>
</div>

<div id="notes"></div>

<script>
const slides = [];
function slide(id, title, html){ slides.push({id, title, html}); }

/* =====================================================================
   0 · ÚVOD (≈ 4 min)
   ===================================================================== */
slide('title','Titulní strana', `
  <div class="slide-inner">
    <p class="eyebrow">Ing. Pavla Fojtíková, Ph.D. · Přírodovědecká fakulta JU</p>
    <h1 class="headline">Neurotoxicita, mutagenita a karcinogenita</h1>
    <p class="lede">Přednáška 8: mechanismy poškození nervové soustavy, inhibitory acetylcholinesterázy jako případová studie, vícestupňový proces karcinogeneze a kvantifikace bezprahového rizika.</p>
    <p class="footer-note">Laboratoř analytické a environmentální chemie</p>
  </div>
`);

slide('outline','Osnova', `
  <div class="slide-inner">
    <p class="eyebrow">Obsah přednášky</p>
    <h2 class="headline">Dvě velké části, šest tematických celků</h2>
    <div class="grid-3">
      <div class="box blue"><div class="box-title">1 · Nervová soustava jako cíl</div><p>Zranitelnost neuronu, hematoencefalická bariéra, pět mechanismů</p></div>
      <div class="box red"><div class="box-title">2 · Přímé poškození neuronu</div><p>Hexan, těžké kovy, methylrtuť, Minamata</p></div>
      <div class="box amber"><div class="box-title">3 · Zásah do synaptického přenosu</div><p>Agonisté a antagonisté, iontové kanály, inhibice AChE</p></div>
      <div class="box violet"><div class="box-title">4 · Bojové látky</div><p>Látky G, V a A jako případová studie inhibice AChE</p></div>
      <div class="box green"><div class="box-title">5 · Karcinogeneze</div><p>Iniciace, promoce, progrese; genotoxické a epigenetické karcinogeny</p></div>
      <div class="box grey"><div class="box-title">6 · Kvantifikace a klasifikace</div><p>Jednotkové riziko, IARC a CLP, práce s databázemi</p></div>
    </div>
    <p class="footer-note">Součástí jsou čtyři úkoly (A–D), kontrolní kvízy a diskuse. Doporučuji kalkulačku a přístup k internetu.</p>
  </div>
`);

/* =====================================================================
   1 · NERVOVÁ SOUSTAVA JAKO CÍLOVÝ ORGÁN (≈ 8 min)
   ===================================================================== */
slide('ns-cil','Nervová soustava jako cílový orgán', `
  <div class="slide-inner">
    <p class="eyebrow">1 · Neurotoxicita · navazujeme na přednášku 7</p>
    <h2 class="headline">Cílový orgán, který není lokalizován</h2>
    <p class="body-text">Na rozdíl od jater či ledvin není nervová soustava ohraničeným orgánem: je rozložena po celém těle a řídí funkci orgánů ostatních. Narušení její funkce se proto projeví jak přímo (útlum, excitace, křeče), tak nepřímo změnami v řízení oběhu, dýchání a sekrece.</p>
    <div class="grid-3 mt">
      <div class="box blue"><div class="box-title">Omezená regenerace</div><p>Člověk se rodí s více než 10<sup>11</sup> neuronů. Zralé neurony se <strong>nedělí</strong>; jejich počet v průběhu života klesá, zatímco počet synaptických spojení roste. Ztráta neuronu je proto zpravidla nevratná.</p></div>

      <div class="box green"><div class="box-title">Evoluční kontext</div><p>Převážná většina přírodních jedů (rostlinných, živočišných i mikrobiálních) působí právě na nervovou soustavu. Rychlá imobilizace kořisti nebo predátora je účinnější obrannou strategií než pomalé orgánové poškození.</p></div>
    </div>
    <div class="box red mt"><div class="box-title">Sekundární neurotoxicita</div><p>Kyanidy (inhibice cytochrom-c-oxidázy), oxid uhelnatý (karboxyhemoglobin) a dusitany (methemoglobinemie, přednáška 7) nepoškozují neurony přímou vazbou na nervovou strukturu. Výsledkem je <strong>systémová hypoxie</strong>, vůči níž je nervová tkáň nejcitlivější, takže se intoxikace projeví neurologicky.</p></div>
  </div>
`);

slide('heb','Hematoencefalická bariéra', `

      <div class="box blue"><div class="box-title">Stavba bariéry</div><p>Endotel mozkových kapilár má <strong>těsná spojení (tight junctions)</strong> bez fenestrací a je obklopen bazální membránou a výběžky astrocytů. Paracelulární difuze je prakticky vyloučena: látka musí projít <strong>přes</strong> buňku, nikoli mezi buňkami.</p><p>Bariéra je navíc vybavena efluxními transportéry (P-glykoprotein), které řadu xenobiotik aktivně vrací do krve.</p></div>

    <div class="abbr"><span class="lbl">POJMY</span><b>elektrofil</b> = částice s nedostatkem elektronů, vyhledávající centra s jejich přebytkem · <b>adukt DNA</b> = produkt kovalentní vazby cizorodé molekuly na bázi DNA</div>

      <div class="box red"><div class="box-title">3 · Progrese a 4 · metastazování</div><p>V progresi se genetická informace nádorových buněk stává <strong>nestabilní</strong>: narůstá počet chromozomových změn, buňky se stále citlivěji přizpůsobují růstovým signálům a ztrácejí zpětnovazebnou kontrolu. Roste rychlost růstu, invazivita i schopnost šíření. <strong>Od tohoto stadia je proces nevratný.</strong></p><p><strong>Progresor</strong> je látka podporující přechod z promoce do progrese: arsenité ionty, azbest, benzen, polychlorované bifenyly.</p><p><strong>Metastazování</strong> je konečné stadium: buňky pronikají do krevních a lymfatických cév a zakládají druhotná ložiska ve vzdálených tkáních.</p></div>
    </div>
    <div class="box green mt"><p><strong>Experimentální důkaz dvoustupňovosti:</strong> podá-li se pokusnému zvířeti jediná nízká dávka iniciátoru a poté opakovaně promotor, nádory vzniknou. V obráceném pořadí nikoli, a samotný promotor také ne. Iniciace tedy musí předcházet a její účinek přetrvává, kdežto promoce vyžaduje opakované působení.</p></div>
  </div>
`);

slide('mutagen-karcinogen','Mutagenita a karcinogenita', `

slide('dve-skupiny','Genotoxické a epigenetické', `

slide('arylaminy','Arylaminy a nitroareny', `
  <div class="slide-inner">
    <p class="eyebrow">5 · Karcinogeneze · skupiny 3 a 4</p>
    <h2 class="headline">Arylaminy a nitroareny: společný konečný metabolit</h2>
    <div class="grid-2">
      <div class="box violet"><div class="box-title">Arylaminy a heteroarylaminy</div><p>Aromatické aminy procházejí rozvětvenou sítí biotransformačních cest: N-oxidací, N-acetylací, glukuronidací a sulfatací. Jedna z nich vede přes N-hydroxyderivát a jeho ester ke <strong>arylnitreniovému iontu</strong>, elektrofilní částici tvořící adukty s DNA.</p><p><strong>Cílovým orgánem je typicky močový měchýř.</strong> N-glukuronid vzniklý v játrech je vyloučen do moči, v jejím kyselém prostředí se rozpadá zpět a výsledná reaktivní částice působí přímo na urotel, kde moč stojí. Jde o mimořádně názornou ukázku toho, že cílový orgán určuje <strong>místo uvolnění reaktivního metabolitu</strong>, nikoli místo jeho vzniku.</p><p><strong>Příklady:</strong> benzidin, 2-naftylamin, 4-aminobifenyl (barvářský průmysl, cigaretový kouř), heterocyklické aminy vznikající při smažení masa.</p></div>
      <div class="box amber"><div class="box-title">Nitroareny</div><p>Aromatické nitrolátky ze <strong>výfukových plynů vznětových motorů</strong>, cigaretového kouře, spalovacích procesů a grilování.</p><p>Jsou netěkavé a <strong>adsorbují se na povrch prachových částic</strong>, s nimiž se dostávají až do alveolární oblasti (přednáška 7).</p><p>Metabolická aktivace probíhá <strong>redukcí</strong> nitroskupiny (na rozdíl od oxidace u arylaminů), výsledkem je však opět <strong>arylnitreniový iont</strong>. Byla nalezena korelace mezi mutagenitou nitroarenů a stabilitou odpovídajícího nitreniového iontu.</p></div>
    </div>
    <div class="box red mt"><div class="box-title">Mezidruhové rozdíly a lidská variabilita</div><p>U arylaminů jsou rozdíly mezi druhy mimořádně velké, protože zastoupení jednotlivých biotransformačních cest se druh od druhu liší; pes například prakticky postrádá N-acetyltransferázovou aktivitu. <strong>Extrapolace z pokusného zvířete na člověka je zde proto obzvlášť nejistá.</strong> I mezi lidmi existuje dobře doložený polymorfismus N-acetyltransferázy, který ovlivňuje individuální vnímavost.</p></div>
  </div>
`);

slide('nitrosaminy','N-Nitrosaminy', `

const deck = document.getElementById('deck');
slides.forEach((s,i)=>{
  const el = document.createElement('div');
  el.className='slide'; el.id='slide-'+i; el.innerHTML=s.html;
  deck.appendChild(el);
});
const overlayList = document.getElementById('overlay-list');
slides.forEach((s,i)=>{
  const li = document.createElement('li');
  li.innerHTML = '<span>'+String(i+1).padStart(2,'0')+'</span>'+s.title;
  li.onclick = ()=>{ goTo(i); toggleOverlay(false); };
  overlayList.appendChild(li);
});

let current = 0;
function render(){
  document.querySelectorAll('.slide').forEach((el,i)=> el.classList.toggle('active', i===current));
  document.getElementById('progress-fill').style.width = ((current+1)/slides.length*100)+'%';
  document.getElementById('counter').textContent = (current+1)+' / '+slides.length;
  document.getElementById('prevBtn').disabled = current===0;
  document.getElementById('nextBtn').disabled = current===slides.length-1;
  initSlideWidgets(current);
  renderNotes();
}
function goTo(i){ current = Math.max(0, Math.min(slides.length-1, i)); render(); }
function nextSlide(){ goTo(current+1); }
function prevSlide(){ goTo(current-1); }
document.addEventListener('keydown', (e)=>{
  if(document.getElementById('lightbox').classList.contains('show')){ if(e.key==='Escape') closeLightbox(); return; }
  if(document.getElementById('overlay').classList.contains('show')){ if(e.key==='Escape') toggleOverlay(false); return; }
  if(e.key==='ArrowRight' || e.key===' ') nextSlide();
  if(e.key==='ArrowLeft') prevSlide();
  if(e.key==='Escape') toggleOverlay(false);
  if(e.key==='n' || e.key==='N'){ document.getElementById('notes').classList.toggle('show'); renderNotes(); }
});
function toggleOverlay(show){ document.getElementById('overlay').classList.toggle('show', show); }

/* ---- poznámky vyučujícího: obsah jen z lokálního souboru Lektor_poznamky_P8.js (klávesa N) ---- */
function renderNotes(){
  const box = document.getElementById('notes');
  if(!box.classList.contains('show')) return;
  const N = window.LEKTOR_NOTES || null;
  const id = slides[current].id;
  if(!N){ box.innerHTML = '<div class="nh">POZNÁMKY VYUČUJÍCÍHO</div>Soubor Lektor_poznamky_P8.js nebyl nalezen.'; return; }
  box.innerHTML = '<div class="nh">POZNÁMKY VYUČUJÍCÍHO · '+(current+1)+' / '+slides.length+' · '+slides[current].title+' · (N = skrýt)</div>' + (N[id] || '<em>K tomuto slidu nejsou poznámky.</em>');
}

  if(id==='diskuse') initDiscussion();
}

function initSimpleQuizzes(list){
  list.forEach(([cardId, fbId, correctMsg, wrongMsg])=>{
    const card = document.getElementById(cardId);
    const opts = card.querySelectorAll('.quiz-opt');
    opts.forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const isCorrect = btn.dataset.correct==='true';
        opts.forEach(o=>o.disabled=true);
        btn.classList.add(isCorrect?'correct':'wrong');
        if(!isCorrect){ opts.forEach(o=>{ if(o.dataset.correct==='true') o.classList.add('correct'); }); }
        const fb = document.getElementById(fbId);
        fb.textContent = isCorrect? correctMsg: wrongMsg;
        fb.classList.add('show');
      });
    });
  });
}

function initMatching(prefix, pairs, doneMsg){
  const leftItems = pairs.map((p,i)=>({text:p.left, idx:i}));
  const rightItems = pairs.map((p,i)=>({text:p.right, idx:i}));
  for(let i=rightItems.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [rightItems[i],rightItems[j]]=[rightItems[j],rightItems[i]]; }
  const leftEl = document.getElementById(prefix+'-left');
  const rightEl = document.getElementById(prefix+'-right');
  let selectedLeft = null, solved = 0;
  leftItems.forEach(item=>{
    const div = document.createElement('div');
    div.className='match-item'; div.textContent = item.text; div.dataset.idx = item.idx;
    div.onclick = ()=>{
      if(div.classList.contains('correct')) return;
      leftEl.querySelectorAll('.match-item').forEach(x=>x.classList.remove('selected'));
      div.classList.add('selected'); selectedLeft = div;
    };
    leftEl.appendChild(div);
  });
  rightItems.forEach(item=>{
    const div = document.createElement('div');
    div.className='match-item'; div.textContent = item.text; div.dataset.idx = item.idx;
    div.onclick = ()=>{
      if(!selectedLeft || div.classList.contains('correct')) return;
      if(selectedLeft.dataset.idx === div.dataset.idx){
        selectedLeft.classList.remove('selected'); selectedLeft.classList.add('correct');
        div.classList.add('correct'); solved++; selectedLeft = null;
        if(solved===pairs.length) document.getElementById(prefix+'-result').textContent = doneMsg;
      } else {
        div.classList.add('wrong'); setTimeout(()=>div.classList.remove('wrong'), 500);
      }
    };
    rightEl.appendChild(div);
  });
}
